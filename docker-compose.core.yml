name: aetheris-core-only

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aetheris
      POSTGRES_USER: aetheris
      POSTGRES_PASSWORD: ${AETHERIS_POSTGRES_PASSWORD:?Set AETHERIS_POSTGRES_PASSWORD to a unique local secret}
    volumes:
      - aetheris_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aetheris -d aetheris"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    environment:
      # redis-cli inherits REDISCLI_AUTH for maintenance and health probes.
      REDISCLI_AUTH: ${AETHERIS_REDIS_PASSWORD:?Set AETHERIS_REDIS_PASSWORD to a unique Redis secret}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${AETHERIS_REDIS_PASSWORD:?Set AETHERIS_REDIS_PASSWORD to a unique Redis secret}"]
    volumes:
      - aetheris_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: aetheris
      RABBITMQ_DEFAULT_PASS: ${AETHERIS_RABBITMQ_PASSWORD:?Set AETHERIS_RABBITMQ_PASSWORD to a unique local secret}
    volumes:
      - aetheris_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  user-service:
    build: ./user-service
    environment:
      AETHERIS_JWT_SECRET: ${AETHERIS_JWT_SECRET:-}
      AETHERIS_BACKEND_JWT_ISSUER: ${AETHERIS_BACKEND_JWT_ISSUER:-}
      AETHERIS_BACKEND_JWT_AUDIENCE: ${AETHERIS_USER_JWT_AUDIENCE:-}
      AETHERIS_BACKEND_JWT_RS256_PUBLIC_KEY_PEM: ${AETHERIS_JWT_RS256_PUBLIC_KEY_PEM:-}
      AETHERIS_BACKEND_JWT_RS256_KEY_ID: ${AETHERIS_JWT_RS256_KEY_ID:-}
      AETHERIS_BACKEND_JWT_RS256_STAGED_PUBLIC_KEY_PEM: ${AETHERIS_JWT_RS256_STAGED_PUBLIC_KEY_PEM:-}
      AETHERIS_BACKEND_JWT_RS256_STAGED_KEY_ID: ${AETHERIS_JWT_RS256_STAGED_KEY_ID:-}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aetheris
      SPRING_DATASOURCE_USERNAME: aetheris
      SPRING_DATASOURCE_PASSWORD: ${AETHERIS_POSTGRES_PASSWORD:?Set AETHERIS_POSTGRES_PASSWORD to a unique local secret}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${AETHERIS_REDIS_PASSWORD:?Set AETHERIS_REDIS_PASSWORD to a unique Redis secret}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: aetheris
      SPRING_RABBITMQ_PASSWORD: ${AETHERIS_RABBITMQ_PASSWORD:?Set AETHERIS_RABBITMQ_PASSWORD to a unique local secret}
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"

  identity-service:
    build: ./identity-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aetheris
      SPRING_DATASOURCE_USERNAME: aetheris
      SPRING_DATASOURCE_PASSWORD: ${AETHERIS_POSTGRES_PASSWORD:?Set AETHERIS_POSTGRES_PASSWORD to a unique local secret}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      AETHERIS_JWT_SECRET: ${AETHERIS_JWT_SECRET:-}
      AETHERIS_IDENTITY_JWT_ISSUER: ${AETHERIS_IDENTITY_JWT_ISSUER:-}
      AETHERIS_IDENTITY_JWT_AUDIENCE: ${AETHERIS_IDENTITY_JWT_AUDIENCE:-}
      AETHERIS_IDENTITY_JWT_RS256_PRIVATE_KEY_PEM: ${AETHERIS_IDENTITY_JWT_RS256_PRIVATE_KEY_PEM:-}
      AETHERIS_IDENTITY_JWT_RS256_KEY_ID: ${AETHERIS_IDENTITY_JWT_RS256_KEY_ID:-}
      AETHERIS_BROWSER_REFRESH_COOKIE_SECURE: "${AETHERIS_BROWSER_REFRESH_COOKIE_SECURE:-true}"
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8082"

  audit-service:
    build: ./audit-service
    environment:
      AETHERIS_JWT_SECRET: ${AETHERIS_JWT_SECRET:-}
      AETHERIS_BACKEND_JWT_ISSUER: ${AETHERIS_BACKEND_JWT_ISSUER:-}
      AETHERIS_BACKEND_JWT_AUDIENCE: ${AETHERIS_AUDIT_JWT_AUDIENCE:-}
      AETHERIS_BACKEND_JWT_RS256_PUBLIC_KEY_PEM: ${AETHERIS_JWT_RS256_PUBLIC_KEY_PEM:-}
      AETHERIS_BACKEND_JWT_RS256_KEY_ID: ${AETHERIS_JWT_RS256_KEY_ID:-}
      AETHERIS_BACKEND_JWT_RS256_STAGED_PUBLIC_KEY_PEM: ${AETHERIS_JWT_RS256_STAGED_PUBLIC_KEY_PEM:-}
      AETHERIS_BACKEND_JWT_RS256_STAGED_KEY_ID: ${AETHERIS_JWT_RS256_STAGED_KEY_ID:-}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aetheris
      SPRING_DATASOURCE_USERNAME: aetheris
      SPRING_DATASOURCE_PASSWORD: ${AETHERIS_POSTGRES_PASSWORD:?Set AETHERIS_POSTGRES_PASSWORD to a unique local secret}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: aetheris
      SPRING_RABBITMQ_PASSWORD: ${AETHERIS_RABBITMQ_PASSWORD:?Set AETHERIS_RABBITMQ_PASSWORD to a unique local secret}
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:8083:8083"

  gateway:
    build: ./gateway
    environment:
      AETHERIS_JWT_SECRET: ${AETHERIS_JWT_SECRET:-}
      AETHERIS_GATEWAY_JWT_ISSUER: ${AETHERIS_IDENTITY_JWT_ISSUER:-}
      AETHERIS_GATEWAY_JWT_USERS_AUDIENCE: ${AETHERIS_USER_JWT_AUDIENCE:-}
      AETHERIS_GATEWAY_JWT_AUDIT_AUDIENCE: ${AETHERIS_AUDIT_JWT_AUDIENCE:-}
      AETHERIS_GATEWAY_JWT_ORCHESTRATOR_AUDIENCE: ${AETHERIS_ORCHESTRATOR_JWT_AUDIENCE:-}
      AETHERIS_GATEWAY_JWT_RS256_PUBLIC_KEY_PEM: ${AETHERIS_JWT_RS256_PUBLIC_KEY_PEM:-}
      AETHERIS_GATEWAY_JWT_RS256_KEY_ID: ${AETHERIS_JWT_RS256_KEY_ID:-}
      AETHERIS_GATEWAY_JWT_RS256_STAGED_PUBLIC_KEY_PEM: ${AETHERIS_JWT_RS256_STAGED_PUBLIC_KEY_PEM:-}
      AETHERIS_GATEWAY_JWT_RS256_STAGED_KEY_ID: ${AETHERIS_JWT_RS256_STAGED_KEY_ID:-}
      AETHERIS_ORCHESTRATOR_URI: ${AETHERIS_ORCHESTRATOR_URI:-http://orchestrator-runtime:8090}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${AETHERIS_REDIS_PASSWORD:?Set AETHERIS_REDIS_PASSWORD to a unique Redis secret}
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      redis:
        condition: service_healthy
      user-service:
        condition: service_started
      identity-service:
        condition: service_started
      audit-service:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"

  dashboard:
    build: ./dashboard
    depends_on:
      - gateway
    ports:
      - "127.0.0.1:3000:80"

networks:
  default:
    name: aetheris-core-boundary

volumes:
  aetheris_pg:
  aetheris_redis:
  aetheris_rabbitmq: