spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aetheris}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:aetheris}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:aetheris}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

aetheris.local-model.base-url=${AETHERIS_LOCAL_MODEL_BASE_URL:http://localhost:11434}
aetheris.local-model.model=${AETHERIS_LOCAL_MODEL:qwen2.5:3b}

aetheris.vault.environment-prefix=${AETHERIS_VAULT_ENVIRONMENT_PREFIX:AETHERIS_SECRET_}
aetheris.cloud-model.enabled=${AETHERIS_CLOUD_MODEL_ENABLED:false}
aetheris.cloud-model.provider-id=${AETHERIS_CLOUD_MODEL_PROVIDER_ID:openai-compatible}
aetheris.cloud-model.base-url=${AETHERIS_CLOUD_MODEL_BASE_URL:}
aetheris.cloud-model.model=${AETHERIS_CLOUD_MODEL:}
aetheris.cloud-model.credential-alias=${AETHERIS_CLOUD_MODEL_CREDENTIAL_ALIAS:cloud-model-api-key}
aetheris.cloud-model.zero-cost=${AETHERIS_CLOUD_MODEL_ZERO_COST:false}
aetheris.cloud-model.daily-quota-units=${AETHERIS_CLOUD_MODEL_DAILY_QUOTA_UNITS:0}
aetheris.cloud-model.cost-per-thousand-units-usd=${AETHERIS_CLOUD_MODEL_COST_PER_THOUSAND_UNITS_USD:0}
aetheris.cloud-model.daily-budget-usd=${AETHERIS_CLOUD_MODEL_DAILY_BUDGET_USD:0}

aetheris.execution.workspace-root=${AETHERIS_WORKSPACE_ROOT:./workspace}
aetheris.execution.workspace-write-enabled=${AETHERIS_WORKSPACE_WRITE_ENABLED:false}
aetheris.execution.max-file-bytes=${AETHERIS_MAX_FILE_BYTES:1048576}
aetheris.execution.allowed-commands=${AETHERIS_ALLOWED_COMMANDS:git,mvn,npm,node,java,javac}
aetheris.execution.command-timeout-seconds=${AETHERIS_COMMAND_TIMEOUT_SECONDS:30}
aetheris.execution.max-command-output-chars=${AETHERIS_MAX_COMMAND_OUTPUT_CHARS:12000}
aetheris.execution.github.credential-alias=${AETHERIS_GITHUB_CREDENTIAL_ALIAS:github-api-token}
aetheris.execution.github.allowed-repositories=${AETHERIS_GITHUB_ALLOWED_REPOSITORIES:}
aetheris.mcp.allowed-local-hosts=${AETHERIS_MCP_ALLOWED_LOCAL_HOSTS:localhost,127.0.0.1,::1,host.docker.internal}
