services:
  orchestrator-service:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AETHERIS_OAUTH_GITHUB_CLIENT_ID: ${AETHERIS_OAUTH_GITHUB_CLIENT_ID}
      AETHERIS_OAUTH_GITHUB_CLIENT_SECRET: ${AETHERIS_OAUTH_GITHUB_CLIENT_SECRET}
      AETHERIS_OAUTH_GITHUB_AUTH_URL: http://host.docker.internal:19090/github/authorize
      AETHERIS_OAUTH_GITHUB_TOKEN_URL: http://host.docker.internal:19090/github/token
      AETHERIS_OAUTH_GITHUB_USERINFO_URL: http://host.docker.internal:19090/github/user
      AETHERIS_OAUTH_GOOGLE_CLIENT_ID: ${AETHERIS_OAUTH_GOOGLE_CLIENT_ID}
      AETHERIS_OAUTH_GOOGLE_CLIENT_SECRET: ${AETHERIS_OAUTH_GOOGLE_CLIENT_SECRET}
      AETHERIS_OAUTH_GOOGLE_AUTH_URL: http://host.docker.internal:19090/google/authorize
      AETHERIS_OAUTH_GOOGLE_TOKEN_URL: http://host.docker.internal:19090/google/token
      AETHERIS_OAUTH_GOOGLE_USERINFO_URL: http://host.docker.internal:19090/google/userinfo
