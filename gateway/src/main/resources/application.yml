server:
  port: 8080

spring:
  application:
    name: aetheris-gateway
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD}
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 5s
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                allowedMethods: "*"
                allowedHeaders: "*"
          routes:
            - id: identity-service
              uri: http://identity-service:8082
              predicates:
                - Path=/api/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@aetherisKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: identityCircuit
                    fallbackUri: forward:/fallback/identity
            - id: user-service-read
              uri: http://user-service:8081
              predicates:
                - Path=/api/users/**
                - Method=GET,HEAD
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@aetherisKeyResolver}"
                - name: Retry
                  args:
                    retries: 2
                    statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                    methods: GET,HEAD
                    backoff:
                      firstBackoff: 100ms
                      maxBackoff: 500ms
                      factor: 2
                      basedOnPreviousValue: false
                - name: CircuitBreaker
                  args:
                    name: userReadCircuit
                    fallbackUri: forward:/fallback/users
            - id: user-service-write
              uri: http://user-service:8081
              predicates:
                - Path=/api/users/**
                - Method=POST,PUT,PATCH,DELETE
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@aetherisKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: userWriteCircuit
                    fallbackUri: forward:/fallback/users
            - id: audit-service
              uri: http://audit-service:8083
              predicates:
                - Path=/api/events/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@aetherisKeyResolver}"
                - name: Retry
                  args:
                    retries: 2
                    statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                    methods: GET,HEAD
                    backoff:
                      firstBackoff: 100ms
                      maxBackoff: 500ms
                      factor: 2
                      basedOnPreviousValue: false
                - name: CircuitBreaker
                  args:
                    name: auditCircuit
                    fallbackUri: forward:/fallback/events
            - id: orchestrator-service
              uri: ${AETHERIS_ORCHESTRATOR_URI:http://orchestrator-service:8090}
              predicates:
                - Path=/api/orchestrator/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                    redis-rate-limiter.requestedTokens: 1
                    key-resolver: "#{@aetherisKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: orchestratorCircuit
                    fallbackUri: forward:/fallback/orchestrator

aetheris:
  jwt:
    # HMAC remains the default until a coordinated, approved deployment migration.
    mode: ${AETHERIS_JWT_MODE:hmac}
    secret: ${AETHERIS_JWT_SECRET:}
    kid: ${AETHERIS_JWT_KID:}
    # Optional, explicitly bounded two-public-key overlap; remove both to retire old key.
    previous-kid: ${AETHERIS_JWT_PREVIOUS_KID:}
    # Required with any previous public key; UTC epoch seconds. Runtime cutoff is absolute.
    previous-key-not-after-epoch-seconds: ${AETHERIS_JWT_PREVIOUS_KEY_NOT_AFTER_EPOCH_SECONDS:}
    rsa-previous-public-key-x509-base64: ${AETHERIS_JWT_RSA_PREVIOUS_PUBLIC_KEY_X509_B64:}
    rsa-public-key-x509-base64: ${AETHERIS_JWT_RSA_PUBLIC_KEY_X509_B64:}
    issuer: ${AETHERIS_JWT_ISSUER:aetheris-identity}
    audience: ${AETHERIS_JWT_AUDIENCE:aetheris-api}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        automaticTransitionFromOpenToHalfOpenEnabled: true
  timelimiter:
    configs:
      default:
        timeoutDuration: 4s
        cancelRunningFuture: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

info:
  app:
    name: Aetheris Gateway
    stage: 8
