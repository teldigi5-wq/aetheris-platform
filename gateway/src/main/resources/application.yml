server:
  port: 8080

spring:
  application:
    name: aetheris-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: identity-service
          uri: http://identity-service:8082
          predicates:
            - Path=/api/auth/**
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**

aetheris:
  jwt:
    secret: ${AETHERIS_JWT_SECRET:change-me-local-development-secret-32chars}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

info:
  app:
    name: Aetheris Gateway
    stage: 2.3
