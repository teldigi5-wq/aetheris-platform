[package]
name = "syntra-native-checkpoint-sse"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false
description = "Review-gated native read-only owner checkpoint SSE client; no Tauri activation"

[dependencies]
reqwest = { version = "=0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
zeroize = "=1.8.2"
tokio = { version = "=1.47.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
