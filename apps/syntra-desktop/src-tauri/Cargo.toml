[package]
name = "syntra-desktop"
version = "0.4.0"
description = "Owner-facing Syntra desktop shell for the Aetheris platform"
authors = ["Poojana Kaveesh"]
edition = "2021"
rust-version = "1.90"
publish = false

[[bin]]
name = "Syntra"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
# Keep the 2.11.x runtime API aligned with tauri=2.11.5.
# Unrestricted 2.x transitive resolution upgraded runtime-wry to 2.12.1
# and broke the pre-PC Windows CI build (monitor/menu API mismatch).
tauri-runtime = "=2.11.3"
tauri-runtime-wry = "=2.11.4"
tauri-utils = "=2.9.3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
