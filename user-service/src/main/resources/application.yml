server:
  port: 8081

spring:
  application:
    name: aetheris-user-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aetheris}
    username: ${SPRING_DATASOURCE_USERNAME:aetheris}
    password: ${SPRING_DATASOURCE_PASSWORD:aetheris}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:aetheris}
    password: ${SPRING_RABBITMQ_PASSWORD:aetheris}
  cache:
    type: redis
    redis:
      time-to-live: 60s
      cache-null-values: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

info:
  app:
    name: Aetheris User Service
    stage: 5

# A missing signing key fails startup; never accept an implicit development secret.
aetheris:
  jwt:
    secret: ${AETHERIS_JWT_SECRET:}
    algorithm: ${AETHERIS_JWT_ALGORITHM:HS256}
    rsa-public-key-pem: ${AETHERIS_JWT_RSA_PUBLIC_KEY_PEM:}
    key-id: ${AETHERIS_JWT_RS256_KEY_ID:}
    issuer: ${AETHERIS_JWT_ISSUER:aetheris-identity}
    audience: ${AETHERIS_JWT_AUDIENCE:aetheris-api}
  gateway:
    workload-mtls-required: ${AETHERIS_BACKEND_GATEWAY_MTLS_REQUIRED:false}
    workload-spiffe-id: ${AETHERIS_BACKEND_GATEWAY_SPIFFE_ID:}
