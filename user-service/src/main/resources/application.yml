aetheris:
  jwt:
    # HMAC remains the default until a coordinated, approved deployment migration.
    mode: ${AETHERIS_JWT_MODE:hmac}
    secret: ${AETHERIS_JWT_SECRET:}
    kid: ${AETHERIS_JWT_KID:}
    rsa-public-key-x509-base64: ${AETHERIS_JWT_RSA_PUBLIC_KEY_X509_B64:}
    issuer: ${AETHERIS_JWT_ISSUER:aetheris-identity}
    audience: ${AETHERIS_JWT_AUDIENCE:aetheris-api}

server:
  port: 8081

spring:
  application:
    name: aetheris-user-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aetheris}
    username: ${SPRING_DATASOURCE_USERNAME:aetheris}
    password: ${SPRING_DATASOURCE_PASSWORD}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:aetheris}
    password: ${SPRING_RABBITMQ_PASSWORD}
  cache:
    type: redis
    redis:
      time-to-live: 60s
      cache-null-values: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

info:
  app:
    name: Aetheris User Service
    stage: 5
