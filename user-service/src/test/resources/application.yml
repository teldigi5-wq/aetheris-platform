spring:
  datasource:
    url: jdbc:h2:mem:aetheris;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  # H2 unit/HTTP tests build their schema with Hibernate; Flyway migrations are
  # PostgreSQL-specific and proven against real PostgreSQL in CI.
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop

# Test-only HMAC key; never use this value in production.
aetheris:
  jwt:
    secret: test-only-direct-backend-auth-hmac-secret-at-least-32-bytes
