name: Phase 13 Local Adapter Activation Governance

on:
  pull_request:
    branches:
      - feature/syntra-aetheris-foundation-v2
  push:
    branches:
      - feature/syntra-aetheris-foundation-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase13-local-adapter-activation-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-adapter-activation-governance:
    name: Artifact identity, Stage 33 authority and rollback proof
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Phase 13 local adapter activation governance proof
        run: >-
          ./mvnw -B -pl orchestrator-service
          -Dtest=Phase13AdapterActivationGovernanceTest
          test

      - name: Verify Slice 9 authority and truth boundaries
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            orchestrator-service/src/main/java/io/aetheris/orchestrator/stage33/AdapterActivationAuthorityBridge.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdapterArtifactIdentity.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdapterArtifactObservation.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/LocalAdapterActivationPort.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdapterLifecycleStatus.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdapterLifecycleResult.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdapterLifecycleRequest.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraAdapterLifecycleGovernanceService.java
            orchestrator-service/src/test/java/io/aetheris/orchestrator/syntracore/Phase13AdapterActivationGovernanceTest.java
            docs/phase13-local-adapter-activation-governance.md
          )

          for required_file in "${required_files[@]}"; do
            test -f "$required_file" || {
              echo "Missing Phase 13 Slice 9 surface: $required_file" >&2
              exit 1
            }
          done

          grep -q "CrossSystemGovernanceEngine" \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/stage33/AdapterActivationAuthorityBridge.java
          grep -q "GovernanceVerificationService" \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/stage33/AdapterActivationAuthorityBridge.java
          grep -q "ScopedOwnerApproval" \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/stage33/AdapterActivationAuthorityBridge.java
          grep -q "DETACH_ADAPTER" \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraAdapterLifecycleGovernanceService.java
          grep -q "aetheris-adapter-artifact://sha256/" \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdapterArtifactIdentity.java
          grep -q "promotionGovernance.decide" \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraAdapterLifecycleGovernanceService.java

          slice_sources=(
            orchestrator-service/src/main/java/io/aetheris/orchestrator/stage33/AdapterActivationAuthorityBridge.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdapterArtifactIdentity.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdapterArtifactObservation.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/LocalAdapterActivationPort.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdapterLifecycleStatus.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdapterLifecycleResult.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdapterLifecycleRequest.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraAdapterLifecycleGovernanceService.java
          )

          if grep -E "ProcessBuilder|Runtime\.getRuntime|HttpClient|WebClient|RestTemplate|FileOutputStream|Files\.write|Files\.delete|Files\.move" "${slice_sources[@]}"; then
            echo "Slice 9 must not implement subprocess, network, installer, or filesystem effects" >&2
            exit 1
          fi

          if grep -R "io.aetheris.orchestrator.\(tool\|connector\|browser\|computeruse\)" "${slice_sources[@]}"; then
            echo "Slice 9 adapter lifecycle must not gain tool, connector, browser, or computer-use authority" >&2
            exit 1
          fi

          echo "Phase 13 Slice 9 local adapter activation governance boundaries verified."
