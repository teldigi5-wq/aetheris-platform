name: Core Foundation Lock Regeneration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-core-evidence:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Set up Node 22.23.2
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
      - name: Regenerate npm lock
        working-directory: dashboard
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Set up Python 3.13.15
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.15'
      - name: Set up Java 21.0.12
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Regenerate core Maven dependency trees
        run: |
          mkdir -p build-evidence/maven
          for module in gateway user-service identity-service audit-service; do
            ./mvnw -f "$module/pom.xml" org.apache.maven.plugins:maven-dependency-plugin:3.11.0:tree \
              -Dscope=runtime \
              -DoutputFile="$GITHUB_WORKSPACE/build-evidence/maven/$module.txt"
          done
      - name: Verify and hash core evidence
        run: python scripts/check_dependency_lockdown.py --scope core --write-hashes
      - name: Commit regenerated core evidence
        run: |
          git config user.name "aetheris-hardening-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/package-lock.json \
            build-evidence/maven/gateway.txt \
            build-evidence/maven/user-service.txt \
            build-evidence/maven/identity-service.txt \
            build-evidence/maven/audit-service.txt \
            build-evidence/core-dependency-lock-sha256.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore: regenerate core dependency evidence"
          git push
