name: Phase 13 Adapter Promotion Governance

on:
  pull_request:
    branches:
      - feature/syntra-aetheris-foundation-v2
  push:
    branches:
      - feature/syntra-aetheris-foundation-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase13-adapter-promotion-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adapter-promotion-governance:
    name: Candidate evaluation and promotion governance proof
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Phase 13 adapter promotion governance proof
        run: >-
          ./mvnw -B -pl orchestrator-service
          -Dtest=Phase13AdapterPromotionGovernanceTest
          test

      - name: Verify Slice 8 governance boundaries
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdapterPromotionStatus.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdapterPromotionPolicy.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdapterPromotionEvidence.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdapterPromotionDecision.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraAdapterPromotionGovernanceService.java
            orchestrator-service/src/test/java/io/aetheris/orchestrator/syntracore/Phase13AdapterPromotionGovernanceTest.java
            docs/phase13-adapter-promotion-governance.md
          )

          for required_file in "${required_files[@]}"; do
            test -f "$required_file" || {
              echo "Missing Phase 13 Slice 8 surface: $required_file" >&2
              exit 1
            }
          done

          grep -q "APPROVED_FOR_LOCAL_USE" \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdapterPromotionStatus.java
          grep -q "OWNER_APPROVAL_REQUIRED" \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraAdapterPromotionGovernanceService.java
          grep -q "OWNER_HARDWARE_EVIDENCE_REQUIRED" \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraAdapterPromotionGovernanceService.java
          grep -q "DETACH_ADAPTER" \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdapterPromotionDecision.java
          grep -q "baseWeightsMutable" \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdapterPromotionDecision.java

          slice_sources=(
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdapterPromotionStatus.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdapterPromotionPolicy.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdapterPromotionEvidence.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdapterPromotionDecision.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraAdapterPromotionGovernanceService.java
          )

          if grep -E "ProcessBuilder|Runtime\.getRuntime|HttpClient|WebClient|RestTemplate|FileOutputStream|Files\.write" "${slice_sources[@]}"; then
            echo "Slice 8 must remain a non-executing, non-network, in-memory governance layer" >&2
            exit 1
          fi

          if grep -R "io.aetheris.orchestrator.\(tool\|connector\|approval\)" "${slice_sources[@]}"; then
            echo "Slice 8 promotion governance must not gain execution authority" >&2
            exit 1
          fi

          echo "Phase 13 Slice 8 adapter promotion governance boundaries verified."
