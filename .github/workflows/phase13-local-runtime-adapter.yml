name: Phase 13 Local Runtime Adapter

on:
  pull_request:
    branches:
      - feature/syntra-aetheris-foundation-v2
  push:
    branches:
      - feature/syntra-aetheris-foundation-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase13-local-runtime-adapter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-runtime-adapter:
    name: Bounded local runtime and discovery proof
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Phase 13 local runtime adapter proof
        run: >-
          ./mvnw -B -f orchestrator-service/pom.xml
          -Dtest=Phase13LocalRuntimeAdapterTest
          test

      - name: Verify bounded local-runtime surfaces
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/LocalRuntimeBounds.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/LocalRuntimeEndpoint.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/LocalProviderDiscovery.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/LocalHardwareDiscovery.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/JvmLocalHardwareProbe.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/OllamaLocalRuntime.java
            orchestrator-service/src/test/java/io/aetheris/orchestrator/syntracore/Phase13LocalRuntimeAdapterTest.java
            docs/phase13-local-runtime-adapter.md
          )

          for required_file in "${required_files[@]}"; do
            test -f "$required_file" || {
              echo "Missing Phase 13 local runtime surface: $required_file" >&2
              exit 1
            }
          done

          grep -q "explicit loopback host" orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/LocalRuntimeEndpoint.java
          grep -q "maxStreamChunks" orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/LocalRuntimeBounds.java
          grep -q "application/x-ndjson" orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/OllamaLocalRuntime.java
          grep -q "gpuEvidenceAvailable" orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/LocalHardwareDiscovery.java
          grep -q "does not claim" docs/phase13-local-runtime-adapter.md

          echo "Phase 13 local runtime adapter surfaces verified."
