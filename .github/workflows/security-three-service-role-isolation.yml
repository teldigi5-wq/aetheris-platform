      - 'audit-service/src/test/java/io/aetheris/audit/security/DirectApiIssuerAudiencePolicyTest.java'
      - 'scripts/security/rehearse_shared_db_three_roles.sh'
      - 'tests/test_three_service_roles.py'
      - 'docs/security/THREE_SERVICE_DB_ROLE_REHEARSAL_20261027.md'
permissions:
  contents: read
jobs:
  real-audit-migration-and-postgres-role-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify exact immutable PR head and safety contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python3 -m unittest discover -s tests -p test_three_service_roles.py -v
          python3 -m unittest discover -s tests -p test_rs256_compose_contract.py -v
          python3 -m unittest discover -s tests -p test_helm_deployment_safety.py -v
          helm version --short
          python3 -m unittest discover -s tests -p test_helm_rs256_external_keys.py -v
          python3 -m unittest discover -s tests -p test_shared_db_scoped_flyway.py -v
          bash -n scripts/security/rehearse_shared_db_three_roles.sh
          bash -n scripts/security/run_gateway_netty_tls_lab.sh
      - name: Real synthetic PostgreSQL 16 migrations with six authenticated roles
        shell: bash
        run: |
          set -euo pipefail
          AETHERIS_THREE_ROLE_SYNTHETIC_ONLY=yes bash scripts/security/rehearse_shared_db_three_roles.sh
          echo THREE_SERVICE_SCOPED_FLYWAY_AND_DATABASE_GRANT_PROOF_COMPLETED
      - name: Full four-module Java regression, Audit default disabled
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -f pom.xml test
      - name: Real disposable Netty TLS socket client-certificate, SPIFFE and CA denials
        shell: bash
        run: |
          set -euo pipefail
          AETHERIS_NETTY_MTLS_LAB_SYNTHETIC_ONLY=yes bash scripts/security/run_gateway_netty_tls_lab.sh
      - name: Outbound Gateway HTTPS client mTLS profile and route preflight
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -f gateway/pom.xml -Dtest=GatewayOutboundMutualTlsPreflightTest test
          echo GATEWAY_OUTBOUND_MTLS_PROFILE_AND_ROUTE_PREFLIGHT_PASS
      - name: Synthetic Gateway mutual TLS identity at actual protected servlet boundary
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -f user-service/pom.xml -Dtest=GatewayMutualTlsWorkloadPolicyTest test
          ./mvnw -B -ntp -f audit-service/pom.xml -Dtest=GatewayMutualTlsWorkloadPolicyTest test
          echo GATEWAY_MTLS_SPIFFE_CERTIFICATE_ATTRIBUTE_DENIAL_PROOF_PASS
      - name: Real User and Audit signed principal role-scope denial regression
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -f user-service/pom.xml -Dtest=DirectApiPrincipalCeilingTest test
          ./mvnw -B -ntp -f audit-service/pom.xml -Dtest=DirectApiPrincipalCeilingTest test
          echo USER_AUDIT_SIGNED_ROLE_SCOPE_CEILING_REAL_FILTER_PASS
      - name: Actual Identity-issued RS256 interoperability across four Java modules
        shell: bash
        env:
          AETHERIS_INTEROP_MUST_RUN: "yes"
        run: |
          set -euo pipefail
          fixture_dir="$(mktemp -d)"
          trap 'rm -rf -- "$fixture_dir"' EXIT
          chmod 700 "$fixture_dir"
          fixture="$fixture_dir/real-identity-signed.properties"
          ./mvnw -B -ntp -f identity-service/pom.xml \
            -Dtest=RealIdentityInteroperabilityFixtureTest \
            -Daetheris.jwt.interop.fixture="$fixture" test
          test -s "$fixture"
          for spec in \
            "gateway/pom.xml:RealIdentityToGatewayInteropTest" \
            "user-service/pom.xml:RealIdentityToBackendInteropTest" \
            "audit-service/pom.xml:RealIdentityToBackendInteropTest"; do
            module="${spec%%:*}"
            test_name="${spec#*:}"
            ./mvnw -B -ntp -f "$module" \
              -Dtest="$test_name" \
              -Daetheris.jwt.interop.fixture="$fixture" test
          done
          echo AETHERIS_REAL_IDENTITY_TO_THREE_RESOURCE_FILTERS_RS256_CONTRACT_PASS
      - name: Production closure must remain NO_GO
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/security_closure_preflight.py --assert-blocked > closure.json
          python3 - <<'PY'
          import json
          with open("closure.json", encoding="utf-8") as stream:
              report=json.load(stream)
          assert report["status"] == "NO_GO"
          assert report["safe_to_merge_or_deploy"] is False
          assert len(report["independent_release_attestations_required"]) == 9
          print("THREE_SERVICE_ROLE_REHEARSAL_NOT_RELEASE_APPROVAL")
          PY
      - name: Destroy disposable database even on failure
        if: always()
        shell: bash
        run: |
          docker ps --filter 'name=^/aetheris-three-roles-' --format '{{.Names}}' |
            while IFS= read -r name; do
              docker rm -f "$name" >/dev/null 2>&1 || true
            done
          echo THREE_SERVICE_SYNTHETIC_CONTAINER_CLEANUP_COMPLETE
