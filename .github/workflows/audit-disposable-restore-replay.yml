name: B4Y Audit Disposable Backup Restore And Flyway Recovery
on:
  pull_request:
    branches: [test/audit-flyway-history-content-preflight-20261026]
    paths:
      - 'tests/security/docker-compose.audit-restore-overlay.yml'
      - 'tests/security/probe_audit_restored.py'
      - 'tests/test_audit_restore_boundary.py'
      - '.github/workflows/audit-disposable-restore-replay.yml'
      - 'docs/database/AUDIT_RESTORE_REHEARSAL_B4Y_20261026.md'
      - 'README.md'
      - 'docs/current-release-roadmap-20261025.md'
permissions:
  contents: read
jobs:
  audit-disposable-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Test-only source and combined topology guards
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTIONS:-}" = true
          test "$GITHUB_REPOSITORY" = teldigi5-wq/aetheris-platform
          python3 -m unittest discover -s tests -p 'test_audit_restore_boundary.py' -v
          test "$(git hash-object audit-service/src/main/resources/db/migration/V1__create_audit_events.sql)" = 727fe44f369d7ff1e8d0db2dddf850215cdf13f1
          docker compose -f tests/security/docker-compose.backend-auth-probe.yml -f tests/security/docker-compose.audit-history-overlay.yml -f tests/security/docker-compose.audit-restore-overlay.yml config --format json > "$RUNNER_TEMP/b4y-topology.json"
          python3 - "$RUNNER_TEMP/b4y-topology.json" <<'PY'
          import json, sys
          from pathlib import Path
          data=json.loads(Path(sys.argv[1]).read_text())
          assert not data.get("volumes")
          assert len(data["networks"])==1 and all(x.get("internal") is True for x in data["networks"].values())
          for svc in data["services"].values():
              assert not svc.get("ports") and not svc.get("network_mode")
              assert not svc.get("privileged") and not svc.get("devices")
          pg=data["services"]["postgres"]
          assert any("postgresql/data" in str(v) for v in pg["tmpfs"])
          for name,db in (("audit-fresh","aetheris_audit_fresh"),("audit-restored","aetheris_audit_restored"),("audit-restore-corrupted","aetheris_audit_corrupted")):
              svc=data["services"][name]
              assert svc["environment"]["SPRING_DATASOURCE_URL"]=="jdbc:postgresql://postgres:5432/"+db
              assert "SPRING_FLYWAY_BASELINE_ON_MIGRATE" not in svc["environment"]
              assert "SPRING_FLYWAY_TABLE" not in svc["environment"]
              assert svc["image"]=="aetheris-b4t-audit-test-only:local"
          probe=data["services"]["audit-restore-probe"]
          assert probe["read_only"] and "ALL" in probe["cap_drop"]
          print("B4Y_RECOVERY_PRIVATE_TMPFS_TOPOLOGY_ONLY")
          PY
      - name: Build unchanged real Audit production Dockerfile
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f tests/security/docker-compose.backend-auth-probe.yml -f tests/security/docker-compose.audit-history-overlay.yml -f tests/security/docker-compose.audit-restore-overlay.yml build audit-fresh
      - name: Start fresh disposable Audit Flyway V1 and insert one synthetic record
        shell: bash
        run: |
          set -euo pipefail
          C='docker compose -f tests/security/docker-compose.backend-auth-probe.yml -f tests/security/docker-compose.audit-history-overlay.yml -f tests/security/docker-compose.audit-restore-overlay.yml'
          $C up --no-build --wait -d postgres rabbitmq
          $C exec -T postgres createdb -U probe aetheris_audit_fresh
          $C up --no-build -d audit-fresh
          found=0
          for i in $(seq 1 90); do
            count=$($C exec -T postgres psql -XqAt -U probe -d aetheris_audit_fresh -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM flyway_audit_schema_history WHERE version='1' AND type='SQL' AND success" 2>/dev/null || true)
            if [ "$count" = 1 ]; then found=1; break; fi
            sleep 2
          done
          test "$found" -eq 1 || { echo B4Y_REAL_FLYWAY_V1_FAILED; exit 1; }
          $C exec -T postgres psql -Xq -U probe -d aetheris_audit_fresh -v ON_ERROR_STOP=1 -c "INSERT INTO audit_events(event_id,event_type,occurred_at,user_id,name,email) VALUES ('B4Y-CI-SYNTHETIC','CI_ONLY_BACKUP_REHEARSAL','2026-01-01T01:02:03Z',42,NULL,NULL)"
          $C exec -T postgres psql -XqAt -U probe -d aetheris_audit_fresh -v ON_ERROR_STOP=1 -c "SELECT (count(*)=1 AND bool_and(name IS NULL AND email IS NULL)) FROM audit_events" | grep -qx t
          echo B4Y_REAL_AUDIT_V1_AND_SYNTHETIC_EVENT_READY
      - name: Create immutable disposable backup archive and restore into TWO NEW databases
        shell: bash
        run: |
          set -euo pipefail
          C='docker compose -f tests/security/docker-compose.backend-auth-probe.yml -f tests/security/docker-compose.audit-history-overlay.yml -f tests/security/docker-compose.audit-restore-overlay.yml'
          $C exec -T postgres sh -ec '
            pg_dump -U probe -d aetheris_audit_fresh -Fc --no-owner --no-privileges -f /tmp/b4y-audit.dump
            test -s /tmp/b4y-audit.dump
            sha256sum /tmp/b4y-audit.dump > /tmp/b4y-audit.sha256
            pg_restore --list /tmp/b4y-audit.dump | grep -q audit_events
            pg_restore --list /tmp/b4y-audit.dump | grep -q flyway_audit_schema_history
            createdb -U probe aetheris_audit_restored
            pg_restore --exit-on-error -U probe -d aetheris_audit_restored --no-owner --no-privileges /tmp/b4y-audit.dump
            createdb -U probe aetheris_audit_corrupted
            pg_restore --exit-on-error -U probe -d aetheris_audit_corrupted --no-owner --no-privileges /tmp/b4y-audit.dump
            sha256sum -c /tmp/b4y-audit.sha256
            for db in aetheris_audit_fresh aetheris_audit_restored; do
              pg_dump -U probe -d "$db" -s --no-owner --no-privileges > "/tmp/b4y-$db.schema"
              pg_dump -U probe -d "$db" -a --no-owner --no-privileges > "/tmp/b4y-$db.data"
              for type in schema data; do
                grep -Ev "^\\\\(restrict|unrestrict) " "/tmp/b4y-$db.$type" > "/tmp/b4y-$db.$type.canonical"
              done
            done
            cmp /tmp/b4y-aetheris_audit_fresh.schema.canonical /tmp/b4y-aetheris_audit_restored.schema.canonical
            cmp /tmp/b4y-aetheris_audit_fresh.data.canonical /tmp/b4y-aetheris_audit_restored.data.canonical
            echo B4Y_RECOVERY_BACKUP_ARCHIVE_VERIFIED_TWO_RESTORES_EQUAL_SOURCE
          '
      - name: Run both B4W schema and B4X Flyway history preflights on restored DB
        shell: bash
        run: |
          set -euo pipefail
          C='docker compose -f tests/security/docker-compose.backend-auth-probe.yml -f tests/security/docker-compose.audit-history-overlay.yml -f tests/security/docker-compose.audit-restore-overlay.yml'
          $C exec -T postgres psql -XqAt -U probe -d aetheris_audit_restored -v ON_ERROR_STOP=1 < docs/database/rehearsal/audit_ownership_inventory_readonly.sql > "$RUNNER_TEMP/b4y-schema.json"
          $C exec -T postgres psql -XqAt -U probe -d aetheris_audit_restored -v ON_ERROR_STOP=1 < docs/database/rehearsal/audit_flyway_history_readonly.sql > "$RUNNER_TEMP/b4y-history.json"
          set +e
          python3 scripts/audit_ownership_preflight.py "$RUNNER_TEMP/b4y-schema.json" > "$RUNNER_TEMP/b4y-schema-verdict"
          schema_rc=$?
          python3 scripts/audit_flyway_history_preflight.py "$RUNNER_TEMP/b4y-history.json" > "$RUNNER_TEMP/b4y-history-verdict"
          hist_rc=$?
          set -e
          test "$schema_rc" -eq 1
          test "$hist_rc" -eq 1
          grep -qx AUDIT_INVENTORY_REVIEW_HISTORY_CONTENT_AND_OWNERSHIP "$RUNNER_TEMP/b4y-schema-verdict"
          grep -qx AUDIT_HISTORY_REVIEW_FLYWAY_VALIDATE_CHECKSUM_AND_OWNERSHIP "$RUNNER_TEMP/b4y-history-verdict"
          echo B4Y_RECOVERY_B4W_B4X_PREFLIGHT_REVIEW_NEVER_RELEASE_GO
      - name: Real Audit image starts on restored DB and HTTP access controls remain active
        shell: bash
        run: |
          set -euo pipefail
          C='docker compose -f tests/security/docker-compose.backend-auth-probe.yml -f tests/security/docker-compose.audit-history-overlay.yml -f tests/security/docker-compose.audit-restore-overlay.yml'
          $C up --no-build -d audit-restored
          $C run --rm --no-deps audit-restore-probe
          $C exec -T postgres psql -XqAt -U probe -d aetheris_audit_restored -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM flyway_audit_schema_history WHERE version='1' AND type='SQL' AND success" | grep -qx 1
          $C exec -T postgres psql -XqAt -U probe -d aetheris_audit_restored -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM flyway_audit_schema_history" | grep -qx 1
          $C exec -T postgres psql -XqAt -U probe -d aetheris_audit_restored -v ON_ERROR_STOP=1 -c "SELECT (count(*)=1 AND bool_and(event_type='CI_ONLY_BACKUP_REHEARSAL' AND user_id=42 AND name IS NULL AND email IS NULL)) FROM audit_events" | grep -qx t
          echo B4Y_RECOVERY_REAL_AUDIT_STARTUP_RETAINED_V1_AND_SYNTHETIC_EVENT
      - name: Recheck restored schema and data byte-for-byte after real boot
        shell: bash
        run: |
          set -euo pipefail
          C='docker compose -f tests/security/docker-compose.backend-auth-probe.yml -f tests/security/docker-compose.audit-history-overlay.yml -f tests/security/docker-compose.audit-restore-overlay.yml'
          $C exec -T postgres sh -ec '
            for type in schema data; do
              pg_dump -U probe -d aetheris_audit_restored "$(test "$type" = schema && echo -s || echo -a)" --no-owner --no-privileges > "/tmp/b4y-after.$type"
              grep -Ev "^\\\\(restrict|unrestrict) " "/tmp/b4y-after.$type" > "/tmp/b4y-after.$type.canonical"
              cmp "/tmp/b4y-aetheris_audit_fresh.$type.canonical" "/tmp/b4y-after.$type.canonical"
            done
            sha256sum -c /tmp/b4y-audit.sha256
            echo B4Y_RECOVERY_RESTORED_SCHEMA_DATA_AND_ARCHIVE_UNCHANGED
          '
      - name: Real Audit rejects corrupted checksum in the SECOND restored copy
        shell: bash
        run: |
          set -euo pipefail
          C='docker compose -f tests/security/docker-compose.backend-auth-probe.yml -f tests/security/docker-compose.audit-history-overlay.yml -f tests/security/docker-compose.audit-restore-overlay.yml'
          $C exec -T postgres psql -Xq -U probe -d aetheris_audit_corrupted -v ON_ERROR_STOP=1 -c "UPDATE flyway_audit_schema_history SET checksum=checksum+1 WHERE version='1'"
          $C exec -T postgres psql -XqAt -U probe -d aetheris_audit_corrupted -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM audit_events" | grep -qx 1
          $C up --no-build -d audit-restore-corrupted
          cid=$($C ps -aq audit-restore-corrupted)
          test -n "$cid"
          stopped=0
          for i in $(seq 1 70); do
            state=$(docker inspect -f '{{.State.Status}}' "$cid")
            if [ "$state" = exited ]; then stopped=1; break; fi
            sleep 2
          done
          test "$stopped" -eq 1 || { echo B4Y_CORRUPTED_RESTORE_WRONGLY_STARTED; exit 1; }
          test "$(docker inspect -f '{{.State.ExitCode}}' "$cid")" -ne 0
          docker logs "$cid" > "$RUNNER_TEMP/b4y-corrupted-refusal.log" 2>&1
          grep -Eiq 'checksum' "$RUNNER_TEMP/b4y-corrupted-refusal.log"
          grep -Eiq 'mismatch|validate failed|inconsistent' "$RUNNER_TEMP/b4y-corrupted-refusal.log"
          $C exec -T postgres psql -XqAt -U probe -d aetheris_audit_restored -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM flyway_audit_schema_history WHERE version='1' AND success" | grep -qx 1
          $C exec -T postgres psql -XqAt -U probe -d aetheris_audit_restored -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM audit_events" | grep -qx 1
          echo B4Y_RECOVERY_CORRUPTED_CLONE_DENIED_CLEAN_RESTORE_UNAFFECTED
      - name: Only bounded diagnostics when tests fail
        if: failure()
        shell: bash
        run: |
          docker compose -f tests/security/docker-compose.backend-auth-probe.yml -f tests/security/docker-compose.audit-history-overlay.yml -f tests/security/docker-compose.audit-restore-overlay.yml ps || true
          docker compose -f tests/security/docker-compose.backend-auth-probe.yml -f tests/security/docker-compose.audit-history-overlay.yml -f tests/security/docker-compose.audit-restore-overlay.yml logs --no-color --tail=45 postgres audit-fresh audit-restored audit-restore-corrupted || true
      - name: Unconditionally remove only disposable CI databases and network
        if: always()
        shell: bash
        run: |
          docker compose -f tests/security/docker-compose.backend-auth-probe.yml -f tests/security/docker-compose.audit-history-overlay.yml -f tests/security/docker-compose.audit-restore-overlay.yml down --volumes --remove-orphans --timeout 10 || true
