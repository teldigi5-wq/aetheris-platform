name: Phase 13 Point-of-Invocation Adapter Revalidation

on:
  pull_request:
    branches:
      - feature/syntra-aetheris-foundation-v2
  push:
    branches:
      - feature/syntra-aetheris-foundation-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase13-point-of-invocation-adapter-revalidation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  point-of-invocation-adapter-revalidation:
    name: Final adapter freshness before stream proof
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Phase 13 adapter freshness proofs
        run: >-
          ./mvnw -B -pl orchestrator-service
          -Dtest=Phase13PointOfInvocationAdapterRevalidationTest,Phase13LiveAdapterRegistrationReconciliationTest,Phase13AdapterAwareRuntimeRegistrationTest
          test

      - name: Verify Slice 12 fail-closed and authority boundaries
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraLocalInferenceOrchestrator.java
            orchestrator-service/src/test/java/io/aetheris/orchestrator/syntracore/Phase13PointOfInvocationAdapterRevalidationTest.java
            docs/phase13-point-of-invocation-adapter-revalidation.md
          )

          for required_file in "${required_files[@]}"; do
            test -f "$required_file" || {
              echo "Missing Phase 13 Slice 12 surface: $required_file" >&2
              exit 1
            }
          done

          orchestrator=orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraLocalInferenceOrchestrator.java

          grep -q 'adapterRegistrationsByCandidateKey' "$orchestrator"
          grep -q 'adapter invocation observation' "$orchestrator"
          grep -q 'immediately before invocation' "$orchestrator"
          grep -q 'LocalInferenceResult.unavailable' "$orchestrator"

          if grep -E 'ProcessBuilder|Runtime\.getRuntime|HttpClient|WebClient|RestTemplate|FileOutputStream|Files\.write|Files\.delete|Files\.move' "$orchestrator"; then
            echo "Slice 12 must remain observation-only and must not add subprocess, network, installer, or filesystem effects" >&2
            exit 1
          fi

          if grep -E '^import io\.aetheris\.orchestrator\.(tool|connector|browser|computeruse)' "$orchestrator"; then
            echo "Slice 12 must not gain tool, connector, browser, or computer-use authority" >&2
            exit 1
          fi

          echo "Phase 13 Slice 12 point-of-invocation adapter revalidation boundaries verified."
