name: Isolated Java Container Trust and TLS Proof

on:
  pull_request:
    branches:
      - main
      - feature/syntra-aetheris-foundation-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-trust-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout reviewed branch revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify source trust/pinning guards across all four services
        run: python3 -m unittest -v tests.test_java_container_trust tests.test_dependency_lockdown_containers
      - name: Set up pinned JDK for CI-only TLS probe compilation
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: corretto
          java-version: '21.0.13'
      - name: Compile read-only TLS proof (not packaged in app images)
        run: |
          mkdir -p "${RUNNER_TEMP}/emudhra-proof"
          javac --release 17 -d "${RUNNER_TEMP}/emudhra-proof" tests/EmudhraTlsProbe.java
      - name: Rebuild four images and inspect actual runtime truststores
        shell: bash
        run: |
          set -euo pipefail
          for module in gateway identity-service user-service audit-service; do
            echo "::group::Truststore proof: ${module}"
            docker build --pull --file "${module}/Dockerfile" \
              --tag "aetheris-${module}-ca-proof:${GITHUB_SHA}" "${module}"
            docker run --rm --entrypoint /bin/sh "aetheris-${module}-ca-proof:${GITHUB_SHA}" -ec '
              set -eu
              java -version 2>&1 | grep -Fq "21.0.13"
              keytool -list -cacerts -storepass changeit >/dev/null
              for alias in "emsignrootcag1 [jdk]" "emsignrootcag2 [jdk]" "emsigneccrootcag3 [jdk]" "comodoaaaca [jdk]"; do
                if keytool -list -cacerts -storepass changeit -alias "$alias" >/dev/null 2>&1; then
                  echo "Unsafe CA alias remains: $alias" >&2; exit 1
                fi
              done
              certs="$(keytool -list -v -cacerts -storepass changeit)"
              if printf "%s\n" "$certs" | tr -d : | grep -Eqi "40F6AF0346A99AA1CD1D555A4E9CCE62C7F9634603EE406615833DC8C8D00367|1AA0C2709E831BD6E3B5129A00BA41F7EEEF020872F1E6504BF0F6C3F24F3AF3|86A1ECBA089C4A8D3BBE2734C612BA341D813E043CF9E8A862CD5C57A36BBE6B|D7A7A0FB5D7E2731D771E9484EBCDEF71D5F0C3E0A2948782BC83EE0EA699EF4"; then
                echo "Compromised CA fingerprint remains in runtime" >&2; exit 1
              fi
              echo "Runtime truststore: Oracle-disallowed aliases and known fingerprints absent"
            '
            docker run --rm --mount "type=bind,src=${RUNNER_TEMP}/emudhra-proof,dst=/proof,readonly" \
              --entrypoint java "aetheris-${module}-ca-proof:${GITHUB_SHA}" \
              -cp /proof EmudhraTlsProbe
            echo "::endgroup::"
          done
