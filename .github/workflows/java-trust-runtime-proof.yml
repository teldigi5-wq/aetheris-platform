name: Isolated Java Container Trust and TLS Proof

on:
  pull_request:
    branches:
      - main
      - feature/syntra-aetheris-foundation-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-container-trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify source image pins, dependency policy and runtime user
        run: python3 -m unittest -v tests.test_java_container_trust tests.test_dependency_lockdown_containers
      - name: Set up Java for isolated TLS probe
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.13'
      - name: Compile independent TLS probe (not packaged in service images)
        run: |
          mkdir -p "${RUNNER_TEMP}/emudhra-proof"
          javac --release 17 -d "${RUNNER_TEMP}/emudhra-proof" tests/EmudhraTlsProbe.java
      - name: Build all four digest-pinned images and verify actual JVM trust
        shell: bash
        run: |
          set -euo pipefail
          for module in gateway identity-service user-service audit-service; do
            echo "::group::Runtime trust proof: ${module}"
            image="aetheris-${module}-patched-java:${GITHUB_SHA}"
            echo "$image" >> "${RUNNER_TEMP}/java-images.txt"
            docker build --pull --file "${module}/Dockerfile" --tag "$image" "${module}"
            docker image inspect "$image" --format 'Built image ID={{.Id}}'
            docker run --rm --entrypoint /bin/sh "$image" -ec '
              set -eu
              java -version 2>&1 | grep -Fq "Temurin-21.0.13+9"
              keytool -list -cacerts -storepass changeit >/dev/null
              fingerprints="$(keytool -list -v -cacerts -storepass changeit)"
              if printf "%s\n" "$fingerprints" | tr -d : | grep -Eqi "86A1ECBA089C4A8D3BBE2734C612BA341D813E043CF9E8A862CD5C57A36BBE6B|D7A7A0FB5D7E2731D771E9484EBCDEF71D5F0C3E0A2948782BC83EE0EA699EF4"; then
                echo "FAIL: affected eMudhra/AAA root remains in runtime truststore" >&2
                exit 1
              fi
              echo "PASS: vendor-patched Java 21.0.13+9 and affected root fingerprints absent"
            '
            docker run --rm \
              --mount "type=bind,src=${RUNNER_TEMP}/emudhra-proof,dst=/proof,readonly" \
              --entrypoint java "$image" \
              -cp /proof EmudhraTlsProbe
            echo "::endgroup::"
          done
      - name: Scan all four exact Java images for fixable high and critical vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          scanner="$RUNNER_TEMP/trivy"
          archive="$RUNNER_TEMP/trivy_0.76.2_Linux-64bit.tar.gz"
          curl --fail --location --silent --show-error --retry 3 --output "$archive" \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz
          printf 'bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  %s\n' "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" trivy
          mkdir -p /tmp/java-image-scans
          while read -r image; do
            name="${image%%:*}"
            docker image save "$image" -o "$RUNNER_TEMP/${name}.tar"
            "$scanner" image --input "$RUNNER_TEMP/${name}.tar" --scanners vuln --exit-code 0 \
              --format json --output "/tmp/java-image-scans/${name}.json"
            rm -f "$RUNNER_TEMP/${name}.tar"
          done < "${RUNNER_TEMP}/java-images.txt"
          python3 - <<'PY'
          import collections, json
          from pathlib import Path
          blocking = []
          for report in sorted(Path("/tmp/java-image-scans").glob("*.json")):
              scan = json.loads(report.read_text())
              results = scan.get("Results")
              if not isinstance(results, list):
                  raise SystemExit(f"{report.name}: Trivy JSON missing Results; scanner evidence is invalid")
              findings = [v for entry in results for v in (entry.get("Vulnerabilities") or [])]
              counts = collections.Counter(v.get("Severity", "UNKNOWN") for v in findings)
              print(report.stem, "findings by severity:", dict(sorted(counts.items())))
              for v in findings:
                  if v.get("Severity") in {"HIGH", "CRITICAL"}:
                      fixed = v.get("FixedVersion") or ""
                      print(" ", report.stem, v.get("VulnerabilityID"), v.get("Severity"), v.get("PkgName"),
                            v.get("InstalledVersion"), "fixed:", fixed or "none published")
                      if fixed:
                          blocking.append((report.stem, v.get("VulnerabilityID")))
          # Unfixed HIGH/CRITICAL findings are reported above and stay release NO_GO evidence;
          # any finding with a published fix blocks this check.
          if blocking:
              raise SystemExit(f"JAVA_IMAGE_SCAN_FIXABLE_HIGH_OR_CRITICAL: {blocking}")
          print("JAVA_IMAGE_SCAN_NO_FIXABLE_HIGH_OR_CRITICAL")
          PY
      - name: Preserve Java image vulnerability evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: java-image-vulnerability-scans
          path: /tmp/java-image-scans/
          if-no-files-found: warn
          retention-days: 7
