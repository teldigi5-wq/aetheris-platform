name: Phase 13 Syntra-Core Runtime Foundation

on:
  pull_request:
    branches:
      - feature/syntra-aetheris-foundation-v2
  push:
    branches:
      - feature/syntra-aetheris-foundation-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase13-syntra-core-runtime-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntra-core-runtime-foundation:
    name: Syntra-Core runtime contracts and deterministic routing proof
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Phase 13 runtime foundation proof
        run: >-
          ./mvnw -B -pl orchestrator-service
          -Dtest=Phase13SyntraCoreRuntimeFoundationTest
          test

      - name: Verify runtime foundation surfaces
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraModelRuntime.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraModelRouter.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/HardwareCapacity.java
            orchestrator-service/src/test/java/io/aetheris/orchestrator/syntracore/Phase13SyntraCoreRuntimeFoundationTest.java
            docs/phase13-syntra-core-runtime-foundation.md
          )

          for required_file in "${required_files[@]}"; do
            test -f "$required_file" || {
              echo "Missing Phase 13 runtime foundation surface: $required_file" >&2
              exit 1
            }
          done

          grep -q "ModelBenchmarkEngine" orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraModelRouter.java
          grep -q "BooleanSupplier" orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraModelRuntime.java
          grep -q "TARGET_PROFILE" orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/HardwareEvidence.java
          grep -q "repository evidence only" docs/phase13-syntra-core-runtime-foundation.md

          echo "Phase 13 runtime foundation surfaces verified."
