name: Connector Live Account Phase 5 Branch Validation

on:
  push:
    branches:
      - validation/connector-live-phase5

permissions:
  contents: read

concurrency:
  group: connector-live-account-phase5-branch-validation
  cancel-in-progress: false

jobs:
  live-provider-readonly-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.15'
          check-latest: false

      - name: Require live read-only provider credentials
        shell: bash
        env:
          GITHUB_TOKEN_VALUE: ${{ secrets.AETHERIS_LIVE_GITHUB_ACCESS_TOKEN }}
          GMAIL_TOKEN_VALUE: ${{ secrets.AETHERIS_LIVE_GMAIL_ACCESS_TOKEN }}
          CALENDAR_TOKEN_VALUE: ${{ secrets.AETHERIS_LIVE_CALENDAR_ACCESS_TOKEN }}
        run: |
          test -n "$GITHUB_TOKEN_VALUE" || { echo 'Missing AETHERIS_LIVE_GITHUB_ACCESS_TOKEN'; exit 1; }
          test -n "$GMAIL_TOKEN_VALUE" || { echo 'Missing AETHERIS_LIVE_GMAIL_ACCESS_TOKEN'; exit 1; }
          test -n "$CALENDAR_TOKEN_VALUE" || { echo 'Missing AETHERIS_LIVE_CALENDAR_ACCESS_TOKEN'; exit 1; }
          echo 'All Phase 5 live-provider credentials are configured.'

      - name: Run live GET-only provider validation
        env:
          AETHERIS_LIVE_GITHUB_ACCESS_TOKEN: ${{ secrets.AETHERIS_LIVE_GITHUB_ACCESS_TOKEN }}
          AETHERIS_LIVE_GMAIL_ACCESS_TOKEN: ${{ secrets.AETHERIS_LIVE_GMAIL_ACCESS_TOKEN }}
          AETHERIS_LIVE_CALENDAR_ACCESS_TOKEN: ${{ secrets.AETHERIS_LIVE_CALENDAR_ACCESS_TOKEN }}
        run: |
          python tools/connector_live_account_validation.py \
            --mode live \
            --contract build-evidence/runtime/connector-live-account-validation-phase5-contract.json \
            --output build-evidence/runtime/connector-live-account-validation-phase5-live-report.json

      - name: Verify live report remains sanitized and read-only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('build-evidence/runtime/connector-live-account-validation-phase5-live-report.json').read_text())
          assert report['status'] == 'PASS', report
          assert report['evidence_class'] == 'LIVE_PROVIDER_READONLY', report
          assert report['mode'] == 'live', report
          assert report['stores_provider_response_bodies'] is False, report
          assert report['stores_account_identifiers'] is False, report
          assert report['stores_token_material'] is False, report
          assert report['provider_mutations_enabled'] is False, report
          assert all(value == 'PASS' for value in report['checks'].values()), report
          print('Live provider validation passed with sanitized evidence only.')
          PY

      - name: Publish sanitized live-provider evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: connector-live-account-phase5-live-readonly-evidence
          path: build-evidence/runtime/connector-live-account-validation-phase5-live-report.json
          if-no-files-found: error
          retention-days: 7
