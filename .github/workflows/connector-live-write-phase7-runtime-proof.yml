name: Connector Live Write Phase 7 Runtime Proof

on:
  pull_request:
    branches:
      - main
      - feature/syntra-aetheris-foundation-v2
    paths:
      - 'architecture/ai-runtime-consumption.json'
      - 'docker-compose.yml'
      - 'tools/load_external_ai_runtime.py'
      - 'tools/oauth_provider_stub.py'
      - 'tools/connector_live_write_runtime_smoke.py'
      - 'tools/connector_live_write_runtime_smoke_phase12.py'
      - 'build-evidence/runtime/connector-live-write-phase7-*'
      - '.github/workflows/connector-live-write-phase7-runtime-proof.yml'
  push:
    branches:
      - main
      - feature/syntra-aetheris-foundation-v2
    paths:
      - 'architecture/ai-runtime-consumption.json'
      - 'docker-compose.yml'
      - 'tools/load_external_ai_runtime.py'
      - 'tools/oauth_provider_stub.py'
      - 'tools/connector_live_write_runtime_smoke.py'
      - 'tools/connector_live_write_runtime_smoke_phase12.py'
      - 'build-evidence/runtime/connector-live-write-phase7-*'
      - '.github/workflows/connector-live-write-phase7-runtime-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connector-live-write-phase7-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connector-live-write-runtime-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.15'
          check-latest: false

      - name: Create ephemeral OAuth proof credentials
        shell: bash
        run: |
          echo "AETHERIS_OAUTH_GITHUB_CLIENT_ID=phase7-github-$(openssl rand -hex 8)" >> "$GITHUB_ENV"
          echo "AETHERIS_OAUTH_GITHUB_CLIENT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AETHERIS_OAUTH_GOOGLE_CLIENT_ID=phase7-google-$(openssl rand -hex 8)" >> "$GITHUB_ENV"
          echo "AETHERIS_OAUTH_GOOGLE_CLIENT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Compile Phase 7 proof harnesses
        run: |
          python -m py_compile tools/load_external_ai_runtime.py
          python -m py_compile tools/oauth_provider_stub.py
          python -m py_compile tools/connector_live_write_runtime_smoke.py
          python -m py_compile tools/connector_live_write_runtime_smoke_phase12.py

      - name: Validate Phase 7 evidence contract
        run: python -m json.tool build-evidence/runtime/connector-live-write-phase7-contract.json >/dev/null

      - name: Load certified external AI runtime
        run: python tools/load_external_ai_runtime.py --github-env "$GITHUB_ENV"

      - name: Start local synthetic OAuth and provider-write server
        shell: bash
        run: |
          mkdir -p build-evidence/runtime
          AETHERIS_OAUTH_STUB_WRITE_SCOPES=true \
          AETHERIS_OAUTH_STUB_WRITE_MUTATIONS=true \
          python tools/oauth_provider_stub.py > build-evidence/runtime/connector-live-write-stub.log 2>&1 &
          echo $! > /tmp/aetheris-provider-write-stub.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:19090/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat build-evidence/runtime/connector-live-write-stub.log
          exit 1

      - name: Start external orchestrator with Phase 7 guarded live-write runtime
        shell: bash
        run: |
          docker compose -f docker-compose.yml -f build-evidence/runtime/connector-live-write-phase7-compose.override.yml \
            up -d orchestrator-service
          docker compose -f docker-compose.yml -f build-evidence/runtime/connector-live-write-phase7-compose.override.yml ps

      - name: Run Phase 7 live-write proof
        run: |
          python tools/connector_live_write_runtime_smoke_phase12.py \
            --contract build-evidence/runtime/connector-live-write-phase7-contract.json \
            --output build-evidence/runtime/connector-live-write-phase7-report.json

      - name: Verify Phase 7 report passed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('build-evidence/runtime/connector-live-write-phase7-report.json').read_text())
          consumption = json.loads(Path('build-evidence/runtime/ai-runtime-consumption-report.json').read_text())
          assert report['status'] == 'PASS', report
          assert report['evidence_class'] == 'HOSTED_RUNTIME_PROVIDER_WRITE_STUB', report
          assert report['capability'] == 'connector-live-write-phase7', report
          assert report['physical_pc_validation'] is False, report
          assert report['production_provider_mutation_proven'] is False, report
          assert report['provider_exactly_once_proven'] is False, report
          assert len(report['checks']) == 20, report
          assert consumption['status'] == 'PASS', consumption
          assert all(value == 'PASS' for value in report['checks'].values()), report
          print('verified 20 Phase 7 approval-gated provider-write checks against certified external runtime')
          PY

      - name: Capture sanitized Phase 7 runtime state
        if: always()
        shell: bash
        run: |
          mkdir -p build-evidence/runtime
          curl --silent http://127.0.0.1:19090/metrics \
            > build-evidence/runtime/connector-live-write-stub-metrics.json || true
          docker compose -f docker-compose.yml -f build-evidence/runtime/connector-live-write-phase7-compose.override.yml \
            ps --all > build-evidence/runtime/connector-live-write-compose-ps.txt || true
          if [ "${{ job.status }}" != "success" ]; then
            docker compose -f docker-compose.yml -f build-evidence/runtime/connector-live-write-phase7-compose.override.yml \
              logs --no-color --tail=260 orchestrator-service \
              > build-evidence/runtime/connector-live-write-failure.log 2>&1 || true
          fi

      - name: Publish hosted Phase 7 evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: connector-live-write-phase7-runtime-proof
          path: build-evidence/runtime/
          if-no-files-found: error
          retention-days: 14

      - name: Tear down Phase 7 proof runtime
        if: always()
        shell: bash
        run: |
          docker compose -f docker-compose.yml -f build-evidence/runtime/connector-live-write-phase7-compose.override.yml \
            down -v --remove-orphans || true
          if [ -f /tmp/aetheris-provider-write-stub.pid ]; then
            kill "$(cat /tmp/aetheris-provider-write-stub.pid)" 2>/dev/null || true
          fi
