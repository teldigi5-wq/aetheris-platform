name: Media Owner-Staging Security

on:
  pull_request:
    branches: [main]
    paths:
      - 'gateway/**'
      - 'identity-service/src/main/java/io/aetheris/identity/Role.java'
      - '.github/workflows/media-staging-gateway.yml'
      - 'docs/security/media-job-authenticated-staging.md'
  push:
    branches: [main]
    paths:
      - 'gateway/**'
      - 'identity-service/src/main/java/io/aetheris/identity/Role.java'
      - '.github/workflows/media-staging-gateway.yml'

permissions:
  contents: read

jobs:
  media-owner-staging-security:
    name: media-owner-staging-security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Ensure feature is default off and blocked pending hardware
        shell: bash
        run: |
          grep -F 'AETHERIS_MEDIA_STAGING_ENABLED:false' gateway/src/main/resources/application.yml
          grep -F 'BLOCKED_PENDING_HARDWARE' gateway/src/main/java/io/aetheris/gateway/StagedMediaJobService.java
          grep -F 'NOT_WIRED' gateway/src/main/java/io/aetheris/gateway/MediaStagingController.java
      - name: Run owner-isolation, replay, auth and HTTP contract tests
        run: ./mvnw -f gateway/pom.xml -Dtest=MediaJobAuthWebFilterTest,StagedMediaJobServiceTest,MediaEndpointWebFluxIntegrationTest test
      - name: Verify exact four-route additive Stage 23 API delta
        run: |
          python scripts/stage23/contract_baseline.py --output build/stage23/media-contract-baseline.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("build/stage23/media-contract-baseline.json").read_text())
          actual = {(item["method"], item["path"]) for item in manifest["httpEndpoints"]
                    if item["path"].startswith("/api/media/")}
          expected = {
              ("GET", "/api/media/capabilities"),
              ("POST", "/api/media/jobs"),
              ("GET", "/api/media/jobs/{id}"),
              ("DELETE", "/api/media/jobs/{id}"),
          }
          assert actual == expected, f"Media API contract differs: {actual}"
          assert manifest["hardBoundaries"]["physicalStage21BlockedPendingHardware"] is True
          assert manifest["hardBoundaries"]["productionActivationAllowed"] is False
          assert manifest["hardBoundaries"]["liveMoneyOrdersAllowed"] is False
          pinned = Path("scripts/stage23/expected-contract.sha256").read_text().strip()
          assert pinned == manifest["contractSha256"], "Frozen HTTP inventory hash must remain an exact pin"
          PY
