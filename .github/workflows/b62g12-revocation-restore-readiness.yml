name: B62-G12 Real Synthetic Restore And Non-Overridable NO_GO Gate
on:
  pull_request:
    branches: [test/b62g11-real-network-partition-recovery-20261027]
    paths:
      - '.github/workflows/b62g12-revocation-restore-readiness.yml'
      - 'tests/security/b62g12-*'
      - 'scripts/b62g12_release_readiness.py'
      - 'tests/test_b62g12_release_readiness.py'
      - 'docs/security/B62G12_RESTORE_AND_CUTOVER_NO_GO_20261027.md'
      - 'docs/current-release-roadmap-20261025.md'
permissions:
  contents: read
jobs:
  synthetic-backup-and-release-denial:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify exact SHA, static policy gates, malformed and forged approval denial
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python3 -m unittest discover -s tests -p 'test_b62g12_release_readiness.py' -v
          python3 -m unittest discover -s tests -p 'test_b62g11_network_partition.py' -v
          python3 -m py_compile scripts/b62g12_release_readiness.py
          bash -n tests/security/b62g12-synthetic-restore-proof.sh
          docker compose version
      - name: Real custom-format PostgreSQL backup, two isolated restores, network-authenticated reader and stale-deny evidence
        shell: bash
        run: |
          set -euo pipefail
          bash tests/security/b62g12-synthetic-restore-proof.sh
          echo B62G12_REAL_DISPOSABLE_RESTORE_AND_FAIL_CLOSED_POLICY_COMPLETE
      - name: Full four-module Java JWT and security regression
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -f pom.xml test
      - name: Always destroy synthetic databases, test backups and internal network
        if: always()
        shell: bash
        run: |
          docker compose \
            -f tests/security/docker-compose.b62g-epoch-proof.yml \
            -f tests/security/b62g12-restore-overlay.yml \
            down --volumes --remove-orphans --timeout 10 || true
          echo B62G12_DISPOSABLE_DATABASE_RESTORES_BACKUPS_AND_NETWORK_CLEANED
