name: Stage 34 Master Build Specification

on:
  push:
    branches:
      - stage-34-master-build-spec
      - feature/syntra-aetheris-foundation-v2
  pull_request:
    branches:
      - feature/syntra-aetheris-foundation-v2

permissions:
  contents: read

concurrency:
  group: stage34-master-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  master-build-spec:
    name: Master build specification integrity
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Compile Stage 34 validator
        run: python -m py_compile tools/validate_master_build_spec.py
      - name: Validate canonical master build specification
        run: python tools/validate_master_build_spec.py
      - name: Repeat validation to detect hidden state coupling
        run: python tools/validate_master_build_spec.py
