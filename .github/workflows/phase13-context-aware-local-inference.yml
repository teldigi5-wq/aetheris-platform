name: Phase 13 Context-Aware Local Inference

on:
  pull_request:
    branches:
      - feature/syntra-aetheris-foundation-v2
  push:
    branches:
      - feature/syntra-aetheris-foundation-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase13-context-aware-local-inference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  context-aware-local-inference:
    name: Local routing, stream and citation proof
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Phase 13 context-aware local inference proof
        run: >-
          ./mvnw -B -f orchestrator-service/pom.xml
          -Dtest=Phase13ContextAwareLocalInferenceTest
          test

      - name: Verify Slice 5 orchestration surfaces
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/InferenceTask.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/InferenceStatus.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/ContextAwareInferenceRequest.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/LocalInferenceResult.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/LocalInferenceEvaluationHook.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraLocalInferenceOrchestrator.java
            orchestrator-service/src/test/java/io/aetheris/orchestrator/syntracore/Phase13ContextAwareLocalInferenceTest.java
            docs/phase13-context-aware-local-inference.md
          )

          for required_file in "${required_files[@]}"; do
            test -f "$required_file" || {
              echo "Missing Phase 13 Slice 5 surface: $required_file" >&2
              exit 1
            }
          done

          grep -q "ZERO_COST_MODE = true" orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/ContextAwareInferenceRequest.java
          grep -q "PRIVATE_MODE = true" orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/ContextAwareInferenceRequest.java
          grep -q "REQUIRE_STREAMING = true" orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/ContextAwareInferenceRequest.java
          grep -q "PREFER_LOCAL = true" orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/ContextAwareInferenceRequest.java
          grep -q "SyntraModelRouter" orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraLocalInferenceOrchestrator.java
          grep -q "SyntraModelRuntime" orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraLocalInferenceOrchestrator.java
          grep -q "sequence discontinuity" orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraLocalInferenceOrchestrator.java
          grep -q "evidenceAddresses" orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/LocalInferenceResult.java

          if grep -R "HttpClient\|WebClient\|RestTemplate" \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/ContextAwareInferenceRequest.java \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/LocalInferenceResult.java \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraLocalInferenceOrchestrator.java; then
            echo "Slice 5 must reuse the existing runtime adapter rather than add a network client" >&2
            exit 1
          fi

          if grep -R "io.aetheris.orchestrator.\(tool\|connector\|approval\)" \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/ContextAwareInferenceRequest.java \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/LocalInferenceResult.java \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraLocalInferenceOrchestrator.java; then
            echo "Slice 5 local inference must not acquire tool, connector, or approval authority" >&2
            exit 1
          fi

          echo "Phase 13 Slice 5 local inference surfaces verified."
