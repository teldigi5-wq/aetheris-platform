name: Current Aetheris Roadmap Source Integrity
on:
  pull_request:
    branches:
      - release/aetheris-observability-security-candidate-20261023
      - main
    paths:
      - 'README.md'
      - 'docs/master-roadmap.md'
      - 'docs/current-release-roadmap-20261025.md'
      - 'tests/test_current_roadmap_integrity.py'
      - '.github/workflows/current-roadmap-integrity.yml'
permissions:
  contents: read
jobs:
  history-and-release-no-go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_current_roadmap_integrity.py' -v
