name: Phase 13 Bound Adapter Invocation Handle

on:
  pull_request:
    branches:
      - feature/syntra-aetheris-foundation-v2
  push:
    branches:
      - feature/syntra-aetheris-foundation-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase13-bound-adapter-invocation-handle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bound-adapter-invocation-handle:
    name: Bound adapter invocation handle proof
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Phase 13 bound adapter invocation continuity proofs
        run: >-
          ./mvnw -B -pl orchestrator-service
          -Dtest=Phase13BoundAdapterInvocationHandleTest,Phase13AdapterInvocationLeaseTest,Phase13PointOfInvocationAdapterRevalidationTest,Phase13LiveAdapterRegistrationReconciliationTest,Phase13AdapterAwareRuntimeRegistrationTest
          test

      - name: Verify Slice 14 fail-closed and authority boundaries
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdapterRuntimeInvocationHandle.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdapterInvocationHandleRuntime.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdapterInvocationLease.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdapterInvocationLeasingRuntime.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraLocalInferenceOrchestrator.java
            orchestrator-service/src/test/java/io/aetheris/orchestrator/syntracore/Phase13BoundAdapterInvocationHandleTest.java
            docs/phase13-bound-adapter-invocation-handle.md
          )

          for required_file in "${required_files[@]}"; do
            test -f "$required_file" || {
              echo "Missing Phase 13 Slice 14 surface: $required_file" >&2
              exit 1
            }
          done

          handle=orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdapterRuntimeInvocationHandle.java
          handle_runtime=orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdapterInvocationHandleRuntime.java
          orchestrator=orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraLocalInferenceOrchestrator.java

          grep -q 'AtomicBoolean' "$handle"
          grep -q 'single-use' "$handle"
          grep -q 'acquireAdapterInvocationHandle' "$handle_runtime"
          grep -q 'ADAPTER_LEASE_UNAVAILABLE_REJECTION' "$orchestrator"
          grep -q 'ADAPTER_LEASE_MISMATCH_REJECTION' "$orchestrator"
          grep -q 'ADAPTER_HANDLE_UNAVAILABLE_REJECTION' "$orchestrator"
          grep -q 'ADAPTER_HANDLE_MISMATCH_REJECTION' "$orchestrator"
          grep -q 'new AdapterRuntimeInvocationHandle' "$orchestrator"
          grep -q 'leasingRuntime::streamWithAdapterLease' "$orchestrator"
          grep -q 'adapterInvocationHandle.stream' "$orchestrator"

          if grep -q 'leasingRuntime\.streamWithAdapterLease(' "$orchestrator"; then
            echo "Slice 14 adapter execution must start through the bound handle, not a direct lease-aware runtime call" >&2
            exit 1
          fi

          if grep -E 'ProcessBuilder|Runtime\.getRuntime|HttpClient|WebClient|RestTemplate|FileOutputStream|Files\.write|Files\.delete|Files\.move' "$handle" "$handle_runtime" "$orchestrator"; then
            echo "Slice 14 must remain a local typed invocation contract without subprocess, network, installer, or filesystem effects" >&2
            exit 1
          fi

          if grep -E '^import io\.aetheris\.orchestrator\.(tool|connector|browser|computeruse)' "$handle" "$handle_runtime" "$orchestrator"; then
            echo "Slice 14 must not gain tool, connector, browser, or computer-use authority" >&2
            exit 1
          fi

          echo "Phase 13 Slice 14 bound adapter invocation handle boundaries verified."
