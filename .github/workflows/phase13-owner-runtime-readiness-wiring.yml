name: Phase 13 Owner Runtime Readiness Wiring

on:
  pull_request:
    branches:
      - feature/syntra-aetheris-foundation-v2
  push:
    branches:
      - feature/syntra-aetheris-foundation-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase13-owner-runtime-readiness-wiring-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owner-runtime-readiness-wiring:
    name: Owner runtime readiness wiring proof
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Phase 13 owner-runtime readiness continuity proofs
        run: >-
          ./mvnw -B -pl orchestrator-service
          -Dtest=Phase13OwnerRuntimeReadinessWiringTest,Phase13ConcreteOllamaAdapterRuntimeTest,Phase13LiveAdapterRegistrationReconciliationTest,Phase13PointOfInvocationAdapterRevalidationTest,Phase13AdapterInvocationLeaseTest,Phase13BoundAdapterInvocationHandleTest
          test

      - name: Verify Slice 16 opt-in and read-only boundaries
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/OwnerLocalRuntimeProperties.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/OwnerLocalRuntimeConfiguration.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/OwnerLocalRuntimeReadiness.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/OwnerLocalRuntimeReadinessService.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/OwnerLocalRuntimeHealthIndicator.java
            orchestrator-service/src/test/java/io/aetheris/orchestrator/syntracore/Phase13OwnerRuntimeReadinessWiringTest.java
            docs/phase13-owner-runtime-readiness-wiring.md
          )

          for required_file in "${required_files[@]}"; do
            test -f "$required_file" || {
              echo "Missing Phase 13 Slice 16 surface: $required_file" >&2
              exit 1
            }
          done

          props=orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/OwnerLocalRuntimeProperties.java
          config=orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/OwnerLocalRuntimeConfiguration.java
          readiness=orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/OwnerLocalRuntimeReadinessService.java
          app_props=orchestrator-service/src/main/resources/application.properties

          grep -q '@ConditionalOnProperty' "$config"
          grep -q 'havingValue = "true"' "$config"
          grep -q 'LocalRuntimeEndpoint' "$config"
          grep -q 'OllamaAdapterRuntimeBridge' "$config"
          grep -q 'discoverModels()' "$readiness"
          grep -q 'aetheris-runtime-readiness://ollama-local/' "$readiness"
          grep -q 'AETHERIS_SYNTRA_OWNER_RUNTIME_ENABLED:false' "$app_props"
          grep -q 'AETHERIS_SYNTRA_OWNER_RUNTIME_ENDPOINT:http://127.0.0.1:11434' "$app_props"

          if grep -E 'activate\(|detach\(|reconcileLifecycle|(runtime|bridge|adapterRuntime)\.stream\(' "$readiness" "$config"; then
            echo "Slice 16 readiness/configuration wiring must not activate, detach, reconcile, or invoke runtime streaming" >&2
            exit 1
          fi

          if grep -E 'ProcessBuilder|Runtime\.getRuntime|Files\.write|Files\.delete|Files\.move|FileOutputStream' "$props" "$config" "$readiness"; then
            echo "Slice 16 must not gain subprocess, installer, or filesystem mutation authority" >&2
            exit 1
          fi

          if grep -E '^import io\.aetheris\.orchestrator\.(tool|connector|browser|computeruse|vault)' "$props" "$config" "$readiness"; then
            echo "Slice 16 must not gain tool, connector, browser, computer-use, or credential authority" >&2
            exit 1
          fi

          echo "Phase 13 Slice 16 owner-runtime readiness wiring boundaries verified."
