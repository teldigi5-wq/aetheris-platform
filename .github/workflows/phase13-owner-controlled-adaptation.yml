name: Phase 13 Owner-Controlled Adaptation

on:
  pull_request:
    branches:
      - feature/syntra-aetheris-foundation-v2
  push:
    branches:
      - feature/syntra-aetheris-foundation-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase13-owner-controlled-adaptation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owner-controlled-adaptation:
    name: Adaptation data rights and planning proof
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Phase 13 owner-controlled adaptation proof
        run: >-
          ./mvnw -B -f orchestrator-service/pom.xml
          -Dtest=Phase13OwnerControlledAdaptationTest
          test

      - name: Verify Slice 7 non-execution boundaries
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdaptationMethod.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdaptationRightsBasis.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdaptationSourceDocument.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdaptationSecretScrubber.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdaptationDatasetEntry.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdaptationDatasetManifest.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdaptationDatasetBuilder.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdaptationExperimentRequest.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdaptationExperimentPlan.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraAdaptationPlanningService.java
            orchestrator-service/src/test/java/io/aetheris/orchestrator/syntracore/Phase13OwnerControlledAdaptationTest.java
            docs/phase13-owner-controlled-adaptation.md
          )

          for required_file in "${required_files[@]}"; do
            test -f "$required_file" || {
              echo "Missing Phase 13 Slice 7 surface: $required_file" >&2
              exit 1
            }
          done

          grep -q "IncrementalKnowledgeIngestionService.TOMBSTONE_TAG" \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdaptationDatasetBuilder.java
          grep -q "protected data is not eligible" \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdaptationDatasetBuilder.java
          grep -q "executionAuthorized" \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdaptationExperimentPlan.java
          grep -q "DETACH_ADAPTER" \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdaptationExperimentPlan.java
          grep -q "explicit owner opt-in" \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraAdaptationPlanningService.java

          slice_sources=(
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdaptationMethod.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdaptationRightsBasis.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdaptationSourceDocument.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdaptationSecretScrubber.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdaptationDatasetEntry.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdaptationDatasetManifest.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdaptationDatasetBuilder.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdaptationExperimentRequest.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdaptationExperimentPlan.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraAdaptationPlanningService.java
          )

          if grep -E "ProcessBuilder|Runtime\.getRuntime|HttpClient|WebClient|RestTemplate|FileOutputStream|Files\.write" "${slice_sources[@]}"; then
            echo "Slice 7 must remain a non-executing, non-network, in-memory planning layer" >&2
            exit 1
          fi

          if grep -R "io.aetheris.orchestrator.\(tool\|connector\|approval\)" "${slice_sources[@]}"; then
            echo "Slice 7 adaptation planning must not gain execution authority" >&2
            exit 1
          fi

          echo "Phase 13 Slice 7 owner-controlled adaptation boundaries verified."
