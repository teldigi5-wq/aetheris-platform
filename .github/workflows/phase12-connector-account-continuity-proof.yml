name: Phase 12 Connector Account Continuity Proof

on:
  pull_request:
    branches:
      - feature/syntra-aetheris-foundation-v2
  push:
    branches:
      - feature/syntra-aetheris-foundation-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase12-connector-account-continuity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connector-account-continuity-proof:
    name: Stable provider-account continuity before live writes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run provider account continuity proof
        run: ./mvnw -B -f orchestrator-service/pom.xml -Dtest=Phase12ProviderAccountContinuityTest test

      - name: Verify stable provider identities and write-time ordering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          resolver = Path('orchestrator-service/src/main/java/io/aetheris/orchestrator/connector/oauth/ProviderIdentityResolver.java').read_text()
          continuity = Path('orchestrator-service/src/main/java/io/aetheris/orchestrator/connector/action/ProviderAccountContinuityService.java').read_text()
          executor = Path('orchestrator-service/src/main/java/io/aetheris/orchestrator/connector/action/LiveConnectorWriteExecutor.java').read_text()

          required_resolver = [
              'case GITHUB -> body.get("id")',
              'case GMAIL, CALENDAR -> body.get("sub")',
              'Current provider account identity could not be verified before live connector execution',
          ]
          for marker in required_resolver:
              assert marker in resolver, f'missing stable-identity marker: {marker}'

          assert 'connection.getExternalAccountRef()' in continuity
          assert 'identities.resolve(action.getProvider(), accessToken)' in continuity
          assert 'if (!expectedAccount.equals(currentAccount)) throw blocked();' in continuity
          assert 'Provider account continuity check failed before live connector execution' in continuity

          continuity_call = executor.index('accountContinuity.assertCurrent(action, accessToken);')
          provider_dispatch = executor.index('return switch (action.getActionKind())')
          assert continuity_call < provider_dispatch, 'account continuity must be checked before provider write dispatch'

          for provider_method in ('sendGmail(action, accessToken)', 'createCalendarEvent(action, accessToken)', 'createGithubIssue(action, accessToken)'):
              assert executor.index(provider_method, provider_dispatch) > continuity_call

          print('Stable provider identity is checked against the stored account before any live connector write dispatch.')
          PY
