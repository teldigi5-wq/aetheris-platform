name: Phase 10 Computer Use Production Proof

on:
  pull_request:
    branches:
      - feature/syntra-aetheris-foundation-v2
  push:
    branches:
      - feature/syntra-aetheris-foundation-v2
      - feature/computer-use-production-phase10
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase10-computer-use-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  computer-use-production-proof:
    name: Browser sandbox, download evidence and physical-truth proof
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run governed computer-use proof
        run: ./mvnw -B -pl orchestrator-service -Dtest=AetherisBrowserOperatorTest,BrowserDownloadEvidenceServiceTest test

      - name: Verify obsolete unverified-download success path is absent
        shell: bash
        run: |
          if grep -R --line-number 'DOWNLOAD execution remains disabled until downloaded-file evidence is implemented' orchestrator-service/src/main; then
            echo 'Obsolete download implementation marker remains in production source.' >&2
            exit 1
          fi
          echo 'Phase 10 download evidence implementation is active in production source.'
