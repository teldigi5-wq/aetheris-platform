name: Observability Runtime Proof

on:
  pull_request:
    branches:
      - main
      - feature/syntra-aetheris-foundation-v2
    paths:
      - 'gateway/**'
      - 'identity-service/**'
      - 'user-service/**'
      - 'audit-service/**'
      - 'observability/**'
      - 'docker-compose.yml'
      - 'docker-compose.integration-external.yml'
      - 'tools/load_certified_ai_runtime.sh'
      - 'architecture/ai-runtime-certification-reference.json'
      - 'tools/observability_runtime_smoke.py'
      - 'build-evidence/observability/observability-runtime-contract.json'
      - '.github/workflows/observability-runtime-proof.yml'
  push:
    branches:
      - main
      - feature/syntra-aetheris-foundation-v2
    paths:
      - 'gateway/**'
      - 'identity-service/**'
      - 'user-service/**'
      - 'audit-service/**'
      - 'observability/**'
      - 'docker-compose.yml'
      - 'docker-compose.integration-external.yml'
      - 'tools/load_certified_ai_runtime.sh'
      - 'architecture/ai-runtime-certification-reference.json'
      - 'tools/observability_runtime_smoke.py'
      - 'build-evidence/observability/observability-runtime-contract.json'
      - '.github/workflows/observability-runtime-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observability-runtime-proof-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observability-runtime-proof:
    name: observability-runtime-proof
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      AETHERIS_JWT_SECRET: observability-proof-local-ci-secret-42chars-long
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Load certified external AI runtime
        shell: bash
        run: |
          ./tools/load_certified_ai_runtime.sh
          echo "COMPOSE_FILE=docker-compose.integration-external.yml" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.15'
          check-latest: false

      - name: Compile observability proof harness
        run: python -m py_compile tools/observability_runtime_smoke.py

      - name: Validate observability contract JSON
        run: python -m json.tool build-evidence/observability/observability-runtime-contract.json >/dev/null

      - name: Start core and observability stack
        run: |
          docker compose --profile observability up -d --build
          docker compose --profile observability ps

      - name: Run observability runtime proof
        run: |
          python tools/observability_runtime_smoke.py \
            --contract build-evidence/observability/observability-runtime-contract.json \
            --output build-evidence/observability/observability-runtime-report.json

      - name: Verify observability report passed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('build-evidence/observability/observability-runtime-report.json').read_text())
          assert report['status'] == 'PASS', report
          assert report['physical_pc_validation'] is False, report
          assert report['evidence_class'] == 'HOSTED_OBSERVABILITY', report
          assert len(report['checks']) == 13, report
          print('verified 13 hosted observability checks')
          PY

      - name: Capture observability state
        if: always()
        run: |
          mkdir -p build-evidence/observability
          docker compose --profile observability ps --all > build-evidence/observability/compose-ps.txt || true
          if [ "${{ job.status }}" != "success" ]; then
            docker compose --profile observability logs --no-color --tail=120 \
              prometheus loki tempo otel-collector alloy grafana gateway identity-service user-service audit-service orchestrator-service \
              > build-evidence/observability/compose-failure.log 2>&1 || true
          fi

      - name: Publish hosted observability evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: observability-runtime-proof
          path: build-evidence/observability/
          if-no-files-found: error
          retention-days: 14

      - name: Tear down stack
        if: always()
        run: docker compose --profile observability down -v --remove-orphans
