name: Phase 12 OAuth Lifecycle Continuity Proof

on:
  pull_request:
    branches:
      - feature/syntra-aetheris-foundation-v2
  push:
    branches:
      - feature/syntra-aetheris-foundation-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase12-oauth-lifecycle-continuity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oauth-lifecycle-continuity-proof:
    name: Stable provider identity across OAuth credential lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run OAuth lifecycle continuity proof
        run: ./mvnw -B -pl orchestrator-service -Dtest=Phase12OAuthLifecycleContinuityTest test

      - name: Verify lifecycle checks happen before credential persistence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('orchestrator-service/src/main/java/io/aetheris/orchestrator/connector/oauth/ConnectorOAuthService.java').read_text()
          continuity = Path('orchestrator-service/src/main/java/io/aetheris/orchestrator/connector/oauth/OAuthLifecycleAccountContinuityService.java').read_text()

          complete_start = service.index('public ProviderCredentialView complete(')
          health_start = service.index('public ProviderHealthView health(')
          refresh_start = service.index('public ProviderCredentialView refresh(')
          disconnect_start = service.index('public ProviderCredentialView disconnect(')

          complete = service[complete_start:health_start]
          health = service[health_start:refresh_start]
          refresh = service[refresh_start:disconnect_start]

          complete_check = complete.index('accountContinuity.assertCurrent(connection, token.accessToken());')
          complete_store = complete.index('vault.put("access-" + session.getConnectionId(), token.accessToken())')
          assert complete_check < complete_store, 'OAuth completion must verify account identity before access-token persistence'

          refresh_check = refresh.index('accountContinuity.assertCurrent(connection, token.accessToken());')
          refresh_store = refresh.index('vault.put("access-" + connectionId, token.accessToken())')
          assert refresh_check < refresh_store, 'OAuth refresh must verify account identity before token rotation'

          assert 'accountContinuity.matchesResolvedIdentity(connection, identity.accountId())' in health
          assert 'credential.validated(healthy);' in health
          assert 'Provider account continuity validation failed' in health

          assert 'connection.getExternalAccountRef()' in continuity
          assert 'identities.resolve(connection.getProvider(), accessToken)' in continuity
          assert 'if (!expectedAccount.equals(currentAccount))' in continuity
          assert 'Provider account continuity check failed during OAuth credential lifecycle' in continuity

          assert service.count('requireCredentialProvider(connection, credential);') >= 3

          print('OAuth completion, refresh and health are bound to the durable provider account before credentials can be trusted or rotated.')
          PY
