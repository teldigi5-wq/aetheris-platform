name: Data Recovery Runtime Proof

on:
  pull_request:
    branches:
      - main
      - feature/syntra-aetheris-foundation-v2
    paths:
      - 'identity-service/**'
      - 'user-service/**'
      - 'gateway/**'
      - 'docker-compose.yml'
      - 'tools/data_recovery_runtime_smoke.py'
      - 'build-evidence/runtime/data-recovery-runtime-contract.json'
      - '.github/workflows/data-recovery-runtime-proof.yml'
  push:
    branches:
      - main
      - feature/syntra-aetheris-foundation-v2
    paths:
      - 'identity-service/**'
      - 'user-service/**'
      - 'gateway/**'
      - 'docker-compose.yml'
      - 'tools/data_recovery_runtime_smoke.py'
      - 'build-evidence/runtime/data-recovery-runtime-contract.json'
      - '.github/workflows/data-recovery-runtime-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-recovery-runtime-proof-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-recovery-runtime-proof:
    name: data-recovery-runtime-proof
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      AETHERIS_JWT_SECRET: data-recovery-proof-local-ci-secret-change-me-42chars
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.15'
          check-latest: false

      - name: Compile data recovery proof harness
        run: python -m py_compile tools/data_recovery_runtime_smoke.py

      - name: Validate data recovery proof contract JSON
        run: python -m json.tool build-evidence/runtime/data-recovery-runtime-contract.json >/dev/null

      - name: Show Docker runtime
        run: |
          docker version
          docker compose version

      - name: Start data recovery proof stack
        run: |
          docker compose up -d --build \
            postgres redis rabbitmq \
            user-service identity-service audit-service orchestrator-service gateway
          docker compose ps

      - name: Wait for core data services
        run: |
          for target in '8081:user-service' '8082:identity-service' '8080:gateway'; do
            port="${target%%:*}"
            service="${target#*:}"
            ready=false
            for attempt in {1..90}; do
              if curl --fail --silent "http://127.0.0.1:${port}/actuator/health" | grep -q '"status":"UP"'; then
                echo "${service} is ready"
                ready=true
                break
              fi
              sleep 2
            done
            if [ "${ready}" != "true" ]; then
              echo "${service} did not become ready"
              docker compose logs --no-color --tail=120 "${service}"
              exit 1
            fi
          done

      - name: Run data recovery runtime proof
        run: |
          python tools/data_recovery_runtime_smoke.py \
            --contract build-evidence/runtime/data-recovery-runtime-contract.json \
            --output build-evidence/runtime/data-recovery-runtime-report.json

      - name: Verify data recovery report passed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('build-evidence/runtime/data-recovery-runtime-report.json').read_text())
          assert report['status'] == 'PASS', report
          assert report['physical_pc_validation'] is False, report
          assert report['production_disaster_recovery_certification'] is False, report
          assert report['rpo_rto_certification'] is False, report
          assert report['raw_backup_published'] is False, report
          assert report['evidence_class'] == 'HOSTED_RUNTIME', report
          assert report['capability'] == 'data-recovery', report
          assert report['restore_mode'] == 'fresh-isolated-database', report
          assert report['backup']['published'] is False, report
          assert len(report['backup']['sha256']) == 64, report
          assert report['backup']['bytes'] > 0, report
          assert all(value == 'PASS' for value in report['checks'].values()), report
          print(f"verified {len(report['checks'])} hosted data-recovery runtime checks")
          PY

      - name: Capture sanitized recovery state
        if: always()
        run: |
          mkdir -p build-evidence/runtime
          docker compose ps --all > build-evidence/runtime/data-recovery-compose-ps.txt || true
          docker compose exec -T postgres psql -U aetheris -d aetheris -tA -c \
            "select 'primary_users=' || count(*) from users where email like 'recovery-user-%@aetheris.local';" \
            > build-evidence/runtime/data-recovery-user-state.txt 2>/dev/null || true
          docker compose exec -T postgres psql -U aetheris -d aetheris -tA -c \
            "select 'primary_accounts=' || count(*) from identity_accounts where email like 'recovery-identity-%@aetheris.local';" \
            > build-evidence/runtime/data-recovery-identity-state.txt 2>/dev/null || true
          docker compose exec -T postgres psql -U aetheris -d aetheris -tA -c \
            "select 'proof_refresh_rows=' || count(*) || '|sha256_shape=' || bool_and(token_hash ~ '^[0-9a-f]{64}$') from identity_refresh_tokens r join identity_accounts a on a.id=r.account_id where a.email like 'recovery-identity-%@aetheris.local';" \
            > build-evidence/runtime/data-recovery-token-state.txt 2>/dev/null || true
          docker compose exec -T redis redis-cli --raw --scan --pattern 'usersList*' \
            > build-evidence/runtime/data-recovery-cache-keys.txt 2>/dev/null || true
          if [ "${{ job.status }}" != "success" ]; then
            docker compose logs --no-color --tail=180 \
              postgres redis user-service identity-service gateway \
              > build-evidence/runtime/data-recovery-failure.log 2>&1 || true
          fi

      - name: Publish hosted data recovery evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: data-recovery-runtime-proof
          path: build-evidence/runtime/
          if-no-files-found: error
          retention-days: 14

      - name: Tear down Compose stack
        if: always()
        run: docker compose down -v --remove-orphans
