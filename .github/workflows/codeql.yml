name: CodeQL

on:
  push:
    branches:
      - main
      - feature/syntra-aetheris-foundation-v2
      - stage-30-reconcile-canonical-v2
  pull_request:
    branches:
      - main
      - feature/syntra-aetheris-foundation-v2
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21.0.12'
  NODE_VERSION: '22.23.2'

jobs:
  analyze-java:
    name: Analyze Java
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          languages: java-kotlin
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Build Java surfaces
        run: |
          ./mvnw -f gateway/pom.xml -DskipTests package
          ./mvnw -f user-service/pom.xml -DskipTests package
          ./mvnw -f identity-service/pom.xml -DskipTests package
          ./mvnw -f audit-service/pom.xml -DskipTests package
          ./mvnw -f orchestrator-service/pom.xml -DskipTests package
      - name: Analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          category: '/language:java-kotlin'

  analyze-javascript:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          languages: javascript-typescript
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Build dashboard
        working-directory: dashboard
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          category: '/language:javascript-typescript'
