name: User Audit real Tomcat JWT path regression (review only)
on:
  push:
    branches: [security/direct-api-real-tomcat-http-20261101]
    paths:
      - '.github/workflows/direct-api-real-tomcat-review.yml'
      - 'user-service/src/test/java/io/aetheris/users/security/DirectApiEncodedPathRealTomcatTest.java'
      - 'audit-service/src/test/java/io/aetheris/audit/security/DirectApiEncodedPathRealTomcatTest.java'
      - 'user-service/src/main/java/io/aetheris/users/security/DirectApiJwtFilter.java'
      - 'audit-service/src/main/java/io/aetheris/audit/security/DirectApiJwtFilter.java'

permissions:
  contents: read

jobs:
  real-tomcat-path-boundary:
    name: real-tomcat-path-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact security review branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Use Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run real loopback Tomcat with production User controller and JWT filter
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -f user-service/pom.xml -Dtest=DirectApiJwtFilterTest,DirectApiEncodedPathRealTomcatTest test
      - name: Run real loopback Tomcat with production Audit controller and JWT filter
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -f audit-service/pom.xml -Dtest=DirectApiJwtFilterTest,DirectApiEncodedPathRealTomcatTest test
      - name: 'Review boundary — no release or production certificate decision'
        shell: bash
        run: |
          echo 'REAL_TOMCAT_HTTP_NEGATIVE_AND_SIGNED_POSITIVE_TESTS_PASS_REVIEW_ONLY'
          echo 'XERJ_BLOCKED_STAGE45_NO_GO'
