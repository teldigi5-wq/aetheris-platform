name: Phase 13 Local Inference Evaluation Harness

on:
  pull_request:
    branches:
      - feature/syntra-aetheris-foundation-v2
  push:
    branches:
      - feature/syntra-aetheris-foundation-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase13-local-inference-evaluation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-inference-evaluation:
    name: Evaluation provenance and Stage 31 reuse proof
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Phase 13 local inference evaluation proof
        run: >-
          ./mvnw -B -pl orchestrator-service
          -Dtest=Phase13LocalInferenceEvaluationHarnessTest
          test

      - name: Verify Slice 6 evaluation boundaries
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/EvaluationEvidenceSource.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/InferenceEvaluationCase.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/InferenceEvaluationAssessment.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/ObservedModelEvaluation.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/EvaluatedModelScore.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraInferenceEvaluationHarness.java
            orchestrator-service/src/test/java/io/aetheris/orchestrator/syntracore/Phase13LocalInferenceEvaluationHarnessTest.java
            docs/phase13-local-inference-evaluation-harness.md
          )

          for required_file in "${required_files[@]}"; do
            test -f "$required_file" || {
              echo "Missing Phase 13 Slice 6 surface: $required_file" >&2
              exit 1
            }
          done

          grep -q "ModelBenchmarkEngine" orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraInferenceEvaluationHarness.java
          grep -q "HOSTED_SYNTHETIC" orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/EvaluationEvidenceSource.java
          grep -q "OWNER_HARDWARE" orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/EvaluationEvidenceSource.java
          grep -q "LocalInferenceEvaluationHook" orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraInferenceEvaluationHarness.java
          grep -q "EVIDENCE_CONTINUITY_MISMATCH" orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraInferenceEvaluationHarness.java

          if grep -R "HttpClient\|WebClient\|RestTemplate" \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/EvaluationEvidenceSource.java \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/InferenceEvaluationCase.java \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/InferenceEvaluationAssessment.java \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/ObservedModelEvaluation.java \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/EvaluatedModelScore.java \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraInferenceEvaluationHarness.java; then
            echo "Slice 6 evaluation must not add a network client" >&2
            exit 1
          fi

          if grep -R "io.aetheris.orchestrator.\(tool\|connector\|approval\)" \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/EvaluationEvidenceSource.java \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/InferenceEvaluationCase.java \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/InferenceEvaluationAssessment.java \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/ObservedModelEvaluation.java \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/EvaluatedModelScore.java \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraInferenceEvaluationHarness.java; then
            echo "Slice 6 evaluation must remain observation-only" >&2
            exit 1
          fi

          echo "Phase 13 Slice 6 evaluation boundaries verified."
