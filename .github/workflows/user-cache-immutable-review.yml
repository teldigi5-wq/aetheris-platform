name: User shared cache integrity regression (review only)
on:
  push:
    branches: [security/user-cache-immutable-snapshot-20261101]
    paths:
      - '.github/workflows/user-cache-immutable-review.yml'
      - 'user-service/src/main/java/io/aetheris/users/UserService.java'
      - 'user-service/src/test/java/io/aetheris/users/UserServiceCacheTest.java'
permissions:
  contents: read
jobs:
  cache-integrity-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout security candidate without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Execute real Spring caching regression and service tests
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -f user-service/pom.xml -Dtest=UserServiceCacheTest,UserServiceTest test
      - name: Review-only no-op release hold
        shell: bash
        run: |
          echo 'USER_SHARED_CACHE_INTEGRITY_REVIEW_ONLY'
          echo 'NO_TENANT_GRANT_NO_MERGE_NO_RELEASE_NO_XERJ'
