name: XERJ Candidate User Audit Service Authorization Security Gate
on:
  pull_request:
    branches: [release/identity-jwt-audience-20261013]
    paths:
      - 'user-service/**'
      - 'audit-service/**'
      - 'identity-service/**'
      - 'gateway/**'
      - 'docker-compose*.yml'
      - '.github/workflows/xerj-user-audit-service-authz.yml'
      - 'docs/security/XERJ_USER_AUDIT_AUTHZ_FIX_20261106.md'
permissions:
  contents: read
jobs:
  authorization-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact review commit without token persistence
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Setup pinned Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - name: Test independent User backend authorization
        run: ./mvnw -B -ntp -f user-service/pom.xml -Dtest=ServiceJwtAuthorizationFilterTest test
      - name: Test independent Audit backend authorization
        run: ./mvnw -B -ntp -f audit-service/pom.xml -Dtest=ServiceJwtAuthorizationFilterTest test
      - name: Test Gateway fail-closed administrator policy
        run: ./mvnw -B -ntp -f gateway/pom.xml -Dtest=JwtAuthenticationFilterTest test
      - name: Test Identity token and issuer/audience contract
        run: ./mvnw -B -ntp -f identity-service/pom.xml -Dtest=JwtServiceIssuerAudienceTest test
      - name: Verify no implicit known JWT secret or missing backend Compose JWT wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          compose = [Path(p) for p in ("docker-compose.yml", "docker-compose.core.yml", "docker-compose.integration-external.yml")]
          for f in compose:
              s = f.read_text()
              assert "change-me-local-development-secret-32chars" not in s, f
              for service in ("user-service", "audit-service", "identity-service", "gateway"):
                  anchor = f"  {service}:"
                  assert anchor in s, (f, service)
                  block = s.split(anchor, 1)[1].split("\n  ", 1)[0]
                  assert "AETHERIS_JWT_SECRET:" in block, (f, service)
          for service in ("user-service", "audit-service", "identity-service", "gateway"):
              yml = Path(service) / "src/main/resources/application.yml"
              assert "${AETHERIS_JWT_SECRET}" in yml.read_text(), yml
          print("XERJ_USER_AUDIT_AUTHZ_JWT_CONFIGURATION_PASS")
          PY
