name: Stage 24 Lock Bootstrap

on:
  push:
    branches: [ stage24-reproducible-build ]

permissions:
  contents: write

jobs:
  generate-lock-evidence:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: stage24-reproducible-build
          fetch-depth: 0

      - name: Set up Node 22.23.2
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'

      - name: Generate npm lockfile
        working-directory: dashboard
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Set up Python 3.13.15
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'

      - name: Generate hash-locked Python dependency graph
        run: |
          python -m pip install --disable-pip-version-check pip-tools==7.6.1
          python -m piptools compile \
            --generate-hashes \
            --resolver=backtracking \
            --strip-extras \
            --output-file=aetheris-quant/requirements.lock.txt \
            aetheris-quant/requirements.in

      - name: Set up Java 21.0.12
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21.0.12'

      - name: Generate Maven 3.9.11 wrapper
        run: mvn -N org.apache.maven.plugins:maven-wrapper-plugin:3.3.4:wrapper -Dmaven=3.9.11 -Dtype=only-script

      - name: Snapshot Maven runtime dependency graphs
        run: |
          mkdir -p build-evidence/maven
          mvn -f gateway/pom.xml org.apache.maven.plugins:maven-dependency-plugin:3.11.0:tree -Dscope=runtime -DoutputFile="$GITHUB_WORKSPACE/build-evidence/maven/gateway.txt"
          mvn -f user-service/pom.xml org.apache.maven.plugins:maven-dependency-plugin:3.11.0:tree -Dscope=runtime -DoutputFile="$GITHUB_WORKSPACE/build-evidence/maven/user-service.txt"
          mvn -f identity-service/pom.xml org.apache.maven.plugins:maven-dependency-plugin:3.11.0:tree -Dscope=runtime -DoutputFile="$GITHUB_WORKSPACE/build-evidence/maven/identity-service.txt"
          mvn -f audit-service/pom.xml org.apache.maven.plugins:maven-dependency-plugin:3.11.0:tree -Dscope=runtime -DoutputFile="$GITHUB_WORKSPACE/build-evidence/maven/audit-service.txt"

      - name: Commit generated lock evidence
        run: |
          git config user.name "aetheris-stage24-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/package-lock.json aetheris-quant/requirements.lock.txt .mvn/wrapper mvnw mvnw.cmd build-evidence/maven
          git diff --cached --quiet && exit 0
          git commit -m "chore(stage24): generate dependency lock evidence [skip ci]"
          git push origin HEAD:stage24-reproducible-build
