name: Stage 24 Lock Regeneration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-lock-evidence:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Node 22.23.2
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'

      - name: Regenerate npm lockfile
        working-directory: dashboard
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Set up Python 3.13.15
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'

      - name: Regenerate Python hash lock
        run: |
          python -m pip install --disable-pip-version-check pip-tools==7.6.1
          python -m piptools compile \
            --generate-hashes \
            --resolver=backtracking \
            --strip-extras \
            --output-file=aetheris-quant/requirements.lock.txt \
            aetheris-quant/requirements.in

      - name: Set up Java 21.0.12
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21.0.12'

      - name: Regenerate Maven runtime dependency evidence
        run: |
          mkdir -p build-evidence/maven
          ./mvnw -f gateway/pom.xml org.apache.maven.plugins:maven-dependency-plugin:3.11.0:tree -Dscope=runtime -DoutputFile="$GITHUB_WORKSPACE/build-evidence/maven/gateway.txt"
          ./mvnw -f user-service/pom.xml org.apache.maven.plugins:maven-dependency-plugin:3.11.0:tree -Dscope=runtime -DoutputFile="$GITHUB_WORKSPACE/build-evidence/maven/user-service.txt"
          ./mvnw -f identity-service/pom.xml org.apache.maven.plugins:maven-dependency-plugin:3.11.0:tree -Dscope=runtime -DoutputFile="$GITHUB_WORKSPACE/build-evidence/maven/identity-service.txt"
          ./mvnw -f audit-service/pom.xml org.apache.maven.plugins:maven-dependency-plugin:3.11.0:tree -Dscope=runtime -DoutputFile="$GITHUB_WORKSPACE/build-evidence/maven/audit-service.txt"

      - name: Verify regenerated evidence
        run: python scripts/check_dependency_lockdown.py --write-hashes

      - name: Commit regenerated evidence
        run: |
          git config user.name "aetheris-stage24-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/package-lock.json aetheris-quant/requirements.lock.txt build-evidence/maven build-evidence/dependency-lock-sha256.txt
          git diff --cached --quiet && exit 0
          git commit -m "chore(stage24): regenerate dependency lock evidence [skip ci]"
          git push
