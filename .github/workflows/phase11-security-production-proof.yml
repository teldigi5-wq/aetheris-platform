name: Phase 11 Security Production Proof

on:
  pull_request:
    branches:
      - feature/syntra-aetheris-foundation-v2
  push:
    branches:
      - feature/syntra-aetheris-foundation-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase11-security-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-production-proof:
    name: Scoped vault policy, redaction and fail-closed proof
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run scoped secret-access proof
        run: ./mvnw -B -pl orchestrator-service -Dtest=ScopedCredentialAccessServiceTest test

      - name: Verify migrated secret consumers cannot bypass scope
        shell: bash
        run: |
          files=(
            orchestrator-service/src/main/java/io/aetheris/orchestrator/github/GitHubAdapterService.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/model/OpenAiCompatibleModelProviderAdapter.java
          )
          if grep -nE 'CredentialVault|vault\.resolve\(' "${files[@]}"; then
            echo 'A migrated production secret consumer still bypasses ScopedCredentialAccessService.' >&2
            exit 1
          fi
          echo 'Migrated production secret consumers use the scoped credential boundary.'

      - name: Verify security proof contains no credential literals
        shell: bash
        run: |
          if grep -R --line-number -E 'phase11-secret-value|must-be-zeroed' orchestrator-service/src/main; then
            echo 'Phase 11 test credential marker leaked into production source.' >&2
            exit 1
          fi
          echo 'No Phase 11 test credential marker is present in production source.'
