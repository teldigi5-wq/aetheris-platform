name: Secret Exposure Regression (Gitleaks)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-exposure-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks-new-commits:
    name: gitleaks-new-commits
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout full commit history (no persisted credentials)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks with published SHA-256 verification
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          expected_sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          install_dir="${RUNNER_TEMP}/aetheris-gitleaks"
          mkdir -p "$install_dir"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" \
            --output "${install_dir}/${archive}"
          printf '%s  %s\n' "$expected_sha256" "${install_dir}/${archive}" | sha256sum --check --status
          tar -xzf "${install_dir}/${archive}" -C "$install_dir" gitleaks
          chmod 755 "${install_dir}/gitleaks"
          echo "$install_dir" >> "$GITHUB_PATH"


      # The checker itself must NOT be a bash script from the PR checkout.
      # This job remains PR-workflow-controlled until a trusted status-check
      # provider or strict independent workflow-review governance is enforced.
      - name: Scan introduced commits with workflow-owned fail-closed logic
        shell: bash
        env:
          SCAN_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          EXPECTED_PR_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          sha_re='^[0-9a-f]{40}$'
          if [[ ! "${SCAN_BASE_SHA:-}" =~ $sha_re || "${SCAN_BASE_SHA}" =~ ^0{40}$ ]]; then
            echo 'ERROR: invalid/zero base SHA; refusing an unscoped scan.' >&2
            exit 2
          fi
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            if [[ ! "${EXPECTED_PR_HEAD_SHA:-}" =~ $sha_re ]]; then
              echo 'ERROR: malformed expected PR head SHA.' >&2
              exit 2
            fi
            if [[ "$(git rev-parse --verify 'HEAD^1')" != "$SCAN_BASE_SHA" \
                  || "$(git rev-parse --verify 'HEAD^2')" != "$EXPECTED_PR_HEAD_SHA" ]]; then
              echo 'ERROR: checked-out PR merge differs from webhook refs.' >&2
              exit 2
            fi
          elif [[ "$GITHUB_EVENT_NAME" != 'push' ]]; then
            echo 'ERROR: unsupported scanner event.' >&2
            exit 2
          fi
          git cat-file -e "${SCAN_BASE_SHA}^{commit}"
          git merge-base --is-ancestor "$SCAN_BASE_SHA" HEAD
          for override in .gitleaks.toml .gitleaksignore; do
            if [[ -e "$override" || -L "$override" ]]; then
              echo "ERROR: scanner override prohibited: $override" >&2
              exit 2
            fi
          done
          if [[ -n "$(git for-each-ref --format='%(refname)' refs/replace/)" \
                || -f "$(git rev-parse --git-path info/grafts)" ]]; then
            echo 'ERROR: local Git history override prohibited.' >&2
            exit 2
          fi
          count="$(git rev-list --count "${SCAN_BASE_SHA}..HEAD")"
          if (( count < 1 )); then
            echo 'ERROR: empty scan range.' >&2
            exit 2
          fi
          echo "Scanning $count introduced commits."
          gitleaks git --redact --ignore-gitleaks-allow \
            --log-opts="--diff-merges=first-parent --text --no-ext-diff --no-textconv ${SCAN_BASE_SHA}..HEAD" \
            .


      - name: Prove detector detects ephemeral RSA private key (no PR code execution)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          proof_dir="$(mktemp -d "${RUNNER_TEMP}/gitleaks-proof.XXXXXXXX")"
          trap 'rm -rf -- "$proof_dir"' EXIT
          git -C "$proof_dir" init -q
          git -C "$proof_dir" config user.email synthetic-ci@example.invalid
          git -C "$proof_dir" config user.name 'Synthetic Gitleaks Proof'
          printf 'safe seed\\n' > "$proof_dir/README"
          git -C "$proof_dir" add README
          git -C "$proof_dir" commit -qm 'synthetic base'
          base_sha="$(git -C "$proof_dir" rev-parse HEAD)"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out "$proof_dir/disposable-private-key.pem" >/dev/null 2>&1
          git -C "$proof_dir" add disposable-private-key.pem
          git -C "$proof_dir" commit -qm 'synthetic detector fixture'
          set +e
          ( cd "$proof_dir" && gitleaks git --redact --ignore-gitleaks-allow \
             --log-opts="--diff-merges=first-parent --text --no-ext-diff --no-textconv ${base_sha}..HEAD" \
             --report-format json --report-path "$proof_dir/findings.json" . ) >/dev/null 2>&1
          status=$?
          set -e
          if [[ "$status" -ne 1 ]]; then
            echo "ERROR: expected detector exit code 1, got $status" >&2
            exit 2
          fi
          python3 - "$proof_dir/findings.json" <<'PY'
          import json, pathlib, sys
          findings = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if not any(f.get('RuleID') == 'private-key'
                     and pathlib.Path(f.get('File', '')).name == 'disposable-private-key.pem'
                     for f in findings):
              raise SystemExit('ERROR: synthetic private-key finding missing')
          PY
          git -C "$proof_dir" rm -q disposable-private-key.pem
          git -C "$proof_dir" commit -qm 'remove synthetic private key'
          set +e
          ( cd "$proof_dir" && gitleaks git --redact --ignore-gitleaks-allow \
             --log-opts="--diff-merges=first-parent --text --no-ext-diff --no-textconv ${base_sha}..HEAD" \
             --report-format json --report-path "$proof_dir/history.json" . ) >/dev/null 2>&1
          historical_status=$?
          set -e
          if [[ "$historical_status" -ne 1 ]]; then
            echo 'ERROR: deleted historical private key not detected' >&2
            exit 2
          fi
          python3 - "$proof_dir/history.json" <<'PY'
          import json, pathlib, sys
          findings = json.loads(pathlib.Path(sys.argv[1]).read_text())
          if not any(f.get('RuleID') == 'private-key'
                     and pathlib.Path(f.get('File', '')).name == 'disposable-private-key.pem'
                     for f in findings):
              raise SystemExit('ERROR: deleted historical key finding missing')
          PY
          echo 'PASS: ephemeral and deleted-history secret detection.'
