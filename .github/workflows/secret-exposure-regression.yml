name: Secret Exposure Regression (Gitleaks)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-exposure-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks-new-commits:
    name: gitleaks-new-commits
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout full commit history (no persisted credentials)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test fail-closed Git range handling
        shell: bash
        run: python3 -m unittest tests.test_secret_scan_ci -v

      - name: Install pinned Gitleaks with published SHA-256 verification
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          expected_sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          install_dir="${RUNNER_TEMP}/aetheris-gitleaks"
          mkdir -p "$install_dir"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" \
            --output "${install_dir}/${archive}"
          printf '%s  %s\n' "$expected_sha256" "${install_dir}/${archive}" | sha256sum --check --status
          tar -xzf "${install_dir}/${archive}" -C "$install_dir" gitleaks
          chmod 755 "${install_dir}/gitleaks"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Reject secrets added in pull request or main-branch push
        shell: bash
        env:
          SCAN_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          bash scripts/security/scan_new_secrets.sh "$SCAN_BASE_SHA"
