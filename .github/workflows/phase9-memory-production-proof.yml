name: Phase 9 Memory Production Proof

on:
  pull_request:
    branches:
      - feature/syntra-aetheris-foundation-v2
  push:
    branches:
      - feature/syntra-aetheris-foundation-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase9-memory-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  memory-production-proof:
    name: Memory isolation, encryption, retention and inspector proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Phase 9 memory proof
        run: ./mvnw -B -pl orchestrator-service -Dtest=Phase9MemoryProductionIntegrationTest test

      - name: Verify no plaintext Phase 9 test secret was persisted in source
        shell: bash
        run: |
          if grep -R --line-number --exclude='Phase9MemoryProductionIntegrationTest.java' 'phase9-sensitive-' orchestrator-service/src/main; then
            echo 'Unexpected Phase 9 plaintext test-secret marker found in production source.' >&2
            exit 1
          fi
          echo 'No Phase 9 plaintext test-secret marker found in production source.'
