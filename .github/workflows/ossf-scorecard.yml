name: OpenSSF Scorecard

# Ported from stale PR #209. Scorecard supports default-branch push and schedule only.
# Results go to the Security tab and a 14-day artifact; nothing is published externally.
on:
  push:
    branches:
      - main
  schedule:
    - cron: '15 3 * * 6'
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - name: Upload result artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 14
      - name: Upload code scanning result
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca
        with:
          sarif_file: results.sarif
