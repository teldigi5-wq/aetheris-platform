name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test gateway
        run: mvn -f gateway/pom.xml -B test
      - name: Test user service
        run: mvn -f user-service/pom.xml -B test
      - name: Test identity service
        run: mvn -f identity-service/pom.xml -B test
      - name: Test audit service
        run: mvn -f audit-service/pom.xml -B test
      - name: Test orchestrator service
        run: mvn -f orchestrator-service/pom.xml -B test

  workstation-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Parse and policy-check packaging scripts
        shell: pwsh
        run: ./workstation-agent/packaging/validate-scripts.ps1
      - name: Build, test and create unsigned Stage 11 source package
        shell: pwsh
        run: ./workstation-agent/packaging/build-package.ps1
      - name: Verify generated package remains non-production without signature
        shell: pwsh
        run: |
          $manifest = Get-Content ./workstation-agent/dist/manifest.json -Raw | ConvertFrom-Json
          if ($manifest.loopbackOnly -ne $true) { throw 'Host agent package must remain loopback-only' }
          if ($manifest.shellCapability -ne $false) { throw 'Host agent package must not expose shell capability' }
          if ($manifest.requiresAdminAtRuntime -ne $false) { throw 'Host agent normal runtime must not require administrator privileges' }
          if ($manifest.productionActivationAllowed -ne $false) { throw 'Unsigned CI package must not allow production activation' }
          if ($manifest.liveMoneyEnabled -ne $false -or $manifest.withdrawalsEnabled -ne $false -or $manifest.transfersEnabled -ne $false) { throw 'Financial hard boundaries changed unexpectedly' }
          if (-not (Test-Path ./workstation-agent/dist/checksums.sha256)) { throw 'Package checksums are missing' }

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build dashboard
        run: npm run build

  release-hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Secret and sensitive-file gate
        run: python scripts/stage22/release_gate.py
      - name: Persistence schema guard
        run: python scripts/stage22/schema_guard.py
      - name: Generate deterministic source SBOM
        run: python scripts/stage22/generate_sbom.py --output build/stage22/sbom.cdx.json
      - name: Generate deterministic release manifest
        run: python scripts/stage22/release_manifest.py --output build/stage22/release-manifest.json
      - name: Verify deterministic evidence generation
        run: |
          cp build/stage22/sbom.cdx.json /tmp/stage22-sbom-a.json
          cp build/stage22/release-manifest.json /tmp/stage22-manifest-a.json
          python scripts/stage22/generate_sbom.py --output build/stage22/sbom.cdx.json
          python scripts/stage22/release_manifest.py --output build/stage22/release-manifest.json
          cmp /tmp/stage22-sbom-a.json build/stage22/sbom.cdx.json
          cmp /tmp/stage22-manifest-a.json build/stage22/release-manifest.json
      - name: Compute merge-readiness evidence
        run: python scripts/stage22/merge_readiness.py
      - name: Upload Stage 22 release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage22-release-evidence
          path: build/stage22/
          if-no-files-found: warn
          retention-days: 14

  contract-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate deterministic compatibility contract
        run: python scripts/stage23/contract_baseline.py --output build/stage23/contract-baseline.json
      - name: Verify compatibility and safety boundaries
        run: python scripts/stage23/contract_guard.py --baseline build/stage23/contract-baseline.json --expected scripts/stage23/expected-contract.sha256 --output build/stage23/contract-guard.json
      - name: Verify deterministic contract generation
        run: |
          cp build/stage23/contract-baseline.json /tmp/stage23-contract-a.json
          python scripts/stage23/contract_baseline.py --output build/stage23/contract-baseline.json
          cmp /tmp/stage23-contract-a.json build/stage23/contract-baseline.json
      - name: Upload Stage 23 contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage23-contract-evidence
          path: build/stage23/
          if-no-files-found: warn
          retention-days: 14
