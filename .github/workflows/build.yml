name: Build

on:
  push:
    branches: [ main, feature/syntra-aetheris-foundation-v2 ]
  pull_request:
    branches: [ main, feature/syntra-aetheris-foundation-v2 ]

permissions:
  contents: read

env:
  JAVA_VERSION: '21.0.12'
  NODE_VERSION: '22.23.2'
  POLICY_PYTHON_VERSION: '3.12.11'

jobs:
  core-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Test core reactor
        run: ./mvnw test

  dashboard:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Frozen dependency install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build dashboard
        run: npm run build

  core-source-independence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ env.POLICY_PYTHON_VERSION }}
      - name: Require AI-runtime-owned source to be absent
        shell: bash
        run: |
          set -euo pipefail
          for source_dir in orchestrator-service aetheris-quant aetheris-reasoning workstation-agent; do
            test ! -e "$source_dir" || { echo "runtime-owned source leaked into platform: $source_dir" >&2; exit 1; }
          done
      - name: Test core reactor with AI source absent
        run: ./mvnw test
      - name: Build dashboard with AI source absent
        working-directory: dashboard
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Verify core architecture boundary with AI source absent
        run: python -m unittest tests.test_core_ai_runtime_boundary -v

  release-hardening:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ env.POLICY_PYTHON_VERSION }}
      - name: Core / AI runtime architecture boundary
        run: python -m unittest tests.test_core_ai_runtime_boundary -v
      - name: Dashboard browser security boundary
        run: python -m unittest tests.test_dashboard_browser_boundary -v
      - name: Secret and sensitive-file gate
        run: python scripts/stage22/release_gate.py
      - name: Persistence schema guard
        run: python scripts/stage22/schema_guard.py
      - name: Generate deterministic source SBOM
        run: python scripts/stage22/generate_sbom.py --output build/stage22/sbom.cdx.json
      - name: Generate deterministic release manifest
        run: python scripts/stage22/release_manifest.py --output build/stage22/release-manifest.json
      - name: Verify deterministic evidence generation
        run: |
          cp build/stage22/sbom.cdx.json /tmp/stage22-sbom-a.json
          cp build/stage22/release-manifest.json /tmp/stage22-manifest-a.json
          python scripts/stage22/generate_sbom.py --output build/stage22/sbom.cdx.json
          python scripts/stage22/release_manifest.py --output build/stage22/release-manifest.json
          cmp /tmp/stage22-sbom-a.json build/stage22/sbom.cdx.json
          cmp /tmp/stage22-manifest-a.json build/stage22/release-manifest.json
      - name: Compute merge-readiness evidence
        run: python scripts/stage22/merge_readiness.py
      - name: Upload Stage 22 release evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: stage22-release-evidence
          path: build/stage22/
          if-no-files-found: warn
          retention-days: 14

  contract-freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ env.POLICY_PYTHON_VERSION }}
      - name: Generate deterministic compatibility contract
        run: python scripts/stage23/contract_baseline.py --output build/stage23/contract-baseline.json
      - name: Verify compatibility and safety boundaries
        run: python scripts/stage23/contract_guard.py --baseline build/stage23/contract-baseline.json --expected scripts/stage23/expected-contract.sha256 --output build/stage23/contract-guard.json
      - name: Verify deterministic contract generation
        run: |
          cp build/stage23/contract-baseline.json /tmp/stage23-contract-a.json
          python scripts/stage23/contract_baseline.py --output build/stage23/contract-baseline.json
          cmp /tmp/stage23-contract-a.json build/stage23/contract-baseline.json
      - name: Upload Stage 23 contract evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: stage23-contract-evidence
          path: build/stage23/
          if-no-files-found: warn
          retention-days: 14
