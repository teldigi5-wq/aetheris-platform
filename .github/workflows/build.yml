name: Build and Reproducibility

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  NODE_VERSION: '22.23.2'
  PYTHON_VERSION: '3.13.15'
  JAVA_VERSION: '21.0.12'
  PIP_TOOLS_VERSION: '7.6.1'
  PIP_AUDIT_VERSION: '2.10.1'

jobs:
  dependency-lockdown:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Verify committed lockdown policy
        run: python scripts/check_dependency_lockdown.py

      - name: Frozen dashboard install
        working-directory: dashboard
        run: npm ci --ignore-scripts --no-fund

      - name: Audit dashboard dependencies
        working-directory: dashboard
        run: npm audit --audit-level=high

      - name: Regenerate npm lock and detect drift
        working-directory: dashboard
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package-lock.json

      - name: Regenerate Python hash lock and detect drift
        run: |
          python -m pip install --disable-pip-version-check "pip-tools==${PIP_TOOLS_VERSION}"
          python -m piptools compile \
            --generate-hashes \
            --resolver=backtracking \
            --strip-extras \
            --output-file=aetheris-quant/requirements.lock.txt \
            aetheris-quant/requirements.in
          git diff --exit-code -- aetheris-quant/requirements.lock.txt

      - name: Frozen Python install
        run: python -m pip install --disable-pip-version-check --require-hashes -r aetheris-quant/requirements.lock.txt

      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check "pip-audit==${PIP_AUDIT_VERSION}"
          python -m pip_audit -r aetheris-quant/requirements.lock.txt --disable-pip

      - name: Regenerate Maven dependency evidence and detect drift
        run: |
          mkdir -p build-evidence/maven
          ./mvnw -f gateway/pom.xml org.apache.maven.plugins:maven-dependency-plugin:3.11.0:tree -Dscope=runtime -DoutputFile="$GITHUB_WORKSPACE/build-evidence/maven/gateway.txt"
          ./mvnw -f user-service/pom.xml org.apache.maven.plugins:maven-dependency-plugin:3.11.0:tree -Dscope=runtime -DoutputFile="$GITHUB_WORKSPACE/build-evidence/maven/user-service.txt"
          ./mvnw -f identity-service/pom.xml org.apache.maven.plugins:maven-dependency-plugin:3.11.0:tree -Dscope=runtime -DoutputFile="$GITHUB_WORKSPACE/build-evidence/maven/identity-service.txt"
          ./mvnw -f audit-service/pom.xml org.apache.maven.plugins:maven-dependency-plugin:3.11.0:tree -Dscope=runtime -DoutputFile="$GITHUB_WORKSPACE/build-evidence/maven/audit-service.txt"
          git diff --exit-code -- build-evidence/maven

      - name: Generate dependency evidence hashes
        run: python scripts/check_dependency_lockdown.py --write-hashes

      - name: Upload dependency evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-lock-evidence
          path: |
            build-evidence/dependency-lock-sha256.txt
            build-evidence/maven/*.txt
            dashboard/package-lock.json
            aetheris-quant/requirements.lock.txt
          if-no-files-found: error

  reproducible-build:
    runs-on: ubuntu-24.04
    needs: dependency-lockdown
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build Java services - pass 1
        run: |
          ./mvnw -f gateway/pom.xml clean package
          ./mvnw -f user-service/pom.xml clean package
          ./mvnw -f identity-service/pom.xml clean package
          ./mvnw -f audit-service/pom.xml clean package

      - name: Build dashboard - pass 1
        working-directory: dashboard
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Hash pass 1 artifacts
        run: |
          mkdir -p build-evidence/artifacts
          tar --sort=name --mtime='UTC 2026-09-13 00:00:00' --owner=0 --group=0 --numeric-owner -cf - -C dashboard/dist . | gzip -n > build-evidence/artifacts/dashboard-dist.tar.gz
          {
            find gateway/target user-service/target identity-service/target audit-service/target -maxdepth 1 -type f -name '*.jar' -print0 | sort -z | xargs -0 sha256sum
            sha256sum build-evidence/artifacts/dashboard-dist.tar.gz
          } > build-evidence/artifacts/pass-1.sha256

      - name: Clean generated artifacts
        run: rm -rf gateway/target user-service/target identity-service/target audit-service/target dashboard/dist build-evidence/artifacts/dashboard-dist.tar.gz

      - name: Build Java services - pass 2
        run: |
          ./mvnw -f gateway/pom.xml clean package
          ./mvnw -f user-service/pom.xml clean package
          ./mvnw -f identity-service/pom.xml clean package
          ./mvnw -f audit-service/pom.xml clean package

      - name: Build dashboard - pass 2
        working-directory: dashboard
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Hash pass 2 artifacts and compare
        run: |
          tar --sort=name --mtime='UTC 2026-09-13 00:00:00' --owner=0 --group=0 --numeric-owner -cf - -C dashboard/dist . | gzip -n > build-evidence/artifacts/dashboard-dist.tar.gz
          {
            find gateway/target user-service/target identity-service/target audit-service/target -maxdepth 1 -type f -name '*.jar' -print0 | sort -z | xargs -0 sha256sum
            sha256sum build-evidence/artifacts/dashboard-dist.tar.gz
          } > build-evidence/artifacts/pass-2.sha256
          diff -u build-evidence/artifacts/pass-1.sha256 build-evidence/artifacts/pass-2.sha256
          cp build-evidence/artifacts/pass-2.sha256 build-evidence/artifact-sha256.txt

      - name: Upload reproducibility evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reproducible-build-evidence
          path: |
            build-evidence/artifact-sha256.txt
            build-evidence/artifacts/pass-1.sha256
            build-evidence/artifacts/pass-2.sha256
            build-evidence/artifacts/dashboard-dist.tar.gz
          if-no-files-found: error
