name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test gateway
        run: mvn -f gateway/pom.xml -B test
      - name: Test user service
        run: mvn -f user-service/pom.xml -B test
      - name: Test identity service
        run: mvn -f identity-service/pom.xml -B test
      - name: Test audit service
        run: mvn -f audit-service/pom.xml -B test

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build dashboard
        run: npm run build
