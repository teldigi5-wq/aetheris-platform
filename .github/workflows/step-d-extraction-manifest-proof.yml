name: Architecture Step D Final Extraction Proof

on:
  pull_request:
    branches:
      - main
      - feature/syntra-aetheris-foundation-v2
  push:
    branches:
      - main
      - feature/syntra-aetheris-foundation-v2
  workflow_dispatch:

permissions:
  contents: read

env:
  AETHERIS_EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
  AETHERIS_AI_RUNTIME_IMAGE: aetheris-ai-runtime:65a6262717adcd52ac8d8a16ed6f223e299fd74d

jobs:
  final-source-extracted-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.15'

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven

      - name: Verify exact revision binding
        run: |
          test "$(git rev-parse HEAD)" = "$AETHERIS_EXPECTED_REVISION"
          echo "final extraction revision=$AETHERIS_EXPECTED_REVISION"

      - name: Compile final extraction verifier
        run: python -m py_compile tools/verify_ai_runtime_extraction_manifest.py

      - name: Verify actual source-extracted repository state
        run: python tools/verify_ai_runtime_extraction_manifest.py

      - name: Build and test core reactor with runtime source genuinely absent
        run: ./mvnw --batch-mode --no-transfer-progress test

      - name: Validate source-absent deployment definitions
        run: |
          docker compose -f docker-compose.core.yml config >/dev/null
          docker compose -f docker-compose.yml config >/dev/null
          docker compose \
            -f docker-compose.integration-external.yml \
            --profile observability \
            config >/dev/null

      - name: Verify source-extracted machine-readable evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path('build-evidence/architecture/ai-runtime-extraction-final-report.json').read_text()
          )
          expected_platform = '${{ github.event.pull_request.head.sha || github.sha }}'
          expected_runtime = '65a6262717adcd52ac8d8a16ed6f223e299fd74d'
          assert report['status'] == 'PASS', report
          assert report['mode'] == 'platform-source-extracted', report
          assert report['platform_revision'] == expected_platform, report
          assert report['destination_repository'] == 'teldigi5-wq/aetheris-ai-runtime', report
          assert report['destination_certified_sha'] == expected_runtime, report
          assert report['runtime_release_archive_sha256'] == '18d934cee0ac61bb1065cfd8c104c4b91d10bad6d1d745c5ff72e86c03e0f14c', report
          assert report['platform_runtime_source_present'] is False, report
          assert len(report['move_roots']) == 4, report
          assert len(report['runtime_owned_workflows_removed']) == 33, report
          assert set(report['root_maven_modules']) == {
              'gateway', 'user-service', 'identity-service', 'audit-service'
          }, report
          truth = report['truth_boundaries']
          assert truth['physical_pc_validation'] is False, truth
          assert truth['physical_pc_status'] == 'BLOCKED_PENDING_HARDWARE', truth
          assert truth['production_deployment_claim'] is False, truth
          assert truth['registry_publication_claim'] is False, truth
          print('final source-extracted platform boundary verified')
          PY

      - name: Publish final extraction evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: step-d-final-ai-runtime-extraction-proof
          path: build-evidence/architecture/ai-runtime-extraction-final-report.json
          if-no-files-found: error
          retention-days: 30
