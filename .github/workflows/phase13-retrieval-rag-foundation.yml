name: Phase 13 Retrieval RAG Foundation

on:
  pull_request:
    branches:
      - feature/syntra-aetheris-foundation-v2
  push:
    branches:
      - feature/syntra-aetheris-foundation-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase13-retrieval-rag-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retrieval-rag-foundation:
    name: Scoped retrieval and evidence proof
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Phase 13 retrieval foundation proof
        run: >-
          ./mvnw -B -f orchestrator-service/pom.xml
          -Dtest=Phase13RetrievalFoundationTest
          test

      - name: Verify scoped retrieval surfaces
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/RetrievalScope.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/RetrievalBounds.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/RetrievalDocument.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/RetrievalQuery.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/RetrievalIngestionReceipt.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/RetrievalEvidence.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraRetrievalService.java
            orchestrator-service/src/test/java/io/aetheris/orchestrator/syntracore/Phase13RetrievalFoundationTest.java
            docs/phase13-retrieval-rag-foundation.md
          )

          for required_file in "${required_files[@]}"; do
            test -f "$required_file" || {
              echo "Missing Phase 13 retrieval surface: $required_file" >&2
              exit 1
            }
          done

          grep -q "IncrementalKnowledgeIngestionService" orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraRetrievalService.java
          grep -q "Stage9AdaptiveVectorIndexService" orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraRetrievalService.java
          grep -q "includeProtected=false" docs/phase13-retrieval-rag-foundation.md
          grep -q "aetheris-memory://" orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraRetrievalService.java

          if grep -R "HttpClient" orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/Retrieval*.java orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraRetrievalService.java; then
            echo "Slice 3 retrieval facade must not add a network client" >&2
            exit 1
          fi

          if grep -R "interface .*Embedding" orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/Retrieval*.java orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraRetrievalService.java; then
            echo "Slice 3 must reuse the existing EmbeddingAdapter abstraction" >&2
            exit 1
          fi

          echo "Phase 13 scoped retrieval foundation surfaces verified."
