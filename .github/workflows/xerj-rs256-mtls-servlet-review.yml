name: XERJ RS256 and Gateway mTLS servlet identity reconciliation (review only)
on:
  pull_request:
    branches: [security/xerj-rs256-real-disposable-proof-20261106]
    paths:
      - 'user-service/**'
      - 'audit-service/**'
      - '.github/workflows/xerj-rs256-mtls-servlet-review.yml'
      - 'docs/security/XERJ_RS256_MTLS_BACKEND_POLICY_20261106.md'
permissions:
  contents: read
jobs:
  deny-unverified-gateway-peer-before-jwt:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact SHA without persisted token
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - name: Verify no duplicate backend servlet authorization filters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for svc,pkg in (("user-service","users"),("audit-service","audit")):
              root=Path(svc)/"src/main/java/io/aetheris"/pkg/"security"
              assert (root/"GatewayMutualTlsWorkloadPolicy.java").is_file()
              assert (root/"ServiceJwtAuthorizationFilter.java").is_file()
              assert not (root/"DirectApiJwtFilter.java").exists()
              count=sum("extends OncePerRequestFilter" in p.read_text()
                        for p in root.glob("*.java"))
              assert count == 1, (svc,count)
          print("XERJ_SINGLE_FILTER_MTLS_POLICY_GUARD_PASS")
          PY
      - name: User mTLS certificate attribute denials and existing RSA/HS security regressions
        run: ./mvnw -B -ntp -f user-service/pom.xml -Dtest=GatewayMutualTlsWorkloadPolicyTest,ServiceJwtAuthorizationFilterTest,ServiceJwtRs256ModeTest,UserWebSliceAuthorizationTest test
      - name: Audit mTLS certificate attribute denials and existing RSA/HS security regressions
        run: ./mvnw -B -ntp -f audit-service/pom.xml -Dtest=GatewayMutualTlsWorkloadPolicyTest,ServiceJwtAuthorizationFilterTest,ServiceJwtRs256ModeTest,AuditWebSliceAuthorizationTest test
      - name: Gateway pinned RS256 resource verification and live route context regression
        run: ./mvnw -B -ntp -f gateway/pom.xml -Dtest=JwtRs256ModeTest,JwtAuthenticationFilterTest,GatewayLiveRouteBindingTest test
      - name: Identity RS256 private signing and issuer/expiry contract regression
        run: ./mvnw -B -ntp -f identity-service/pom.xml -Dtest=JwtServiceRs256ModeTest,JwtServiceIssuerAudienceTest test
