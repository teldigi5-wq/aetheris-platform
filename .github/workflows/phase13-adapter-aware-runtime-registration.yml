name: Phase 13 Adapter-Aware Runtime Registration

on:
  pull_request:
    branches:
      - feature/syntra-aetheris-foundation-v2
  push:
    branches:
      - feature/syntra-aetheris-foundation-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase13-adapter-aware-runtime-registration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adapter-aware-runtime-registration:
    name: Verified activation to routing catalog proof
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Phase 13 adapter-aware runtime registration proof
        run: >-
          ./mvnw -B -f orchestrator-service/pom.xml
          -Dtest=Phase13AdapterAwareRuntimeRegistrationTest
          test

      - name: Verify Slice 10 routing and authority boundaries
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdapterAwareSyntraModelRuntime.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdapterRuntimeRegistration.java
            orchestrator-service/src/test/java/io/aetheris/orchestrator/syntracore/Phase13AdapterAwareRuntimeRegistrationTest.java
            docs/phase13-adapter-aware-runtime-registration.md
          )

          for required_file in "${required_files[@]}"; do
            test -f "$required_file" || {
              echo "Missing Phase 13 Slice 10 surface: $required_file" >&2
              exit 1
            }
          done

          grep -q 'ACTIVATED_VERIFIED' \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdapterRuntimeRegistration.java
          grep -q 'aetheris-adapter-runtime://sha256/' \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdapterRuntimeRegistration.java
          grep -q 'AdapterAwareSyntraModelRuntime' \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraLocalInferenceOrchestrator.java
          grep -q 'base model is not present on the same local runtime' \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraLocalInferenceOrchestrator.java

          slice_sources=(
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdapterAwareSyntraModelRuntime.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/AdapterRuntimeRegistration.java
          )

          if grep -E 'ProcessBuilder|Runtime\.getRuntime|HttpClient|WebClient|RestTemplate|FileOutputStream|Files\.write|Files\.delete|Files\.move' "${slice_sources[@]}"; then
            echo "Slice 10 must not implement subprocess, network, installer, or filesystem effects" >&2
            exit 1
          fi

          if grep -R 'io.aetheris.orchestrator.\(tool\|connector\|browser\|computeruse\)' "${slice_sources[@]}"; then
            echo "Slice 10 adapter registration must not gain tool, connector, browser, or computer-use authority" >&2
            exit 1
          fi

          echo "Phase 13 Slice 10 adapter-aware runtime registration boundaries verified."
