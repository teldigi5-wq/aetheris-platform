name: Aetheris PostgreSQL schema migration rehearsal

on:
  pull_request:
    branches: [main]
    paths:
      - 'database/migration-candidates/**'
      - 'scripts/security/rehearse_pg_migrations.sh'
      - 'tests/test_schema_migration_candidate.py'
      - '.github/workflows/schema-migration-rehearsal.yml'
      - 'identity-service/src/main/java/**'
      - 'user-service/src/main/java/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-rehearsal:
    name: Synthetic PostgreSQL 16 migration readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify candidates are not executed in production
        run: python -m unittest tests.test_schema_migration_candidate -v
      - name: Rehearse clean and legacy schemas on disposable PostgreSQL
        run: bash scripts/security/rehearse_pg_migrations.sh
