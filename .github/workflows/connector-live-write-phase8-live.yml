name: Connector Live Write Phase 8 Live Test-Account Validation

on:
  push:
    branches:
      - feature/connector-live-test-write-phase8
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connector-live-write-phase8-live
  cancel-in-progress: false

jobs:
  gate-closed:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[phase8-live-write]')
    runs-on: ubuntu-24.04
    steps:
      - name: Keep live provider mutations disarmed
        run: echo 'Phase 8 live provider writes are disarmed. Use an explicit [phase8-live-write] commit signal with repository test-account secrets configured.'

  live-test-account-write-validation:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[phase8-live-write]')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Load certified external AI runtime
        shell: bash
        run: ./tools/load_certified_ai_runtime.sh

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.15'
          check-latest: false

      - name: Validate Phase 8 harness before arming
        run: |
          python -m py_compile tools/connector_live_write_phase8_token_broker.py
          python -m py_compile tools/connector_live_write_phase8_validation.py
          python tools/connector_live_write_phase8_validation.py \
            --contract build-evidence/runtime/connector-live-write-phase8-contract.json \
            --preflight

      - name: Require dedicated test-account credentials and explicit arm confirmation
        shell: bash
        env:
          GITHUB_TOKEN_VALUE: ${{ secrets.AETHERIS_PHASE8_GITHUB_ACCESS_TOKEN }}
          GMAIL_TOKEN_VALUE: ${{ secrets.AETHERIS_LIVE_GMAIL_ACCESS_TOKEN }}
          CALENDAR_TOKEN_VALUE: ${{ secrets.AETHERIS_LIVE_CALENDAR_ACCESS_TOKEN }}
          GOOGLE_REFRESH_CLIENT_ID_VALUE: ${{ secrets.AETHERIS_PHASE8_GOOGLE_REFRESH_CLIENT_ID }}
          GOOGLE_REFRESH_CLIENT_SECRET_VALUE: ${{ secrets.AETHERIS_PHASE8_GOOGLE_REFRESH_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN_VALUE: ${{ secrets.AETHERIS_PHASE8_GOOGLE_REFRESH_TOKEN }}
          GMAIL_TARGET_VALUE: ${{ secrets.AETHERIS_PHASE8_TEST_GMAIL_RECIPIENT }}
          CALENDAR_TARGET_VALUE: ${{ secrets.AETHERIS_PHASE8_TEST_CALENDAR_ID }}
          GITHUB_TARGET_VALUE: ${{ secrets.AETHERIS_PHASE8_TEST_GITHUB_REPOSITORY }}
          ARM_VALUE: ${{ secrets.AETHERIS_PHASE8_ARM_CONFIRMATION }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          always_required = {
              'GITHUB_TOKEN_VALUE': 'AETHERIS_PHASE8_GITHUB_ACCESS_TOKEN',
              'GMAIL_TARGET_VALUE': 'AETHERIS_PHASE8_TEST_GMAIL_RECIPIENT',
              'CALENDAR_TARGET_VALUE': 'AETHERIS_PHASE8_TEST_CALENDAR_ID',
              'GITHUB_TARGET_VALUE': 'AETHERIS_PHASE8_TEST_GITHUB_REPOSITORY',
          }
          legacy_google = {
              'GMAIL_TOKEN_VALUE': 'AETHERIS_LIVE_GMAIL_ACCESS_TOKEN',
              'CALENDAR_TOKEN_VALUE': 'AETHERIS_LIVE_CALENDAR_ACCESS_TOKEN',
          }
          refresh_google = {
              'GOOGLE_REFRESH_CLIENT_ID_VALUE': 'AETHERIS_PHASE8_GOOGLE_REFRESH_CLIENT_ID',
              'GOOGLE_REFRESH_CLIENT_SECRET_VALUE': 'AETHERIS_PHASE8_GOOGLE_REFRESH_CLIENT_SECRET',
              'GOOGLE_REFRESH_TOKEN_VALUE': 'AETHERIS_PHASE8_GOOGLE_REFRESH_TOKEN',
          }

          missing = [
              secret_name
              for env_name, secret_name in always_required.items()
              if not os.environ.get(env_name, '').strip()
          ]

          legacy_ready = all(os.environ.get(name, '').strip() for name in legacy_google)
          refresh_ready = all(os.environ.get(name, '').strip() for name in refresh_google)

          if not (legacy_ready or refresh_ready):
              missing.extend(
                  secret_name
                  for env_name, secret_name in refresh_google.items()
                  if not os.environ.get(env_name, '').strip()
              )
              missing.extend(
                  secret_name
                  for env_name, secret_name in legacy_google.items()
                  if not os.environ.get(env_name, '').strip()
              )

          expected_arm = 'I_UNDERSTAND_PHASE8_CREATES_LIVE_TEST_DATA'
          if os.environ.get('ARM_VALUE', '').strip() != expected_arm:
              missing.append('AETHERIS_PHASE8_ARM_CONFIRMATION')

          google_auth_mode = (
              'REFRESH_TOKEN'
              if refresh_ready
              else 'LEGACY_ACCESS_TOKENS'
              if legacy_ready
              else 'UNCONFIGURED'
          )

          report = {
              'schema_version': 1,
              'capability': 'connector-live-write-phase8',
              'evidence_class': 'LIVE_PROVIDER_TEST_ACCOUNT_WRITE_READINESS',
              'status': 'READY' if not missing else 'BLOCKED_MISSING_CONFIGURATION',
              'missing_configuration': sorted(set(missing)),
              'google_auth_mode': google_auth_mode,
              'secret_values_persisted': False,
              'target_values_persisted': False,
              'provider_mutation_started': False,
              'physical_pc_validation': False,
              'physical_pc_status': 'BLOCKED_PENDING_HARDWARE',
          }
          path = Path('build-evidence/runtime/connector-live-write-phase8-readiness.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          if missing:
              print('Phase 8 live validation is blocked before provider mutation.')
              print('Missing configuration: ' + ', '.join(sorted(set(missing))))
              raise SystemExit(1)
          print('Phase 8 dedicated test-account credential gate is armed.')
          print('Google credential mode: ' + google_auth_mode)
          PY

      - name: Resolve Google provider access tokens
        shell: bash
        env:
          LEGACY_GMAIL_ACCESS_TOKEN: ${{ secrets.AETHERIS_LIVE_GMAIL_ACCESS_TOKEN }}
          LEGACY_CALENDAR_ACCESS_TOKEN: ${{ secrets.AETHERIS_LIVE_CALENDAR_ACCESS_TOKEN }}
          GOOGLE_REFRESH_CLIENT_ID: ${{ secrets.AETHERIS_PHASE8_GOOGLE_REFRESH_CLIENT_ID }}
          GOOGLE_REFRESH_CLIENT_SECRET: ${{ secrets.AETHERIS_PHASE8_GOOGLE_REFRESH_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.AETHERIS_PHASE8_GOOGLE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          refresh_client_id = os.environ.get('GOOGLE_REFRESH_CLIENT_ID', '').strip()
          refresh_client_secret = os.environ.get('GOOGLE_REFRESH_CLIENT_SECRET', '').strip()
          refresh_token = os.environ.get('GOOGLE_REFRESH_TOKEN', '').strip()
          legacy_gmail = os.environ.get('LEGACY_GMAIL_ACCESS_TOKEN', '').strip()
          legacy_calendar = os.environ.get('LEGACY_CALENDAR_ACCESS_TOKEN', '').strip()

          refresh_ready = all([refresh_client_id, refresh_client_secret, refresh_token])
          legacy_ready = bool(legacy_gmail and legacy_calendar)

          def export_secret(name: str, value: str) -> None:
              if not value or '\n' in value or '\r' in value:
                  raise SystemExit('Resolved Google credential is invalid.')
              print(f'::add-mask::{value}')
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
                  env_file.write(f'{name}={value}\n')

          if refresh_ready:
              form = urllib.parse.urlencode({
                  'client_id': refresh_client_id,
                  'client_secret': refresh_client_secret,
                  'refresh_token': refresh_token,
                  'grant_type': 'refresh_token',
              }).encode('utf-8')
              request = urllib.request.Request(
                  'https://oauth2.googleapis.com/token',
                  data=form,
                  headers={
                      'Accept': 'application/json',
                      'Content-Type': 'application/x-www-form-urlencoded',
                  },
                  method='POST',
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      raw = response.read().decode('utf-8')
                      status = response.status
              except urllib.error.HTTPError as error:
                  print(f'Google OAuth refresh failed with HTTP {error.code}.')
                  raise SystemExit(1)
              except (OSError, urllib.error.URLError):
                  print('Google OAuth refresh request could not be completed.')
                  raise SystemExit(1)

              if status != 200:
                  print(f'Google OAuth refresh failed with HTTP {status}.')
                  raise SystemExit(1)

              try:
                  payload = json.loads(raw)
              except json.JSONDecodeError:
                  print('Google OAuth refresh returned an invalid response shape.')
                  raise SystemExit(1)

              access_token = str(payload.get('access_token', '')).strip()
              try:
                  expires_in = int(payload.get('expires_in', 0))
              except (TypeError, ValueError):
                  expires_in = 0

              if not access_token or expires_in < 120:
                  print('Google OAuth refresh did not return a usable access token.')
                  raise SystemExit(1)

              export_secret('AETHERIS_PHASE8_GMAIL_ACCESS_TOKEN', access_token)
              export_secret('AETHERIS_PHASE8_CALENDAR_ACCESS_TOKEN', access_token)
              print('Fresh Google provider access token resolved from the stored refresh token.')
          elif legacy_ready:
              export_secret('AETHERIS_PHASE8_GMAIL_ACCESS_TOKEN', legacy_gmail)
              export_secret('AETHERIS_PHASE8_CALENDAR_ACCESS_TOKEN', legacy_calendar)
              print('Using legacy short-lived Google provider access tokens.')
          else:
              print('No complete Google credential mode is configured.')
              raise SystemExit(1)
          PY

      - name: Create ephemeral local OAuth client credentials
        shell: bash
        run: |
          github_client_id="phase8-github-$(openssl rand -hex 8)"
          github_client_secret="$(openssl rand -hex 32)"
          google_client_id="phase8-google-$(openssl rand -hex 8)"
          google_client_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$github_client_id"
          echo "::add-mask::$github_client_secret"
          echo "::add-mask::$google_client_id"
          echo "::add-mask::$google_client_secret"
          echo "AETHERIS_OAUTH_GITHUB_CLIENT_ID=$github_client_id" >> "$GITHUB_ENV"
          echo "AETHERIS_OAUTH_GITHUB_CLIENT_SECRET=$github_client_secret" >> "$GITHUB_ENV"
          echo "AETHERIS_OAUTH_GOOGLE_CLIENT_ID=$google_client_id" >> "$GITHUB_ENV"
          echo "AETHERIS_OAUTH_GOOGLE_CLIENT_SECRET=$google_client_secret" >> "$GITHUB_ENV"

      - name: Start ephemeral Phase 8 credential broker
        shell: bash
        env:
          AETHERIS_PHASE8_GITHUB_ACCESS_TOKEN: ${{ secrets.AETHERIS_PHASE8_GITHUB_ACCESS_TOKEN }}
        run: |
          python tools/connector_live_write_phase8_token_broker.py > /tmp/aetheris-phase8-broker.log 2>&1 &
          echo $! > /tmp/aetheris-phase8-broker.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:19091/health >/dev/null; then
              echo 'Phase 8 credential broker is ready.'
              exit 0
            fi
            sleep 1
          done
          echo 'Phase 8 credential broker did not become ready.'
          exit 1

      - name: Start Aetheris with real provider write endpoints
        shell: bash
        run: |
          docker compose -f docker-compose.integration-external.yml -f build-evidence/runtime/connector-live-write-phase8-compose.override.yml \
            up -d --build orchestrator-service
          docker compose -f docker-compose.integration-external.yml -f build-evidence/runtime/connector-live-write-phase8-compose.override.yml ps

      - name: Run credential-gated real test-account write validation
        env:
          AETHERIS_PHASE8_ARM_CONFIRMATION: ${{ secrets.AETHERIS_PHASE8_ARM_CONFIRMATION }}
          AETHERIS_PHASE8_TEST_GMAIL_RECIPIENT: ${{ secrets.AETHERIS_PHASE8_TEST_GMAIL_RECIPIENT }}
          AETHERIS_PHASE8_TEST_CALENDAR_ID: ${{ secrets.AETHERIS_PHASE8_TEST_CALENDAR_ID }}
          AETHERIS_PHASE8_TEST_GITHUB_REPOSITORY: ${{ secrets.AETHERIS_PHASE8_TEST_GITHUB_REPOSITORY }}
          AETHERIS_PHASE8_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python tools/connector_live_write_phase8_validation.py \
            --contract build-evidence/runtime/connector-live-write-phase8-contract.json \
            --output build-evidence/runtime/connector-live-write-phase8-report.json

      - name: Verify sanitized live-provider report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('build-evidence/runtime/connector-live-write-phase8-report.json').read_text())
          assert report['status'] == 'PASS', report
          assert report['evidence_class'] == 'LIVE_PROVIDER_TEST_ACCOUNT_WRITES', report
          assert report['capability'] == 'connector-live-write-phase8', report
          assert report['physical_pc_validation'] is False, report
          assert report['physical_pc_status'] == 'BLOCKED_PENDING_HARDWARE', report
          assert report['provider_response_bodies_persisted'] is False, report
          assert report['account_identifiers_persisted'] is False, report
          assert report['target_values_persisted'] is False, report
          assert report['token_material_persisted'] is False, report
          assert report['provider_exactly_once_proven'] is False, report
          assert len(report['checks']) == 20, report
          assert all(value == 'PASS' for value in report['checks'].values()), report
          print('verified 20 Phase 8 credential-gated live test-account write checks')
          PY

      - name: Publish sanitized Phase 8 evidence only
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: connector-live-write-phase8-sanitized-evidence
          path: |
            build-evidence/runtime/connector-live-write-phase8-readiness.json
            build-evidence/runtime/connector-live-write-phase8-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Tear down Phase 8 runtime
        if: always()
        shell: bash
        run: |
          docker compose -f docker-compose.integration-external.yml -f build-evidence/runtime/connector-live-write-phase8-compose.override.yml \
            down -v --remove-orphans || true
          if [ -f /tmp/aetheris-phase8-broker.pid ]; then
            kill "$(cat /tmp/aetheris-phase8-broker.pid)" 2>/dev/null || true
          fi
