name: Aetheris Compose Credentials and Isolation Proof
on:
  push:
    branches:
      - release/aetheris-compose-credential-hardening-20261027
  pull_request:
    branches: [main]
    paths:
      - 'docker-compose*.yml'
      - '.env.example'
      - '.gitignore'
      - '**/src/main/resources/application.yml'
      - 'observability/alloy.alloy'
      - 'tests/test_compose_default_security.py'
      - '.github/workflows/compose-credentials-proof.yml'
permissions:
  contents: read
jobs:
  credentials-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.18'
      - name: Test fail-closed secrets and parsed Compose isolation
        run: |
          docker compose version
          python -m unittest tests.test_compose_default_security tests.test_compose_loopback_boundary -v
