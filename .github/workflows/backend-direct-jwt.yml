name: Backend Service JWT Authorization Regression
on:
  pull_request:
    branches:
      - docs/aetheris-security-roadmap-sync-20261025
      - security/backend-direct-jwt-scope-20261025
      - security/direct-service-jwt-boundary-20261025
    paths:
      - 'user-service/**'
      - 'audit-service/**'
      - 'docker-compose*.yml'
      - 'deploy/helm/aetheris/templates/core.yaml'
      - 'tests/test_backend_jwt_wiring.py'
      - '.github/workflows/backend-direct-jwt.yml'
      - 'docs/security/backend-direct-access-20261025.md'
permissions:
  contents: read
jobs:
  service-jwt-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with: {distribution: temurin, java-version: '21.0.12', cache: maven}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Check Config and explicit no-trust forwarded-headers invariant
        run: python tests/test_backend_jwt_wiring.py
      - name: Execute exact service JWT and existing Java regressions
        run: |
          ./mvnw -B -ntp -f user-service/pom.xml test
          ./mvnw -B -ntp -f audit-service/pom.xml test
