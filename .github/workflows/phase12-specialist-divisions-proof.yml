name: Phase 12 Specialist Divisions Proof

on:
  pull_request:
    branches:
      - feature/syntra-aetheris-foundation-v2
  push:
    branches:
      - feature/syntra-aetheris-foundation-v2
      - feature/specialist-divisions-phase12
      - feature/specialist-verification-phase12
      - feature/governed-delegation-phase12
      - feature/scheduler-worker-identity-phase12
      - feature/direct-execution-authority-phase12
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase12-specialist-divisions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  specialist-divisions-proof:
    name: Specialist isolation, governed-completion, delegation, worker-identity and direct-execution proof
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Phase 12 specialist boundary proofs
        run: ./mvnw -B -pl orchestrator-service -Dtest=Phase12SpecialistDivisionsIntegrationTest,Phase12SpecialistVerificationIntegrationTest,Phase12GovernedDelegationIntegrationTest,Phase12WorkerIdentityBindingIntegrationTest,Phase12DirectExecutionAuthorityTest test

      - name: Verify safe-tool gateway enforces specialist boundary first
        shell: bash
        run: |
          file=orchestrator-service/src/main/java/io/aetheris/orchestrator/tool/SafeToolRegistryService.java
          grep -q 'specialistTools.evaluate' "$file"
          grep -q 'if (!specialistDecision.allowed())' "$file"
          grep -q 'new CompiledPolicyDecision' "$file"
          echo 'Safe-tool gateway contains the fail-closed specialist boundary.'

      - name: Verify specialist mapping is explicit and contains no wildcard grant
        shell: bash
        run: |
          file=orchestrator-service/src/main/java/io/aetheris/orchestrator/tool/SpecialistToolAuthorizationService.java
          for mapping in \
            '"github.read", "github"' \
            '"github.propose-change", "github"' \
            '"files.read-workspace", "filesystem"' \
            '"files.write-workspace", "filesystem"' \
            '"terminal.inspect", "terminal"' \
            '"terminal.execute-workspace", "terminal"'; do
            grep -q "$mapping" "$file"
          done
          if grep -nE 'contains\("\*"\)|startsWith\(.*allowed|wildcard' "$file"; then
            echo 'Specialist tool boundary contains wildcard/prefix privilege expansion.' >&2
            exit 1
          fi
          echo 'Specialist tool families are explicit and exact.'

      - name: Verify task completion cannot bypass independent verification
        shell: bash
        run: |
          task_service=orchestrator-service/src/main/java/io/aetheris/orchestrator/task/TaskService.java
          verification_service=orchestrator-service/src/main/java/io/aetheris/orchestrator/task/TaskVerificationService.java
          workflow=orchestrator-service/src/main/java/io/aetheris/orchestrator/workflow/EngineeringWorkflowService.java
          connector=orchestrator-service/src/main/java/io/aetheris/orchestrator/connector/action/ConnectorActionService.java
          grep -q 'verification.assertCompletionAllowed' "$task_service"
          grep -q 'The execution specialist cannot verify its own work' "$verification_service"
          grep -q 'cannot self-promote to final verifier' "$verification_service"
          grep -q 'does not have an independent verification capability' "$verification_service"
          grep -q 'verification.recordDecision' "$workflow"
          grep -q 'TaskState.VERIFYING, "qa-engineer"' "$connector"
          grep -q '"mcp-integration-engineer"' "$connector"
          grep -q 'TaskState.COMPLETED, "mcp-integration-engineer"' "$connector"
          if grep -q 'TaskState.COMPLETED, "automation-engineer"' "$connector"; then
            echo 'Connector action lifecycle still allows executor self-certification.' >&2
            exit 1
          fi
          echo 'Governed completion and independent-verifier boundary are wired into task and connector completion.'

      - name: Verify delegation cannot transfer or invent specialist authority
        shell: bash
        run: |
          delegation=orchestrator-service/src/main/java/io/aetheris/orchestrator/task/TaskDelegationService.java
          task_service=orchestrator-service/src/main/java/io/aetheris/orchestrator/task/TaskService.java
          planner=orchestrator-service/src/main/java/io/aetheris/orchestrator/planner/MissionPlannerService.java
          workflow=orchestrator-service/src/main/java/io/aetheris/orchestrator/workflow/EngineeringWorkflowService.java
          grep -q 'DELEGATION_CAPABILITY = "delegation"' "$delegation"
          grep -q 'does not have delegation capability' "$delegation"
          grep -q 'authorityTransferred' "$delegation"
          grep -q 'verificationRequired' "$delegation"
          grep -q 'delegation.recordExecutionAssignment' "$task_service"
          grep -q 'activateDelegatedExecution' "$task_service"
          grep -q 'tasks.activateDelegatedExecution' "$workflow"
          grep -q 'delegations.assertPlannedAssignmentAllowed' "$planner"
          grep -q 'delegations.recordPlannedAssignment' "$planner"
          grep -q 'delegatorId' "$planner"
          grep -q 'delegateId' "$planner"
          grep -q 'authorityTransferred.*false' "$planner"
          if grep -nE 'DELEGATION_CAPABILITY\s*=\s*"\*"|contains\("\*"\)' "$delegation"; then
            echo 'Delegation boundary contains wildcard authority expansion.' >&2
            exit 1
          fi
          echo 'Governed delegation uses explicit coordinator capability, durable lineage, post-approval activation and no authority transfer.'

      - name: Verify scheduler and direct claims enforce worker specialist identity
        shell: bash
        run: |
          heartbeat=orchestrator-service/src/main/java/io/aetheris/orchestrator/scheduler/WorkerHeartbeatEntity.java
          identities=orchestrator-service/src/main/java/io/aetheris/orchestrator/scheduler/WorkerIdentityBindingService.java
          queue=orchestrator-service/src/main/java/io/aetheris/orchestrator/runtime/DurableWorkQueueService.java
          scheduler=orchestrator-service/src/main/java/io/aetheris/orchestrator/scheduler/SchedulerService.java
          capability=orchestrator-service/src/main/java/io/aetheris/orchestrator/stage9/CapabilityAwareDispatchService.java
          planner=orchestrator-service/src/main/java/io/aetheris/orchestrator/planner/MissionPlannerService.java
          grep -q 'getAgentId' "$heartbeat"
          grep -q 'already bound to specialist' "$heartbeat"
          grep -q 'agents.getRequired' "$identities"
          grep -q 'assertCanExecute' "$queue"
          grep -q 'canWorkerExecute' "$scheduler"
          grep -q 'canWorkerExecute' "$capability"
          grep -q 'enqueueForSpecialist' "$planner"
          if grep -nE 'requiredAgentId.*=.*"\*"|agentId.*=.*"\*"' "$identities" "$queue" "$scheduler"; then
            echo 'Worker identity boundary contains wildcard specialist authority.' >&2
            exit 1
          fi
          echo 'Worker heartbeat, direct claim and both scheduler paths preserve exact specialist identity.'

      - name: Verify direct effect paths consume specialist task authority
        shell: bash
        run: |
          authority=orchestrator-service/src/main/java/io/aetheris/orchestrator/task/DirectExecutionAuthorityService.java
          mcp=orchestrator-service/src/main/java/io/aetheris/orchestrator/mcp/McpToolInvocationService.java
          host=orchestrator-service/src/main/java/io/aetheris/orchestrator/host/HostCommandService.java
          request=orchestrator-service/src/main/java/io/aetheris/orchestrator/host/HostCommandRequest.java
          grep -q 'task.getState() != TaskState.RUNNING' "$authority"
          grep -q "task's active specialist" "$authority"
          grep -q 'allowedTools' "$authority"
          grep -q 'mode mismatch' "$authority"
          grep -q 'authority.requireRunningSpecialist(request.taskId(), request.agentId(), "mcp")' "$mcp"
          grep -q 'PRIVATE mode blocks remote MCP tool execution' "$mcp"
          grep -q 'authority.requireRunningSpecialist(request.taskId(), request.agentId(), "pc-control")' "$host"
          grep -q 'approvals.hasApproved(request.taskId(), REMOTE_APPROVAL_ACTION)' "$host"
          grep -q 'UUID taskId' "$request"
          grep -q 'String agentId' "$request"
          echo 'MCP and non-simulation host effects consume exact task-specialist authority before external execution.'
