name: RS256 mTLS backend API route boundary (review only)
on:
  pull_request:
    branches: [security/disposable-netty-mutual-tls-handshake-20261028]
    paths:
      - '.github/workflows/rs256-mtls-api-route-boundary.yml'
      - 'user-service/src/main/java/io/aetheris/users/security/**'
      - 'audit-service/src/main/java/io/aetheris/audit/security/**'
      - 'user-service/src/test/java/io/aetheris/users/security/**'
      - 'audit-service/src/test/java/io/aetheris/audit/security/**'
      - 'docs/security/RS256_MTLS_API_PATH_REVIEW_20261031.md'
permissions:
  contents: read
jobs:
  route-boundary:
    name: rs256-mtls-api-path-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact pull request head without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Use Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Assert exact head and release NO_GO
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python3 scripts/security_closure_preflight.py --assert-blocked > "$RUNNER_TEMP/aetheris-closure.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'aetheris-closure.json'
          result = json.loads(p.read_text())
          assert result['status'] == 'NO_GO'
          assert result['safe_to_merge_or_deploy'] is False
          print('RELEASE_NO_GO_CONFIRMED')
          PY
      - name: Test real User and Audit servlet JWT filter boundaries first
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -f user-service/pom.xml -Dtest=DirectApiJwtFilterTest test
          ./mvnw -B -ntp -f audit-service/pom.xml -Dtest=DirectApiJwtFilterTest test
      - name: Retain full four-module regression and RS256 mTLS protections
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -f pom.xml test
          echo 'RS256_MTLS_BACKEND_ROUTE_TESTS_PASSED_REVIEW_ONLY'
