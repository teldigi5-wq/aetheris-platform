name: Syntra Windows Credential Vault Safety

on:
  pull_request:
    branches:
      - feature/syntra-native-auth-readiness-20261013
      - main
    paths:
      - 'apps/syntra-desktop/security-vault/**'
      - 'tests/test_syntra_windows_vault_contract.py'
      - '.github/workflows/syntra-windows-vault.yml'
      - 'apps/syntra-desktop/README.md'

permissions:
  contents: read

jobs:
  source-security-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Validate inert native integration and Windows vault contract
        run: python3 -m unittest discover -s tests -p 'test_syntra_windows_vault_contract.py' -v
      - name: Run portable secret ownership and non-Windows denial tests
        working-directory: apps/syntra-desktop/security-vault
        run: |
          cargo generate-lockfile
          cargo test --locked
  windows-credential-manager:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Build isolated Windows vault with pinned dependencies
        working-directory: apps/syntra-desktop/security-vault
        shell: pwsh
        run: |
          cargo generate-lockfile
          cargo test --locked --no-run
      - name: Exercise disposable CI-only Credential Manager slot
        working-directory: apps/syntra-desktop/security-vault
        shell: pwsh
        env:
          SYNTRA_TEST_CREDENTIAL_VAULT: '1'
        run: cargo test --locked -- --test-threads=1
