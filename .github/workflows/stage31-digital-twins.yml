name: Stage 31 Digital Twins

on:
  push:
    branches:
      - stage-31-digital-twins-self-healing
      - feature/syntra-aetheris-foundation-v2
  pull_request:
    branches:
      - feature/syntra-aetheris-foundation-v2

permissions:
  contents: read

concurrency:
  group: stage31-digital-twins-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21.0.12'

jobs:
  stage31-foundation:
    name: Digital twin and bounded recovery tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Run Stage 31 foundation tests
        run: ./mvnw -f orchestrator-service/pom.xml -B -Dtest=Stage31FoundationTest test
      - name: Repeat Stage 31 tests to detect hidden state coupling
        run: ./mvnw -f orchestrator-service/pom.xml -B -Dtest=Stage31FoundationTest test
