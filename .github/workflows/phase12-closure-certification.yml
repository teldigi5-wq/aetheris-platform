name: Phase 12 Final Security and Authority Certification

on:
  pull_request:
    branches:
      - feature/syntra-aetheris-foundation-v2
  push:
    branches:
      - feature/syntra-aetheris-foundation-v2

jobs:
  phase12-final-certification:
    name: Phase 12 final certification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run consolidated Phase 12 authority and continuity proof
        run: >-
          ./mvnw -B -pl orchestrator-service
          -Dtest=Phase12SpecialistDivisionsIntegrationTest,Phase12SpecialistVerificationIntegrationTest,Phase12GovernedDelegationIntegrationTest,Phase12WorkerIdentityBindingIntegrationTest,Phase12DirectExecutionAuthorityTest,Phase12GitHubPublishAuthorityTest,Phase12ConnectorLiveAuthorityTest,Phase12SafeToolExecutionAuthorityTest,Phase12ConnectorAccountContinuityTest,Phase12OAuthLifecycleContinuityTest
          test

      - name: Verify Phase 12 proof surfaces remain present
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            docs/phase12-specialist-divisions.md
            docs/phase12-direct-execution-authority.md
            docs/phase12-github-publish-authority.md
            docs/phase12-connector-live-authority.md
            docs/phase12-safe-tool-execution-authority.md
            docs/phase12-browser-execution-authority.md
            docs/phase12-connector-account-continuity.md
            docs/phase12-oauth-lifecycle-continuity.md
            .github/workflows/phase12-specialist-divisions-proof.yml
            .github/workflows/phase12-connector-account-continuity-proof.yml
            .github/workflows/phase12-oauth-lifecycle-continuity-proof.yml
          )

          for required_file in "${required_files[@]}"; do
            test -f "$required_file" || {
              echo "Missing required Phase 12 proof surface: $required_file" >&2
              exit 1
            }
          done

          echo "All required Phase 12 proof surfaces are present."

      - name: Verify continuity fail-closed source guards
        shell: bash
        run: |
          set -euo pipefail

          executor='orchestrator-service/src/main/java/com/aetheris/orchestrator/connectors/LiveConnectorWriteExecutor.java'
          oauth_service='orchestrator-service/src/main/java/com/aetheris/orchestrator/oauth/OAuthTokenService.java'
          calendar_controller='orchestrator-service/src/main/java/com/aetheris/orchestrator/oauth/GoogleCalendarOAuthController.java'

          grep -Fq 'refresh-time connector account mismatch' "$executor"
          grep -Fq 'TOKEN_METADATA_STALE' "$executor"
          grep -Fq 'connector account mismatch' "$executor"
          grep -Fq 'connector identity disappeared' "$executor"

          grep -Fq 'refreshed.getRefreshToken()' "$oauth_service"
          grep -Fq 'oauthTokenRepository.delete(existing)' "$oauth_service"
          grep -Fq 'newRefreshCiphertext' "$oauth_service"

          grep -Fq 'VERIFIED_SCOPE_CLAIMS_COOKIE' "$calendar_controller"
          grep -Fq 'scopeClaims.add' "$calendar_controller"

          echo "Phase 12 continuity fail-closed source guards are intact."
