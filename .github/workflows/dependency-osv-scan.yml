name: Dependency OSV Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '35 4 * * 1'
  workflow_dispatch:

# Permission is restricted to reading dependencies and publishing Code Scanning evidence.
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  osv-pr:
    name: OSV new vulnerability check
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: '-r ./'
      fail-on-vuln: true
      upload-sarif: true

  osv-full:
    name: OSV full dependency scan
    if: github.event_name != 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: '-r ./'
      fail-on-vuln: true
      upload-sarif: true
