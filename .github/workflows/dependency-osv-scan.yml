name: Dependency OSV Scan

# Ported from stale PR #209. Pull requests fail only on vulnerabilities they INTRODUCE
# (base vs head). The full scan reports every known vulnerability to the Security tab
# without blocking, so pre-existing findings are triaged instead of freezing all CI.
on:
  pull_request:
    branches:
      - main
      - feature/syntra-aetheris-foundation-v2
  push:
    branches:
      - main
  schedule:
    - cron: '35 4 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  osv-pr:
    name: OSV new vulnerability check
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: '-r ./'
      fail-on-vuln: true
      upload-sarif: true

  osv-full:
    name: OSV full dependency scan
    if: github.event_name != 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: '-r ./'
      fail-on-vuln: false
      upload-sarif: true

  java-transitive:
    # The source scan above only sees the dependencies declared directly in each pom.xml
    # (Maven has no lockfile). This job resolves the full runtime dependency graph of each
    # service into a CycloneDX SBOM and scans that. Report-only until findings are triaged.
    name: OSV Java transitive dependency scan (SBOM)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Generate CycloneDX SBOMs (runtime scope)
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -q org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom \
            -DoutputFormat=json -DoutputName=bom -DincludeTestScope=false
          mkdir -p sbom
          for m in gateway identity-service user-service audit-service; do
            cp "$m/target/bom.json" "sbom/$m.cdx.json"
            echo "$m components: $(python3 -c "import json,sys;print(len(json.load(open(sys.argv[1])).get('components',[])))" "sbom/$m.cdx.json")"
          done
      - name: OSV scan of the SBOMs (report only)
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            -r
            ./sbom
