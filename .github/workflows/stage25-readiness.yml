name: Stage 25 First-Boot Readiness

on:
  push:
    branches: [ stage25-first-boot-readiness ]
  pull_request:
    branches: [ stage24-reproducible-build, main ]

permissions:
  contents: read

jobs:
  readiness-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python 3.13.15
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.15'

      - name: Compile Stage 25 verifier
        run: python -m py_compile scripts/first_boot_preflight.py

      - name: Run Stage 25 unit tests
        run: python -m unittest discover -s tests -p 'test_first_boot_preflight.py' -v

      - name: Run repository-side preflight
        run: |
          python scripts/first_boot_preflight.py \
            --mode ci \
            --evidence-dir build-evidence/readiness

      - name: Assert CI did not claim physical-PC validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('build-evidence/readiness/preflight-report.json').read_text())
          assert report['status'] == 'PASS', report
          assert report['physical_pc_status'] == 'NOT_TESTED', report
          print('Stage 25 truth boundary: PASS')
          PY

      - name: Upload Stage 25 readiness evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: stage25-first-boot-readiness
          path: build-evidence/readiness/
          if-no-files-found: error
