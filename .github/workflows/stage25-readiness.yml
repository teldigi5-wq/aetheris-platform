name: Stage 25 Platform + External AI Runtime Readiness

on:
  push:
    branches: [ feature/syntra-aetheris-foundation-v2 ]
  pull_request:
    branches: [ main, feature/syntra-aetheris-foundation-v2 ]

permissions:
  contents: read

jobs:
  readiness-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python 3.13.15
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.15'

      - name: Compile Stage 25 verifier
        run: python -m py_compile scripts/first_boot_preflight.py

      - name: Run Stage 25 unit tests
        run: python -m unittest discover -s tests -p 'test_first_boot_preflight.py' -v

      - name: Run platform plus external-runtime repository preflight
        run: |
          python scripts/first_boot_preflight.py \
            --mode ci \
            --evidence-dir build-evidence/readiness

      - name: Assert source-extracted ownership and physical-PC boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('build-evidence/readiness/preflight-report.json').read_text())
          reference = json.loads(Path('architecture/ai-runtime-certification-reference.json').read_text())

          expected_runtime = 'e2af887c13c6851ce950f04d093d190fe791f8fa'
          report_runtime = report['external_ai_runtime_certified_sha']

          assert report['status'] == 'PASS', report
          assert report['physical_pc_status'] == 'NOT_TESTED', report
          assert report['foundation_scope'] == 'aetheris-platform-external-ai-runtime-v1', report
          assert report['external_ai_runtime_repository'] == 'teldigi5-wq/aetheris-ai-runtime', report
          assert report_runtime == expected_runtime, report

          assert reference['status'] == 'DESTINATION_RUNTIME_CERTIFIED', reference
          assert reference['destination_runtime']['certified_sha'] == expected_runtime, reference
          assert reference['destination_runtime']['canonical_ci_status'] == '6_OF_6_SUCCESS', reference
          assert reference['source_root_deletion_status'] == 'SOURCE_EXTRACTED_TO_CERTIFIED_DESTINATION', reference
          assert reference['platform_runtime_source_present'] is False, reference
          assert reference['truth_boundaries']['physical_pc_status'] == 'BLOCKED_PENDING_HARDWARE', reference

          for source_dir in ('orchestrator-service', 'aetheris-quant', 'aetheris-reasoning', 'workstation-agent'):
              assert not Path(source_dir).exists(), source_dir

          print('Stage 25 source-extracted platform/external-runtime ownership boundary: PASS')
          PY

      - name: Upload Stage 25 readiness evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: stage25-platform-external-runtime-readiness
          path: build-evidence/readiness/
          if-no-files-found: error
