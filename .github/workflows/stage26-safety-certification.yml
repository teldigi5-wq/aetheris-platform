name: Stage 26 Platform Evidence Certification

on:
  push:
    branches: [ feature/syntra-aetheris-foundation-v2 ]
  pull_request:
    branches: [ main, feature/syntra-aetheris-foundation-v2 ]

permissions:
  contents: read

jobs:
  stage26-platform-certification:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python 3.13.15
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.15'

      - name: Compile platform-owned Stage 26 verifiers
        run: |
          python -m py_compile scripts/stage26/evidence_claim_guard.py
          python -m py_compile scripts/stage26/evidence_catalog.py

      - name: Run platform-owned Stage 26 tests
        run: python -m unittest discover -s tests -p 'test_stage26_evidence_integrity.py' -v

      - name: Verify pre-PC public truth boundary
        run: python scripts/stage26/evidence_claim_guard.py --output build/stage26/evidence-integrity.json

      - name: Generate platform evidence catalog - pass 1
        run: python scripts/stage26/evidence_catalog.py --output build/stage26/catalog-1.json

      - name: Generate platform evidence catalog - pass 2
        run: python scripts/stage26/evidence_catalog.py --output build/stage26/catalog-2.json

      - name: Compare platform evidence catalog bytes
        run: cmp build/stage26/catalog-1.json build/stage26/catalog-2.json

      - name: Assert Stage 26 extracted runtime ownership and truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          integrity = json.loads(Path('build/stage26/evidence-integrity.json').read_text())
          catalog = json.loads(Path('build/stage26/catalog-1.json').read_text())
          runtime = json.loads(Path('architecture/ai-runtime-certification-reference.json').read_text())
          expected_runtime = '65a6262717adcd52ac8d8a16ed6f223e299fd74d'

          assert integrity['status'] == 'PASS', integrity
          assert integrity['physicalPcStatus'] == 'BLOCKED_PENDING_HARDWARE', integrity
          assert all(value is False for value in integrity['hardBoundaries'].values()), integrity

          assert catalog['status'] == 'PASS', catalog
          assert catalog['physicalEvidenceIncluded'] is False, catalog
          assert not catalog['missingSources'], catalog

          assert runtime['status'] == 'DESTINATION_RUNTIME_CERTIFIED', runtime
          assert runtime['destination_runtime']['repository'] == 'teldigi5-wq/aetheris-ai-runtime', runtime
          assert runtime['destination_runtime']['certified_sha'] == expected_runtime, runtime
          assert runtime['destination_runtime']['canonical_ci_status'] == '6_OF_6_SUCCESS', runtime
          assert runtime['runtime_certifications']['stage26_runtime_safety'] == '.github/workflows/runtime-stage26-safety.yml', runtime
          assert runtime['source_root_deletion_status'] == 'SOURCE_EXTRACTED_TO_CERTIFIED_DESTINATION', runtime
          assert runtime['platform_runtime_source_present'] is False, runtime
          assert runtime['truth_boundaries']['physical_pc_status'] == 'BLOCKED_PENDING_HARDWARE', runtime

          for source_dir in ('orchestrator-service', 'aetheris-quant', 'aetheris-reasoning', 'workstation-agent'):
              assert not Path(source_dir).exists(), source_dir

          print('Stage 26 platform evidence certification + extracted runtime ownership: PASS')
          PY

      - name: Publish Stage 26 platform certification evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: stage26-platform-evidence-certification
          path: |
            build/stage26/evidence-integrity.json
            build/stage26/catalog-1.json
          if-no-files-found: error
          retention-days: 30
