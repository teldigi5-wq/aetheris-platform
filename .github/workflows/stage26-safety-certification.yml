name: Stage 26 Safety & Evidence Certification

on:
  push:
    branches: [ feature/syntra-aetheris-foundation-v2 ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  stage26-certification:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.13.15
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.15'

      - name: Compile Stage 26 verifiers
        run: |
          python -m py_compile scripts/stage26/safety_certification.py
          python -m py_compile scripts/stage26/evidence_claim_guard.py
          python -m py_compile scripts/stage26/evidence_catalog.py

      - name: Run all Stage 26 tests
        run: python -m unittest discover -s tests -p 'test_stage26*.py' -v

      - name: Verify pre-PC public truth boundary
        run: python scripts/stage26/evidence_claim_guard.py --output build/stage26/evidence-integrity.json

      - name: Generate evidence catalog - pass 1
        run: python scripts/stage26/evidence_catalog.py --output build/stage26/catalog-1.json

      - name: Generate evidence catalog - pass 2
        run: python scripts/stage26/evidence_catalog.py --output build/stage26/catalog-2.json

      - name: Compare evidence catalog bytes
        run: cmp build/stage26/catalog-1.json build/stage26/catalog-2.json

      - name: Generate safety evidence - pass 1
        run: python scripts/stage26/safety_certification.py --output-dir build/stage26/pass-1

      - name: Generate safety evidence - pass 2
        run: python scripts/stage26/safety_certification.py --output-dir build/stage26/pass-2

      - name: Compare safety evidence bytes
        run: |
          cmp build/stage26/pass-1/safety-report.json build/stage26/pass-2/safety-report.json
          cmp build/stage26/pass-1/manifest.sha256 build/stage26/pass-2/manifest.sha256

      - name: Assert Stage 26 truth boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('build/stage26/pass-1/safety-report.json').read_text())
          integrity = json.loads(Path('build/stage26/evidence-integrity.json').read_text())
          catalog = json.loads(Path('build/stage26/catalog-1.json').read_text())

          assert report['certification'] == 'PASS', report
          assert report['simulation_only'] is True, report
          assert report['live_side_effects'] is False, report
          assert report['external_action_attempted'] is False, report
          assert report['physical_pc_status'] == 'NOT_TESTED', report
          assert report['network_required'] is False, report
          assert report['shell_execution_required'] is False, report
          assert report['fail_count'] == 0, report

          assert integrity['status'] == 'PASS', integrity
          assert integrity['physicalPcStatus'] == 'BLOCKED_PENDING_HARDWARE', integrity
          assert all(value is False for value in integrity['hardBoundaries'].values()), integrity

          assert catalog['status'] == 'PASS', catalog
          assert catalog['physicalEvidenceIncluded'] is False, catalog
          assert not catalog['missingSources'], catalog

          print(
              f"Stage 26 certified {report['pass_count']} safety scenarios, "
              "pre-PC truth integrity, and deterministic repository evidence"
          )
          PY

      - name: Publish Stage 26 certification evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: stage26-safety-and-evidence-certification
          path: |
            build/stage26/evidence-integrity.json
            build/stage26/catalog-1.json
            build/stage26/pass-1/safety-report.json
            build/stage26/pass-1/manifest.sha256
          if-no-files-found: error
          retention-days: 30
