name: Stage 30 Reasoning

on:
  push:
    branches:
      - feature/syntra-aetheris-foundation-v2
      - stage-30-reconcile-canonical-v2
  pull_request:
    branches:
      - feature/syntra-aetheris-foundation-v2

permissions:
  contents: read

concurrency:
  group: stage30-reasoning-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12.11'

jobs:
  reasoning-control:
    name: Deterministic reasoning-control tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run Stage 30 tests
        working-directory: aetheris-reasoning
        run: python -m unittest discover -s tests -v
      - name: Repeat tests to catch hidden state coupling
        working-directory: aetheris-reasoning
        run: python -m unittest discover -s tests -v
