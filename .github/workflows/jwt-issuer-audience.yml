name: Aetheris JWT Issuer Audience Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'identity-service/**'
      - 'gateway/**'
      - 'docs/security/jwt-issuer-audience-contract.md'
      - '.github/workflows/jwt-issuer-audience.yml'

permissions:
  contents: read

jobs:
  identity-jwt:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout draft revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configure Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Test identity JWT issuer and account binding
        run: ./mvnw -B -f identity-service/pom.xml test

  gateway-jwt:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout draft revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configure Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.12'
          cache: maven
      - name: Test gateway JWT claim and header spoofing
        run: ./mvnw -B -f gateway/pom.xml test
