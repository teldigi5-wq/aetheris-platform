name: Phase 13 Structured Context Assembly

on:
  pull_request:
    branches:
      - feature/syntra-aetheris-foundation-v2
  push:
    branches:
      - feature/syntra-aetheris-foundation-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase13-structured-context-assembly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structured-context-assembly:
    name: Scoped context and citation proof
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Phase 13 structured context proof
        run: >-
          ./mvnw -B -f orchestrator-service/pom.xml
          -Dtest=Phase13ContextAssemblyTest
          test

      - name: Verify context assembly surfaces
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/ContextBudget.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/ContextAssemblyRequest.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/ContextEvidence.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/ContextQualityAssessment.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/ContextPack.java
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraContextAssemblyService.java
            orchestrator-service/src/test/java/io/aetheris/orchestrator/syntracore/Phase13ContextAssemblyTest.java
            docs/phase13-structured-context-assembly.md
          )

          for required_file in "${required_files[@]}"; do
            test -f "$required_file" || {
              echo "Missing Phase 13 context surface: $required_file" >&2
              exit 1
            }
          done

          grep -q "evidenceAddresses" orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/ModelInvocation.java
          grep -q "aetheris-memory://" orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/ModelInvocation.java
          grep -q "SyntraRetrievalService" orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraContextAssemblyService.java
          grep -q "Comparator.reverseOrder" orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraContextAssemblyService.java
          grep -q "untrusted reference data" orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/ContextPack.java
          grep -q "budgetOmittedCount" orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/ContextQualityAssessment.java

          if grep -R "HttpClient\|WebClient\|RestTemplate" \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/Context*.java \
            orchestrator-service/src/main/java/io/aetheris/orchestrator/syntracore/SyntraContextAssemblyService.java; then
            echo "Slice 4 context assembly must not add a network client" >&2
            exit 1
          fi

          echo "Phase 13 structured context assembly surfaces verified."
