name: Audit Flyway Postgres Migration Proof

on:
  push:
    branches: [security/audit-flyway-spring4-starter-20261023]
    paths:
      - 'audit-service/**'
      - 'docker-compose.yml'
      - '.github/workflows/audit-flyway-postgres-proof.yml'
  pull_request:
    branches: [security/spring4-amqp-jackson3-compat-20261023]
    paths:
      - 'audit-service/**'
      - 'docker-compose.yml'
      - '.github/workflows/audit-flyway-postgres-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-flyway-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-flyway:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: aetheris_flyway_ci
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify starter dependency and unchanged existing migration
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          root = ElementTree.parse('audit-service/pom.xml').getroot()
          ns={'m':'http://maven.apache.org/POM/4.0.0'}
          deps = [e.text for e in root.findall('m:dependencies/m:dependency/m:artifactId',ns)]
          assert 'spring-boot-starter-flyway' in deps
          assert 'flyway-database-postgresql' in deps
          assert 'flyway-core' not in deps
          yml = Path('audit-service/src/main/resources/application.yml').read_text()
          assert 'flyway_audit_schema_history' in yml
          assert 'baseline-version: "0"' in yml
          sql = Path('audit-service/src/main/resources/db/migration/V1__create_audit_events.sql').read_text()
          assert 'CREATE TABLE IF NOT EXISTS audit_events' in sql
          assert 'idx_audit_events_occurred_at' in sql
          print('AUDIT_FLYWAY_SOURCE_CONTRACT_PASS')
          PY
      - name: Generate synthetic disposable secrets
        shell: bash
        run: |
          set -euo pipefail
          for key in AETHERIS_POSTGRES_PASSWORD AETHERIS_RABBITMQ_PASSWORD AETHERIS_REDIS_PASSWORD AETHERIS_JWT_SECRET AETHERIS_GRAFANA_ADMIN_PASSWORD; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done
      - name: Start isolated PostgreSQL and RabbitMQ
        run: docker compose up -d --wait postgres rabbitmq
      - name: Prove disposable database begins without Audit schema
        shell: bash
        run: |
          set -euo pipefail
          result="$(docker compose exec -T postgres psql -U aetheris -d aetheris -Atqc "SELECT COALESCE(to_regclass('public.audit_events')::text, 'absent')")"
          test "$result" = "absent" || { echo "PREEXISTING_AUDIT_TABLE_UNEXPECTED"; exit 1; }
      - name: Start actual Audit Service with Flyway starter
        run: docker compose up -d --build audit-service
      - name: Verify existing Flyway V1 migrated real PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:8083/actuator/health | grep -q '"status":"UP"'; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --max-time 5 http://127.0.0.1:8083/actuator/health | grep -q '"status":"UP"'
          psqlq() { docker compose exec -T postgres psql -U aetheris -d aetheris -Atqc "$1"; }
          test "$(psqlq "SELECT to_regclass('public.audit_events') IS NOT NULL")" = "t"
          test "$(psqlq "SELECT to_regclass('public.flyway_audit_schema_history') IS NOT NULL")" = "t"
          test "$(psqlq "SELECT to_regclass('public.idx_audit_events_occurred_at') IS NOT NULL")" = "t"
          test "$(psqlq "SELECT count(*) FROM public.flyway_audit_schema_history WHERE version='1' AND success=true")" = "1"
          echo "AUDIT_FLYWAY_V1_MIGRATION_POSTGRES_PASS"
      - name: Prove data survives Audit restart and migration remains once-only
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T postgres psql -U aetheris -d aetheris -v ON_ERROR_STOP=1 -q -c "INSERT INTO audit_events(event_id,event_type,occurred_at,user_id,name,email) VALUES ('ci-flyway-restart-event','CI_PROOF',CURRENT_TIMESTAMP,42,'CI Synthetic','ci@example.invalid')"
          docker compose restart audit-service
          for attempt in $(seq 1 90); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:8083/actuator/health | grep -q '"status":"UP"'; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --max-time 5 http://127.0.0.1:8083/actuator/health | grep -q '"status":"UP"'
          psqlq() { docker compose exec -T postgres psql -U aetheris -d aetheris -Atqc "$1"; }
          test "$(psqlq "SELECT count(*) FROM audit_events WHERE event_id='ci-flyway-restart-event'")" = "1"
          test "$(psqlq "SELECT count(*) FROM public.flyway_audit_schema_history WHERE version='1' AND success=true")" = "1"
          echo "AUDIT_FLYWAY_RESTART_DATA_PRESERVATION_PASS"
      - name: Report synthetic Compose diagnostics on failure
        if: failure()
        run: |
          docker compose ps --all || true
          docker compose logs --no-color --tail=90 audit-service postgres || true
      - name: Tear down ONLY job-scoped disposable data
        if: always()
        run: docker compose down --volumes --remove-orphans
