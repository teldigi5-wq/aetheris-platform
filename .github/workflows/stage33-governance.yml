name: Stage 33 Governance

on:
  push:
    branches:
      - stage-33-governance-approvals-policy
      - feature/syntra-aetheris-foundation-v2
  pull_request:
    branches:
      - feature/syntra-aetheris-foundation-v2

permissions:
  contents: read

concurrency:
  group: stage33-governance-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21.0.12'

jobs:
  stage33-governance:
    name: Cross-system governance and approval tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Run Stage 33 governance tests
        run: ./mvnw -f orchestrator-service/pom.xml -B -Dtest=Stage33GovernanceTest test
      - name: Repeat Stage 33 tests to detect hidden state coupling
        run: ./mvnw -f orchestrator-service/pom.xml -B -Dtest=Stage33GovernanceTest test
