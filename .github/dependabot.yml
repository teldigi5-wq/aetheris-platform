version: 2
updates:
  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dashboard-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /aetheris-quant
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      quant-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: maven
    directory: /gateway
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5

  - package-ecosystem: maven
    directory: /user-service
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5

  - package-ecosystem: maven
    directory: /identity-service
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5

  - package-ecosystem: maven
    directory: /audit-service
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5

  - package-ecosystem: maven
    directory: /orchestrator-service
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5

  - package-ecosystem: maven
    directory: /workstation-agent
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
