version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      dashboard-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/aetheris-quant"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      quant-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Treat the Java services as one monorepo dependency surface. Dependabot
  # groups the same Maven dependency across modules into one reviewable PR
  # instead of opening near-identical PRs for every service.
  - package-ecosystem: "maven"
    directories:
      - "/gateway"
      - "/user-service"
      - "/identity-service"
      - "/audit-service"
      - "/orchestrator-service"
      - "/workstation-agent"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 4
    groups:
      maven-by-dependency:
        patterns:
          - "*"
        group-by: "dependency-name"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      github-actions-updates:
        patterns:
          - "*"
