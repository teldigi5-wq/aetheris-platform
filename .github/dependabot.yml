version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/dashboard"
    schedule:
      interval: "weekly"
      day: "monday"
    # Keep the repository visually clean: disable routine version-update PRs.
    # Dependabot security update PRs remain independent of this limit.
    open-pull-requests-limit: 0
    groups:
      dashboard-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Treat the platform-owned Java services as one dependency surface.
  # Runtime-owned services are monitored in aetheris-ai-runtime.
  - package-ecosystem: "maven"
    directories:
      - "/gateway"
      - "/user-service"
      - "/identity-service"
      - "/audit-service"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    groups:
      maven-by-dependency:
        patterns:
          - "*"
        group-by: "dependency-name"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    groups:
      github-actions-updates:
        patterns:
          - "*"
