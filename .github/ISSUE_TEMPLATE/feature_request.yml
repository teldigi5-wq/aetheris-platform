name: Feature request
description: Propose a focused improvement to Aetheris
title: "feat: "
body:
  - type: markdown
    attributes:
      value: |
        Good proposals explain the problem first, then the solution and trade-offs.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What engineering or user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Describe the smallest useful change and where it fits in the architecture.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
      description: What other approaches were considered and why might they be better or worse?
  - type: textarea
    id: validation
    attributes:
      label: How should success be validated?
      description: Tests, metrics, behavior, operational checks or acceptance criteria.
