{{- /*
Fail closed unless the installer explicitly opts into the repository's local
learning/demo defaults. Non-local renders must replace every bundled demo
credential and use digest-pinned images.
*/ -}}
{{- /* Redis must use an independent, nontrivial credential in EVERY mode. */ -}}
{{- $redisSecret := .Values.secrets.redisPassword | default "" | toString -}}
{{- if lt (len (trim $redisSecret)) 32 -}}
  {{- fail "unsafe Helm Redis configuration: secrets.redisPassword requires 32+ non-whitespace characters from a protected secret source" -}}
{{- end -}}
{{- if or (eq $redisSecret (.Values.secrets.jwtSecret | toString)) (eq $redisSecret (.Values.secrets.postgresPassword | toString)) (eq $redisSecret (.Values.secrets.rabbitmqPassword | toString)) -}}
  {{- fail "unsafe Helm Redis configuration: secrets.redisPassword must be independent of JWT, PostgreSQL and RabbitMQ credentials" -}}
{{- end -}}
{{- if not .Values.global.allowInsecureLocalDefaults -}}
  {{- /* Reject missing/short credentials before the existing known-demo guards. */ -}}
  {{- $requiredCredentials := dict
    "secrets.jwtSecret" (.Values.secrets.jwtSecret | default "" | toString)
    "secrets.postgresPassword" (.Values.secrets.postgresPassword | default "" | toString)
    "secrets.rabbitmqPassword" (.Values.secrets.rabbitmqPassword | default "" | toString)
  -}}
  {{- range $name, $value := $requiredCredentials -}}
    {{- if lt (len (trim $value)) 32 -}}
      {{- fail (printf "unsafe Helm non-local credential: %s requires 32+ non-whitespace characters from a protected source" $name) -}}
    {{- end -}}
  {{- end -}}
  {{- $jwt := .Values.secrets.jwtSecret | toString -}}
  {{- $pg := .Values.secrets.postgresPassword | toString -}}
  {{- $rabbit := .Values.secrets.rabbitmqPassword | toString -}}
  {{- if or (eq $jwt $pg) (eq $jwt $rabbit) (eq $pg $rabbit) -}}
    {{- fail "unsafe Helm non-local credentials: JWT, PostgreSQL and RabbitMQ passwords must all be independent" -}}
  {{- end -}}
  {{- if eq (trim (.Values.secrets.rabbitmqUsername | default "" | toString)) "" -}}
    {{- fail "unsafe Helm non-local RabbitMQ username: a nonempty explicit username is required" -}}
  {{- end -}}
  {{- if eq .Values.secrets.jwtSecret "change-me-local-development-secret-32chars" -}}
    {{- fail "unsafe Helm default: replace secrets.jwtSecret or explicitly opt into values-local.yaml for local development" -}}
  {{- end -}}
  {{- if eq .Values.secrets.postgresPassword "aetheris" -}}
    {{- fail "unsafe Helm default: replace secrets.postgresPassword or explicitly opt into values-local.yaml for local development" -}}
  {{- end -}}
  {{- if eq .Values.secrets.rabbitmqPassword "aetheris" -}}
    {{- fail "unsafe Helm default: replace secrets.rabbitmqPassword or explicitly opt into values-local.yaml for local development" -}}
  {{- end -}}
  {{- range $name, $image := .Values.images -}}
    {{- if not (contains "@sha256:" $image) -}}
      {{- fail (printf "unsafe Helm image reference: images.%s must be digest-pinned for non-local installs (got %s)" $name $image) -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
