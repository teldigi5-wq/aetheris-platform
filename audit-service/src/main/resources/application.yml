server:
  port: 8083

spring:
  application:
    name: aetheris-audit-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aetheris}
    username: ${SPRING_DATASOURCE_USERNAME:aetheris}
    password: ${SPRING_DATASOURCE_PASSWORD:aetheris}
  flyway:
    enabled: true
    table: flyway_audit_schema_history
    baseline-on-migrate: true
    baseline-version: "0"
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:aetheris}
    password: ${SPRING_RABBITMQ_PASSWORD:aetheris}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

info:
  app:
    name: Aetheris Audit Service
    stage: 5
