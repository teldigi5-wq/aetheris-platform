server:
  port: 8083

spring:
  application:
    name: aetheris-audit-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aetheris}
    username: ${SPRING_DATASOURCE_USERNAME:aetheris}
    password: ${SPRING_DATASOURCE_PASSWORD:aetheris}
  flyway:
    enabled: true
    table: flyway_audit_schema_history
    baseline-on-migrate: true
    baseline-version: "0"
  rabbitmq:
    # CI-only least-privilege roles use pre-created topology and a dedicated vhost.
    # The legacy runtime retains its original defaults until owner migration.
    dynamic: ${SPRING_RABBITMQ_DYNAMIC:true}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/}
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:aetheris}
    password: ${SPRING_RABBITMQ_PASSWORD:aetheris}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

info:
  app:
    name: Aetheris Audit Service
    stage: 5

# A missing signing key fails startup; never accept an implicit development secret.
aetheris:
  # Only the public verifier key belongs in Audit; never copy the private key.
  audit-origin:
    required: ${AETHERIS_AUDIT_ORIGIN_VERIFY_REQUIRED:false}
    public-key-pem: ${AETHERIS_AUDIT_ORIGIN_PUBLIC_KEY_PEM:}
    key-id: ${AETHERIS_AUDIT_ORIGIN_KEY_ID:}
  jwt:
    secret: ${AETHERIS_JWT_SECRET:}
    algorithm: ${AETHERIS_JWT_ALGORITHM:HS256}
    rsa-public-key-pem: ${AETHERIS_JWT_RSA_PUBLIC_KEY_PEM:}
    key-id: ${AETHERIS_JWT_RS256_KEY_ID:}
    issuer: ${AETHERIS_JWT_ISSUER:aetheris-identity}
    audience: ${AETHERIS_JWT_AUDIENCE:aetheris-api}
  gateway:
    workload-mtls-required: ${AETHERIS_BACKEND_GATEWAY_MTLS_REQUIRED:false}
    workload-spiffe-id: ${AETHERIS_BACKEND_GATEWAY_SPIFFE_ID:}
