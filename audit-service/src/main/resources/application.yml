aetheris:
  jwt:
    secret: ${AETHERIS_JWT_SECRET}
    issuer: ${AETHERIS_JWT_ISSUER:aetheris-identity}
    audience: ${AETHERIS_JWT_AUDIENCE:aetheris-api}

server:
  port: 8083

spring:
  application:
    name: aetheris-audit-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aetheris}
    username: ${SPRING_DATASOURCE_USERNAME:aetheris}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
    table: flyway_audit_schema_history
    # Fail closed on nonempty databases without approved Flyway history.
    # Existing installations require reviewed migration ownership/baseline approval.
    baseline-on-migrate: false
    baseline-version: "0"
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:aetheris}
    password: ${SPRING_RABBITMQ_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

info:
  app:
    name: Aetheris Audit Service
    stage: 5
