server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;

  # The browser keeps using the public /api/auth/* contract, but these exact
  # routes are internally mapped to the cookie-backed browser auth surface.
  # Nginx supplies the trusted dashboard marker and the original browser Host;
  # the Identity Service independently compares that Host with the Origin.
  location = /api/auth/register {
    proxy_pass http://gateway:8080/api/auth/browser/register;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Aetheris-Browser "aetheris-dashboard-v1";
    proxy_set_header X-Aetheris-Browser-Host $http_host;
  }

  location = /api/auth/login {
    proxy_pass http://gateway:8080/api/auth/browser/login;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Aetheris-Browser "aetheris-dashboard-v1";
    proxy_set_header X-Aetheris-Browser-Host $http_host;
  }

  location = /api/auth/refresh {
    proxy_pass http://gateway:8080/api/auth/browser/refresh;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Aetheris-Browser "aetheris-dashboard-v1";
    proxy_set_header X-Aetheris-Browser-Host $http_host;
  }

  location = /api/auth/logout {
    proxy_pass http://gateway:8080/api/auth/browser/logout;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Aetheris-Browser "aetheris-dashboard-v1";
    proxy_set_header X-Aetheris-Browser-Host $http_host;
  }

  # The implementation-specific browser auth paths are not public dashboard URLs.
  location ^~ /api/auth/browser/ {
    return 404;
  }

  location /api/ {
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /actuator/health {
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /actuator/ {
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}