name: aetheris-xerj-disposable-review
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: xerj_ci
      POSTGRES_USER: xerj_ci
      POSTGRES_PASSWORD: ${XERJ_TEST_PG_PASSWORD:?Ephemeral test-only PostgreSQL credential required}
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xerj_ci -d xerj_ci"]
      interval: 3s
      timeout: 2s
      retries: 25
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 25
  rabbitmq:
    image: rabbitmq:4-alpine
    environment:
      RABBITMQ_DEFAULT_USER: xerj_ci
      RABBITMQ_DEFAULT_PASS: ${XERJ_TEST_RABBIT_PASSWORD:?Ephemeral test-only RabbitMQ credential required}
    ports:
      - "127.0.0.1:55672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
