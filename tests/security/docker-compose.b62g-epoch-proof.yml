# B62-G ONLY: named volume is created for this throwaway GitHub runner and
# unconditionally removed by the proof script. Never compose with live stacks.
name: aetheris-b62g-epoch-proof
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: b62g_synthetic
      POSTGRES_USER: b62g_synthetic
      POSTGRES_PASSWORD: test-only-b62g-never-use-in-production
    networks: [isolated]
    volumes:
      - b62g_disposable_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U b62g_synthetic -d b62g_synthetic"]
      interval: 2s
      timeout: 3s
      retries: 30
networks:
  isolated:
    internal: true
volumes:
  b62g_disposable_data:
