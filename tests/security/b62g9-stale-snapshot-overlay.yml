# B62-G9 CI-ONLY: deliberately independent stale-snapshot DB, NOT an
# actual physical/logical streaming replica or production failover topology.
# There are NO host ports, no external network, no real database credentials.
services:
  stale-snapshot:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: b62g_synthetic
      POSTGRES_USER: b62g_synthetic
      POSTGRES_PASSWORD: test-only-b62g-never-use-in-production
    networks: [isolated]
    volumes:
      - b62g9_stale_snapshot_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U b62g_synthetic -d b62g_synthetic"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  b62g9_stale_snapshot_data:
