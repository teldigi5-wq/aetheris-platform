services:
  gateway:
    environment:
      AETHERIS_JWT_PREVIOUS_KEY_NOT_AFTER_EPOCH_SECONDS: ${B61_CI_LIVE_CUTOFF:?CI-only-UTC-expiry-required}
  user-service:
    environment:
      AETHERIS_JWT_PREVIOUS_KEY_NOT_AFTER_EPOCH_SECONDS: ${B61_CI_LIVE_CUTOFF:?CI-only-UTC-expiry-required}
  audit-service:
    environment:
      AETHERIS_JWT_PREVIOUS_KEY_NOT_AFTER_EPOCH_SECONDS: ${B61_CI_LIVE_CUTOFF:?CI-only-UTC-expiry-required}
