# B4T — ONLY on disposable internal Compose test network, never production.
# Actual Audit Spring Flyway starter and existing V1 migration, NO new DDL in src/main.
services:
  audit-fresh:
    image: aetheris-b4t-audit-test-only:local
    build:
      context: ../../audit-service
    environment:
      AETHERIS_JWT_SECRET: test-only-direct-backend-auth-hmac-secret-at-least-32-bytes
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aetheris_audit_fresh
      SPRING_DATASOURCE_USERNAME: probe
      SPRING_DATASOURCE_PASSWORD: test-only-ephemeral-postgres-password
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "false"
      SPRING_FLYWAY_TABLE: flyway_audit_schema_history
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: probe
      SPRING_RABBITMQ_PASSWORD: test-only-ephemeral-rabbitmq-password
      SPRING_RABBITMQ_LISTENER_SIMPLE_AUTO_STARTUP: "false"
      SPRING_RABBITMQ_LISTENER_DIRECT_AUTO_STARTUP: "false"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0"
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    networks: [probe]

  audit-second:
    image: aetheris-b4t-audit-test-only:local
    environment:
      AETHERIS_JWT_SECRET: test-only-direct-backend-auth-hmac-secret-at-least-32-bytes
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aetheris_audit_fresh
      SPRING_DATASOURCE_USERNAME: probe
      SPRING_DATASOURCE_PASSWORD: test-only-ephemeral-postgres-password
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "false"
      SPRING_FLYWAY_TABLE: flyway_audit_schema_history
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: probe
      SPRING_RABBITMQ_PASSWORD: test-only-ephemeral-rabbitmq-password
      SPRING_RABBITMQ_LISTENER_SIMPLE_AUTO_STARTUP: "false"
      SPRING_RABBITMQ_LISTENER_DIRECT_AUTO_STARTUP: "false"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0"
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    networks: [probe]

  audit-shared-refusal:
    image: aetheris-b4t-audit-test-only:local
    environment:
      AETHERIS_JWT_SECRET: test-only-direct-backend-auth-hmac-secret-at-least-32-bytes
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aetheris_audit_nonempty
      SPRING_DATASOURCE_USERNAME: probe
      SPRING_DATASOURCE_PASSWORD: test-only-ephemeral-postgres-password
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "false"
      SPRING_FLYWAY_TABLE: flyway_audit_schema_history
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: probe
      SPRING_RABBITMQ_PASSWORD: test-only-ephemeral-rabbitmq-password
      SPRING_RABBITMQ_LISTENER_SIMPLE_AUTO_STARTUP: "false"
      SPRING_RABBITMQ_LISTENER_DIRECT_AUTO_STARTUP: "false"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0"
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    networks: [probe]

  audit-history-probe:
    image: python:3.12-slim-bookworm
    entrypoint: ["python", "/opt/probe.py"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=16777216"]
    volumes:
      - ./probe_audit_flyway_history.py:/opt/probe.py:ro
      - ../../identity-service/target/identity-jwt-contract:/opt/tokens:ro
    networks: [probe]
