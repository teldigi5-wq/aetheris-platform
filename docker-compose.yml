services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aetheris
      POSTGRES_USER: aetheris
      POSTGRES_PASSWORD: aetheris
    ports:
      - "5432:5432"
    volumes:
      - aetheris_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aetheris -d aetheris"]
      interval: 5s
      timeout: 3s
      retries: 10

  user-service:
    build: ./user-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aetheris
      SPRING_DATASOURCE_USERNAME: aetheris
      SPRING_DATASOURCE_PASSWORD: aetheris
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"

  gateway:
    build: ./gateway
    depends_on:
      - user-service
    ports:
      - "8080:8080"

  dashboard:
    build: ./dashboard
    depends_on:
      - gateway
    ports:
      - "3000:80"

volumes:
  aetheris_pg:
